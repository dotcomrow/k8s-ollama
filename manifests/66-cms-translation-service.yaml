apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cms-translation-service-openwebui
  namespace: ollama
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault-store-ollama
  target:
    name: cms-translation-service
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: OPENWEBUI_API_TOKEN
      remoteRef:
        key: openwebui-cms-translation-token
        property: value
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cms-translation-service
  namespace: ollama
data:
  requirements.txt: |
    fastapi==0.115.5
    httpx==0.27.2
    uvicorn==0.30.6
  app.py: |
    import json
    import os
    import re
    from typing import Any, Dict, Optional

    import httpx
    from fastapi import FastAPI, HTTPException
    from pydantic import BaseModel, Field

    APP_VERSION = "1.1.0"
    OPENWEBUI_BASE_URL = os.environ.get("OPENWEBUI_BASE_URL", "http://open-webui.ollama.svc.cluster.local:80").rstrip("/")
    OPENWEBUI_CHAT_COMPLETIONS_PATH = os.environ.get("OPENWEBUI_CHAT_COMPLETIONS_PATH", "/api/chat/completions")
    OPENWEBUI_API_TOKEN = os.environ.get("OPENWEBUI_API_TOKEN", "").strip()
    OPENWEBUI_MODEL = os.environ.get("OPENWEBUI_MODEL", "deepseek-r1:14b")
    REQUEST_TIMEOUT_SECONDS = float(os.environ.get("REQUEST_TIMEOUT_SECONDS", "180"))
    PROMPT_VERSION = os.environ.get("PROMPT_VERSION", "cms-json-translation-v2")
    LANGUAGE_PATTERN = re.compile(r"^[A-Za-z]{1,8}(?:-[A-Za-z0-9]{1,8}){0,8}$")
    MODEL_PATTERN = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._:/+-]{0,127}$")

    app = FastAPI(title="CMS Translation Service", version=APP_VERSION)

    class TranslateRequest(BaseModel):
      source_language: str = "en"
      target_language: Optional[str] = None
      requested_language_code: Optional[str] = None
      source_language_code: Optional[str] = None
      content_item_id: Optional[str] = None
      source_content_version: Optional[int] = None
      source_hash: Optional[str] = None
      model: Optional[str] = None
      translation_model: Optional[str] = None
      content_item: Optional[Dict[str, Any]] = None
      content_json: Dict[str, Any] = Field(default_factory=dict)

    class TranslateResponse(BaseModel):
      target_language: str
      language_code: str
      status: str = "published"
      content_item_id: Optional[str] = None
      source_content_version: Optional[int] = None
      source_hash: Optional[str] = None
      content_json: Dict[str, Any]
      model: str
      prompt_version: str
      translated_by: str = "cms-translation-service"

    def normalize_language(value: Optional[str]) -> str:
      candidate = (value or "").strip().replace("_", "-")
      if not candidate or not LANGUAGE_PATTERN.match(candidate):
        return "en"
      return candidate

    def require_language(value: Optional[str], field_name: str) -> str:
      candidate = (value or "").strip().replace("_", "-")
      if not candidate or not LANGUAGE_PATTERN.match(candidate):
        raise HTTPException(status_code=422, detail=f"{field_name} must be a valid language code.")
      return candidate

    def resolve_model(value: Optional[str]) -> str:
      candidate = (value or "").strip()
      if not candidate:
        return OPENWEBUI_MODEL
      if not MODEL_PATTERN.match(candidate):
        raise HTTPException(status_code=422, detail="model must be a valid Ollama/OpenWebUI model id.")
      return candidate

    def resolve_translation_context(request: TranslateRequest) -> Dict[str, Any]:
      content_item = request.content_item if isinstance(request.content_item, dict) else {}
      content_json = request.content_json
      if not content_json and isinstance(content_item.get("content_json"), dict):
        content_json = content_item["content_json"]
      if not isinstance(content_json, dict):
        raise HTTPException(status_code=422, detail="content_json must be a JSON object.")

      source_content_version = request.source_content_version
      if source_content_version is None and content_item.get("content_version") is not None:
        try:
          source_content_version = int(content_item["content_version"])
        except (TypeError, ValueError) as exc:
          raise HTTPException(status_code=422, detail="content_item.content_version must be an integer.") from exc

      content_item_id = request.content_item_id
      if not content_item_id and content_item.get("id") is not None:
        content_item_id = str(content_item["id"])

      source_hash = request.source_hash
      if not source_hash and content_item.get("source_hash") is not None:
        source_hash = str(content_item["source_hash"])

      return {
        "source_language": normalize_language(request.source_language_code or request.source_language),
        "target_language": require_language(request.target_language or request.requested_language_code, "target_language"),
        "content_item_id": content_item_id,
        "source_content_version": source_content_version,
        "source_hash": source_hash,
        "model": resolve_model(request.model or request.translation_model),
        "content_json": content_json,
      }

    def strip_json_fence(value: str) -> str:
      text = value.strip()
      if text.startswith("```"):
        text = re.sub(r"^```(?:json)?\s*", "", text, flags=re.IGNORECASE)
        text = re.sub(r"\s*```$", "", text)
      return text.strip()

    def extract_openwebui_text(payload: Dict[str, Any]) -> str:
      choices = payload.get("choices")
      if isinstance(choices, list) and choices:
        message = choices[0].get("message") if isinstance(choices[0], dict) else None
        if isinstance(message, dict) and isinstance(message.get("content"), str):
          return message["content"]
        if isinstance(choices[0].get("text"), str):
          return choices[0]["text"]
      if isinstance(payload.get("content"), str):
        return payload["content"]
      raise HTTPException(status_code=502, detail="OpenWebUI response did not contain model text.")

    async def call_openwebui(model: str, source_language: str, target_language: str, content_json: Dict[str, Any]) -> Dict[str, Any]:
      system_prompt = (
        "Translate CMS JSON content from the source language to the target language. "
        "Return only the translated content_json object as valid JSON, not the full request envelope. "
        "Preserve all object keys, array order, value types, URLs, IDs, code blocks, template tokens, "
        "and HTML tags. Translate human-readable text values only."
      )
      user_prompt = json.dumps(
        {
          "source_language": source_language,
          "target_language": target_language,
          "content_json": content_json,
        },
        ensure_ascii=False,
      )
      headers = {"Accept": "application/json", "Content-Type": "application/json"}
      if OPENWEBUI_API_TOKEN:
        headers["Authorization"] = f"Bearer {OPENWEBUI_API_TOKEN}"
      body = {
        "model": model,
        "messages": [
          {"role": "system", "content": system_prompt},
          {"role": "user", "content": user_prompt},
        ],
        "temperature": 0,
      }
      async with httpx.AsyncClient(timeout=REQUEST_TIMEOUT_SECONDS) as client:
        response = await client.post(
          f"{OPENWEBUI_BASE_URL}{OPENWEBUI_CHAT_COMPLETIONS_PATH}",
          headers=headers,
          json=body,
        )
        response.raise_for_status()
      text = strip_json_fence(extract_openwebui_text(response.json()))
      try:
        translated = json.loads(text)
      except json.JSONDecodeError as exc:
        raise HTTPException(status_code=502, detail=f"Model returned invalid JSON: {exc}") from exc
      if not isinstance(translated, dict):
        raise HTTPException(status_code=502, detail="Model returned JSON but not an object.")
      return translated

    def normalize_translated_content(translated: Dict[str, Any]) -> Dict[str, Any]:
      nested = translated.get("content_json")
      envelope_keys = {"content_json", "source_language", "target_language", "language_code", "target_language_code"}
      if isinstance(nested, dict) and set(translated.keys()).issubset(envelope_keys):
        return nested
      return translated

    @app.get("/healthz")
    async def healthz() -> Dict[str, Any]:
      return {
        "ok": True,
        "version": APP_VERSION,
        "openwebui_base_url": OPENWEBUI_BASE_URL,
        "model": OPENWEBUI_MODEL,
        "default_model": OPENWEBUI_MODEL,
        "has_openwebui_token": bool(OPENWEBUI_API_TOKEN),
      }

    @app.post("/translate-content-json", response_model=TranslateResponse)
    async def translate_content_json(request: TranslateRequest) -> TranslateResponse:
      context = resolve_translation_context(request)
      target_language = context["target_language"]
      model = context["model"]
      if target_language.lower() == context["source_language"].lower():
        translated = context["content_json"]
      else:
        translated = await call_openwebui(model, context["source_language"], target_language, context["content_json"])
      translated = normalize_translated_content(translated)
      return TranslateResponse(
        target_language=target_language,
        language_code=target_language,
        content_item_id=context["content_item_id"],
        source_content_version=context["source_content_version"],
        source_hash=context["source_hash"],
        content_json=translated,
        model=model,
        prompt_version=PROMPT_VERSION,
      )
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cms-translation-service
  namespace: ollama
---
apiVersion: v1
kind: Service
metadata:
  name: cms-translation-service
  namespace: ollama
spec:
  selector:
    app: cms-translation-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cms-translation-service
  namespace: ollama
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cms-translation-service
  template:
    metadata:
      labels:
        app: cms-translation-service
      annotations:
        linkerd.io/inject: "enabled"
        reloader.stakater.com/auto: "true"
    spec:
      serviceAccountName: cms-translation-service
      containers:
        - name: app
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: OPENWEBUI_BASE_URL
              value: "http://open-webui.ollama.svc.cluster.local:80"
            - name: OPENWEBUI_CHAT_COMPLETIONS_PATH
              value: "/api/chat/completions"
            - name: OPENWEBUI_MODEL
              value: "deepseek-r1:14b"
            - name: PROMPT_VERSION
              value: "cms-json-translation-v2"
            - name: REQUEST_TIMEOUT_SECONDS
              value: "180"
            - name: OPENWEBUI_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cms-translation-service
                  key: OPENWEBUI_API_TOKEN
                  optional: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              pip install --no-cache-dir -r /app/requirements.txt >/dev/null
              python -m uvicorn app:app --app-dir /app --host 0.0.0.0 --port 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: app
              mountPath: /app
      volumes:
        - name: app
          configMap:
            name: cms-translation-service
