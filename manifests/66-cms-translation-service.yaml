apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cms-translation-service-openwebui
  namespace: ollama
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault-store-ollama
  target:
    name: cms-translation-service
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: OPENWEBUI_API_TOKEN
      remoteRef:
        key: openwebui-cms-translation-token
        property: value
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cms-translation-service
  namespace: ollama
data:
  requirements.txt: |
    fastapi==0.115.5
    httpx==0.27.2
    uvicorn==0.30.6
  app.py: |
    import copy
    import json
    import os
    import re
    from typing import Any, Dict, List, Optional

    import httpx
    from fastapi import FastAPI, HTTPException
    from pydantic import BaseModel, Field

    APP_VERSION = "1.2.0"
    OPENWEBUI_BASE_URL = os.environ.get("OPENWEBUI_BASE_URL", "http://open-webui.ollama.svc.cluster.local:80").rstrip("/")
    OPENWEBUI_CHAT_COMPLETIONS_PATH = os.environ.get("OPENWEBUI_CHAT_COMPLETIONS_PATH", "/api/chat/completions")
    OPENWEBUI_API_TOKEN = os.environ.get("OPENWEBUI_API_TOKEN", "").strip()
    OPENWEBUI_MODEL = os.environ.get("OPENWEBUI_MODEL", "deepseek-r1:14b")
    REQUEST_TIMEOUT_SECONDS = float(os.environ.get("REQUEST_TIMEOUT_SECONDS", "180"))
    PROMPT_VERSION = os.environ.get("PROMPT_VERSION", "cms-json-translation-v3")
    LANGUAGE_PATTERN = re.compile(r"^[A-Za-z]{1,8}(?:-[A-Za-z0-9]{1,8}){0,8}$")
    MODEL_PATTERN = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._:/+-]{0,127}$")

    app = FastAPI(title="CMS Translation Service", version=APP_VERSION)

    class TranslateRequest(BaseModel):
      source_language: str = "en"
      target_language: Optional[str] = None
      requested_language_code: Optional[str] = None
      source_language_code: Optional[str] = None
      content_item_id: Optional[str] = None
      source_content_version: Optional[int] = None
      source_hash: Optional[str] = None
      model: Optional[str] = None
      translation_model: Optional[str] = None
      translation_policy: Optional[Dict[str, Any]] = None
      content_item: Optional[Dict[str, Any]] = None
      content_json: Dict[str, Any] = Field(default_factory=dict)

    class TranslateResponse(BaseModel):
      target_language: str
      language_code: str
      status: str = "published"
      content_item_id: Optional[str] = None
      source_content_version: Optional[int] = None
      source_hash: Optional[str] = None
      content_json: Dict[str, Any]
      model: str
      prompt_version: str
      translated_by: str = "cms-translation-service"

    def normalize_language(value: Optional[str]) -> str:
      candidate = (value or "").strip().replace("_", "-")
      if not candidate or not LANGUAGE_PATTERN.match(candidate):
        return "en"
      return candidate

    def normalize_optional_language(value: Any) -> Optional[str]:
      candidate = str(value or "").strip().replace("_", "-")
      if not candidate or candidate == "*" or not LANGUAGE_PATTERN.match(candidate):
        return None
      return candidate

    def normalize_language_list(value: Any) -> List[str]:
      if isinstance(value, str):
        stripped = value.strip()
        if not stripped:
          raw_items: List[Any] = []
        else:
          try:
            parsed = json.loads(stripped)
          except json.JSONDecodeError:
            parsed = re.split(r"[,\s]+", stripped)
          raw_items = parsed if isinstance(parsed, list) else [parsed]
      elif isinstance(value, list):
        raw_items = value
      else:
        raw_items = []
      languages: List[str] = []
      for raw_item in raw_items:
        language = normalize_optional_language(raw_item)
        if language and language not in languages:
          languages.append(language)
      return languages

    def language_is_configured(configured_languages: Any, requested_language: str) -> bool:
      requested = normalize_optional_language(requested_language)
      if not requested:
        return False
      requested_lower = requested.lower()
      for configured in normalize_language_list(configured_languages):
        configured_lower = configured.lower()
        if requested_lower == configured_lower or requested_lower.startswith(f"{configured_lower}-"):
          return True
      return False

    def require_language(value: Optional[str], field_name: str) -> str:
      candidate = (value or "").strip().replace("_", "-")
      if not candidate or not LANGUAGE_PATTERN.match(candidate):
        raise HTTPException(status_code=422, detail=f"{field_name} must be a valid language code.")
      return candidate

    def resolve_model(value: Optional[str]) -> str:
      candidate = (value or "").strip()
      if not candidate:
        return OPENWEBUI_MODEL
      if not MODEL_PATTERN.match(candidate):
        raise HTTPException(status_code=422, detail="model must be a valid Ollama/OpenWebUI model id.")
      return candidate

    def coerce_json_object_array(value: Any) -> List[Dict[str, Any]]:
      if isinstance(value, str):
        try:
          value = json.loads(value)
        except json.JSONDecodeError:
          return []
      if not isinstance(value, list):
        return []
      return [item for item in value if isinstance(item, dict)]

    def parse_json_path(path: Any) -> Optional[List[Any]]:
      text = str(path or "").strip()
      if not text:
        return None
      if text == "$":
        return []
      if not text.startswith("$"):
        return None
      segments: List[Any] = []
      index = 1
      while index < len(text):
        char = text[index]
        if char == ".":
          index += 1
          start = index
          while index < len(text) and text[index] not in ".[":
            index += 1
          key = text[start:index].strip()
          if not key:
            return None
          segments.append(key)
          continue
        if char == "[":
          close_index = text.find("]", index + 1)
          if close_index < 0:
            return None
          token = text[index + 1:close_index].strip()
          if token.isdigit():
            segments.append(int(token))
          elif (token.startswith('"') and token.endswith('"')) or (token.startswith("'") and token.endswith("'")):
            key = token[1:-1]
            if not key:
              return None
            segments.append(key)
          else:
            return None
          index = close_index + 1
          continue
        return None
      return segments

    def get_json_path_value(root: Any, segments: List[Any]) -> tuple[bool, Any]:
      current = root
      for segment in segments:
        if isinstance(segment, int):
          if not isinstance(current, list) or segment < 0 or segment >= len(current):
            return False, None
          current = current[segment]
        else:
          if not isinstance(current, dict) or segment not in current:
            return False, None
          current = current[segment]
      return True, current

    def set_json_path_value(root: Any, segments: List[Any], value: Any) -> bool:
      if not segments:
        return False
      current = root
      for segment in segments[:-1]:
        if isinstance(segment, int):
          if not isinstance(current, list) or segment < 0 or segment >= len(current):
            return False
          current = current[segment]
        else:
          if not isinstance(current, dict) or segment not in current:
            return False
          current = current[segment]
      last = segments[-1]
      if isinstance(last, int):
        if not isinstance(current, list) or last < 0 or last >= len(current):
          return False
        current[last] = value
        return True
      if not isinstance(current, dict):
        return False
      current[last] = value
      return True

    def normalize_translation_rules(value: Any) -> List[Dict[str, Any]]:
      rules: List[Dict[str, Any]] = []
      for raw_rule in coerce_json_object_array(value):
        path = str(raw_rule.get("path") or raw_rule.get("json_path") or "").strip()
        segments = parse_json_path(path)
        if segments is None:
          continue
        translation_enabled = raw_rule.get("translation_enabled")
        if not isinstance(translation_enabled, bool):
          translation_enabled = raw_rule.get("translate")
        rules.append({
          "path": path,
          "segments": segments,
          "translation_enabled": translation_enabled if isinstance(translation_enabled, bool) else None,
          "excluded_languages": normalize_language_list(
            raw_rule.get("excluded_languages")
            or raw_rule.get("exclude_languages")
            or raw_rule.get("do_not_translate_languages")
          ),
        })
      return rules

    def protected_translation_rules(translation_rules: Any, language: str) -> List[Dict[str, Any]]:
      protected: List[Dict[str, Any]] = []
      for rule in normalize_translation_rules(translation_rules):
        disabled = rule.get("translation_enabled") is False
        excluded = language_is_configured(rule.get("excluded_languages"), language)
        if disabled or excluded:
          protected.append(rule)
      return protected

    def resolve_translation_policy(request: "TranslateRequest", content_item: Dict[str, Any]) -> Dict[str, Any]:
      policy = {
        "translation_enabled": content_item.get("translation_enabled", True),
        "translation_excluded_languages": content_item.get("translation_excluded_languages") or [],
        "translation_prewarm_languages": content_item.get("translation_prewarm_languages") or [],
        "translation_rules": content_item.get("translation_rules") or [],
      }
      if isinstance(request.translation_policy, dict):
        for key in ("translation_enabled", "translation_excluded_languages", "translation_prewarm_languages", "translation_rules"):
          if key in request.translation_policy:
            policy[key] = request.translation_policy[key]
      return policy

    def translation_blocked_by_policy(policy: Dict[str, Any], language: str) -> bool:
      if policy.get("translation_enabled") is False:
        return True
      if language_is_configured(policy.get("translation_excluded_languages"), language):
        return True
      return any(rule.get("segments") == [] for rule in protected_translation_rules(policy.get("translation_rules"), language))

    def apply_protected_placeholders(content_json: Dict[str, Any], policy: Dict[str, Any], language: str) -> tuple[Dict[str, Any], List[Dict[str, Any]]]:
      masked = copy.deepcopy(content_json)
      replacements: List[Dict[str, Any]] = []
      rules = sorted(
        protected_translation_rules(policy.get("translation_rules"), language),
        key=lambda rule: len(rule.get("segments") or []),
      )
      for rule in rules:
        segments = rule.get("segments")
        if not isinstance(segments, list) or not segments:
          continue
        exists, value = get_json_path_value(content_json, segments)
        if not exists:
          continue
        placeholder = f"__CMS_TRANSLATION_PROTECTED_{len(replacements)}__"
        if set_json_path_value(masked, segments, placeholder):
          replacements.append({
            "segments": segments,
            "value": copy.deepcopy(value),
            "placeholder": placeholder,
          })
      return masked, replacements

    def restore_protected_values(translated: Dict[str, Any], replacements: List[Dict[str, Any]]) -> Dict[str, Any]:
      restored = copy.deepcopy(translated)
      for replacement in replacements:
        segments = replacement.get("segments")
        if isinstance(segments, list):
          set_json_path_value(restored, segments, copy.deepcopy(replacement.get("value")))
      return restored

    def resolve_translation_context(request: TranslateRequest) -> Dict[str, Any]:
      content_item = request.content_item if isinstance(request.content_item, dict) else {}
      content_json = request.content_json
      if not content_json and isinstance(content_item.get("content_json"), dict):
        content_json = content_item["content_json"]
      if not isinstance(content_json, dict):
        raise HTTPException(status_code=422, detail="content_json must be a JSON object.")

      source_content_version = request.source_content_version
      if source_content_version is None and content_item.get("content_version") is not None:
        try:
          source_content_version = int(content_item["content_version"])
        except (TypeError, ValueError) as exc:
          raise HTTPException(status_code=422, detail="content_item.content_version must be an integer.") from exc

      content_item_id = request.content_item_id
      if not content_item_id and content_item.get("id") is not None:
        content_item_id = str(content_item["id"])

      source_hash = request.source_hash
      if not source_hash and content_item.get("source_hash") is not None:
        source_hash = str(content_item["source_hash"])

      translation_policy = resolve_translation_policy(request, content_item)

      return {
        "source_language": normalize_language(request.source_language_code or request.source_language),
        "target_language": require_language(request.target_language or request.requested_language_code, "target_language"),
        "content_item_id": content_item_id,
        "source_content_version": source_content_version,
        "source_hash": source_hash,
        "model": resolve_model(request.model or request.translation_model),
        "translation_policy": translation_policy,
        "content_json": content_json,
      }

    def strip_json_fence(value: str) -> str:
      text = value.strip()
      if text.startswith("```"):
        text = re.sub(r"^```(?:json)?\s*", "", text, flags=re.IGNORECASE)
        text = re.sub(r"\s*```$", "", text)
      return text.strip()

    def extract_openwebui_text(payload: Dict[str, Any]) -> str:
      choices = payload.get("choices")
      if isinstance(choices, list) and choices:
        message = choices[0].get("message") if isinstance(choices[0], dict) else None
        if isinstance(message, dict) and isinstance(message.get("content"), str):
          return message["content"]
        if isinstance(choices[0].get("text"), str):
          return choices[0]["text"]
      if isinstance(payload.get("content"), str):
        return payload["content"]
      raise HTTPException(status_code=502, detail="OpenWebUI response did not contain model text.")

    async def call_openwebui(model: str, source_language: str, target_language: str, content_json: Dict[str, Any]) -> Dict[str, Any]:
      system_prompt = (
        "Translate CMS JSON content from the source language to the target language. "
        "Return only the translated content_json object as valid JSON, not the full request envelope. "
        "Preserve all object keys, array order, value types, URLs, IDs, code blocks, template tokens, "
        "HTML tags, and any __CMS_TRANSLATION_PROTECTED_*__ placeholder values. "
        "Translate human-readable text values only."
      )
      user_prompt = json.dumps(
        {
          "source_language": source_language,
          "target_language": target_language,
          "content_json": content_json,
        },
        ensure_ascii=False,
      )
      headers = {"Accept": "application/json", "Content-Type": "application/json"}
      if OPENWEBUI_API_TOKEN:
        headers["Authorization"] = f"Bearer {OPENWEBUI_API_TOKEN}"
      body = {
        "model": model,
        "messages": [
          {"role": "system", "content": system_prompt},
          {"role": "user", "content": user_prompt},
        ],
        "temperature": 0,
      }
      async with httpx.AsyncClient(timeout=REQUEST_TIMEOUT_SECONDS) as client:
        response = await client.post(
          f"{OPENWEBUI_BASE_URL}{OPENWEBUI_CHAT_COMPLETIONS_PATH}",
          headers=headers,
          json=body,
        )
        response.raise_for_status()
      text = strip_json_fence(extract_openwebui_text(response.json()))
      try:
        translated = json.loads(text)
      except json.JSONDecodeError as exc:
        raise HTTPException(status_code=502, detail=f"Model returned invalid JSON: {exc}") from exc
      if not isinstance(translated, dict):
        raise HTTPException(status_code=502, detail="Model returned JSON but not an object.")
      return translated

    def normalize_translated_content(translated: Dict[str, Any]) -> Dict[str, Any]:
      nested = translated.get("content_json")
      envelope_keys = {"content_json", "source_language", "target_language", "language_code", "target_language_code"}
      if isinstance(nested, dict) and set(translated.keys()).issubset(envelope_keys):
        return nested
      return translated

    @app.get("/healthz")
    async def healthz() -> Dict[str, Any]:
      return {
        "ok": True,
        "version": APP_VERSION,
        "openwebui_base_url": OPENWEBUI_BASE_URL,
        "model": OPENWEBUI_MODEL,
        "default_model": OPENWEBUI_MODEL,
        "has_openwebui_token": bool(OPENWEBUI_API_TOKEN),
      }

    @app.post("/translate-content-json", response_model=TranslateResponse)
    async def translate_content_json(request: TranslateRequest) -> TranslateResponse:
      context = resolve_translation_context(request)
      target_language = context["target_language"]
      model = context["model"]
      translation_policy = context["translation_policy"]
      replacements: List[Dict[str, Any]] = []
      if translation_blocked_by_policy(translation_policy, target_language):
        translated = context["content_json"]
      elif target_language.lower() == context["source_language"].lower():
        translated = context["content_json"]
      else:
        content_for_model, replacements = apply_protected_placeholders(
          context["content_json"],
          translation_policy,
          target_language,
        )
        translated = await call_openwebui(model, context["source_language"], target_language, content_for_model)
      translated = normalize_translated_content(translated)
      if replacements:
        translated = restore_protected_values(translated, replacements)
      return TranslateResponse(
        target_language=target_language,
        language_code=target_language,
        content_item_id=context["content_item_id"],
        source_content_version=context["source_content_version"],
        source_hash=context["source_hash"],
        content_json=translated,
        model=model,
        prompt_version=PROMPT_VERSION,
      )
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cms-translation-service
  namespace: ollama
---
apiVersion: v1
kind: Service
metadata:
  name: cms-translation-service
  namespace: ollama
spec:
  selector:
    app: cms-translation-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cms-translation-service
  namespace: ollama
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cms-translation-service
  template:
    metadata:
      labels:
        app: cms-translation-service
      annotations:
        linkerd.io/inject: "enabled"
        reloader.stakater.com/auto: "true"
    spec:
      serviceAccountName: cms-translation-service
      containers:
        - name: app
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: OPENWEBUI_BASE_URL
              value: "http://open-webui.ollama.svc.cluster.local:80"
            - name: OPENWEBUI_CHAT_COMPLETIONS_PATH
              value: "/api/chat/completions"
            - name: OPENWEBUI_MODEL
              value: "deepseek-r1:14b"
            - name: PROMPT_VERSION
              value: "cms-json-translation-v3"
            - name: REQUEST_TIMEOUT_SECONDS
              value: "180"
            - name: OPENWEBUI_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cms-translation-service
                  key: OPENWEBUI_API_TOKEN
                  optional: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              pip install --no-cache-dir -r /app/requirements.txt >/dev/null
              python -m uvicorn app:app --app-dir /app --host 0.0.0.0 --port 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: app
              mountPath: /app
      volumes:
        - name: app
          configMap:
            name: cms-translation-service
