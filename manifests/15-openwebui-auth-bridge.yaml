apiVersion: v1
kind: ConfigMap
metadata:
  name: openwebui-auth-bridge
  namespace: ollama
data:
  requirements.txt: |
    fastapi==0.115.5
    uvicorn==0.30.6
    PyJWT==2.9.0
    cryptography==43.0.1
    psycopg2-binary==2.9.9
    bcrypt==4.2.0
    python-multipart==0.0.9
  app.py: |
    import os
    import time
    import uuid
    import json
    import hashlib
    import bcrypt
    import jwt
    import psycopg2
    import threading
    import urllib.request
    from fastapi import Body, FastAPI, Form, HTTPException

    ISSUER = os.environ.get("KEYCLOAK_ISSUER", "https://auth.suncoast.systems/realms/external")
    JWKS_URL = os.environ.get(
        "KEYCLOAK_JWKS_URL",
        "https://auth.suncoast.systems/realms/external/protocol/openid-connect/certs",
    )
    WEBUI_SECRET_KEY = os.environ.get("WEBUI_SECRET_KEY", "")
    DATABASE_URL = os.environ.get("DATABASE_URL", "")
    JWT_EXPIRES_IN = os.environ.get("WEBUI_JWT_EXPIRES_IN", "4w")
    JWKS_CACHE_SECONDS = int(os.environ.get("JWKS_CACHE_SECONDS", "300"))
    JWKS_TIMEOUT_SECONDS = int(os.environ.get("JWKS_TIMEOUT_SECONDS", "5"))
    USERNAME_MAX_LEN = int(os.environ.get("WEBUI_USERNAME_MAX", "50"))
    ALLOWED_MEMBERSHIP_ROLES = frozenset(
        value.strip().lower()
        for value in os.environ.get("ALLOWED_MEMBERSHIP_ROLES", "").split(",")
        if value.strip()
    )
    MODEL_ACCESS_IDS = tuple(
        value.strip()
        for value in os.environ.get("MODEL_ACCESS_IDS", "").split(",")
        if value.strip()
    )

    _jwks_cache = {"data": None, "loaded_at": 0.0}
    _jwks_lock = threading.Lock()

    app = FastAPI()

    def parse_duration(value: str) -> int:
        # Supports s, m, h, d, w. Defaults to 4w if invalid.
        try:
            num = int(value[:-1])
            unit = value[-1]
            mult = {"s": 1, "m": 60, "h": 3600, "d": 86400, "w": 604800}.get(unit)
            if mult is None:
                return 4 * 604800
            return num * mult
        except Exception:
            return 4 * 604800

    def normalize_username(value: str, fallback: str) -> str:
        if not value:
            value = fallback or "user"
        if len(value) <= USERNAME_MAX_LEN:
            return value
        digest = hashlib.sha256(value.encode("utf-8")).hexdigest()[:8]
        keep = USERNAME_MAX_LEN - 9
        if keep <= 0:
            return digest[:USERNAME_MAX_LEN]
        return f"{value[:keep]}-{digest}"


    def _load_jwks():
        now = time.time()
        cached = _jwks_cache["data"]
        if cached and now - _jwks_cache["loaded_at"] < JWKS_CACHE_SECONDS:
            return cached
        with _jwks_lock:
            now = time.time()
            cached = _jwks_cache["data"]
            if cached and now - _jwks_cache["loaded_at"] < JWKS_CACHE_SECONDS:
                return cached
            try:
                with urllib.request.urlopen(JWKS_URL, timeout=JWKS_TIMEOUT_SECONDS) as resp:
                    data = json.load(resp)
                _jwks_cache["data"] = data
                _jwks_cache["loaded_at"] = now
                return data
            except Exception:
                if _jwks_cache["data"]:
                    return _jwks_cache["data"]
                raise

    def _find_signing_key(token: str):
        header = jwt.get_unverified_header(token)
        kid = header.get("kid")
        if not kid:
            return None
        jwks = _load_jwks() or {}
        for key in jwks.get("keys", []):
            if key.get("kid") == kid:
                return jwt.algorithms.RSAAlgorithm.from_jwk(json.dumps(key))
        return None

    def get_signing_key(token: str):
        key = _find_signing_key(token)
        if key:
            return key
        _jwks_cache["loaded_at"] = 0.0
        key = _find_signing_key(token)
        if key:
            return key
        raise HTTPException(status_code=401, detail="Invalid subject token")

    def verify_token(token: str):
        try:
            key = get_signing_key(token)
            return jwt.decode(
                token,
                key,
                algorithms=["RS256"],
                issuer=ISSUER,
                options={"verify_aud": False},
            )
        except Exception:
            raise HTTPException(status_code=401, detail="Invalid subject token")

    def membership_roles(decoded: dict) -> set[str]:
        roles: set[str] = set()

        def add(values):
            if not isinstance(values, list):
                return
            for value in values:
                if isinstance(value, str) and value.strip():
                    roles.add(value.strip().lower())

        add(decoded.get("suncoast_roles"))
        add(decoded.get("suncoastRoles"))
        suncoast = decoded.get("suncoast")
        if isinstance(suncoast, dict):
            add(suncoast.get("roles"))
        return roles

    def resolve_user_id(cur, sub: str, email: str) -> str:
        # OpenWebUI assigns its own UUID when an OIDC user first signs in. Match
        # that account by the stored OIDC subject before considering creation.
        cur.execute(
            '''SELECT id FROM "user"
               WHERE oauth::jsonb -> 'oidc' ->> 'sub' = %s
                  OR oauth::jsonb -> 'keycloak' ->> 'sub' = %s
               ORDER BY created_at ASC LIMIT 1''',
            (sub, sub),
        )
        existing = cur.fetchone()
        if existing is not None:
            return existing[0]
        if email:
            cur.execute(
                'SELECT id FROM "user" WHERE lower(email) = lower(%s) ORDER BY created_at ASC LIMIT 1',
                (email,),
            )
            existing = cur.fetchone()
            if existing is not None:
                return existing[0]
        return sub

    def upsert_user(sub: str, email: str, name: str, preferred_username: str, oauth: dict) -> str:
        if not DATABASE_URL:
            raise HTTPException(status_code=500, detail="DATABASE_URL not set")
        if not WEBUI_SECRET_KEY:
            raise HTTPException(status_code=500, detail="WEBUI_SECRET_KEY not set")

        now = int(time.time())
        password = str(uuid.uuid4())
        pw_hash = bcrypt.hashpw(password.encode("utf-8"), bcrypt.gensalt()).decode("utf-8")

        conn = psycopg2.connect(DATABASE_URL)
        try:
            with conn:
                with conn.cursor() as cur:
                    user_id = resolve_user_id(cur, sub, email)
                    cur.execute("SELECT id FROM auth WHERE id = %s", (user_id,))
                    if cur.fetchone() is None:
                        cur.execute(
                            "INSERT INTO auth (id, email, password, active) VALUES (%s, %s, %s, %s) ON CONFLICT (id) DO NOTHING",
                            (user_id, email, pw_hash, True),
                        )
                    else:
                        cur.execute(
                            "UPDATE auth SET email = COALESCE(NULLIF(email, ''), %s), active = true WHERE id = %s",
                            (email, user_id),
                        )
                    cur.execute("SELECT id FROM \"user\" WHERE id = %s", (user_id,))
                    if cur.fetchone() is None:
                        cur.execute(
                            """INSERT INTO "user" (
                                id, email, username, role, name, profile_image_url,
                                oauth, last_active_at, created_at, updated_at
                              ) VALUES (%s,%s,%s,%s,%s,%s,%s,%s,%s,%s)
                              ON CONFLICT (id) DO NOTHING""",
                            (
                                user_id,
                                email,
                                preferred_username,
                                "user",
                                name,
                                "/user.png",
                                json.dumps(oauth),
                                now,
                                now,
                                now,
                            ),
                        )
                    else:
                        cur.execute(
                            '''UPDATE "user" SET
                                 email = COALESCE(NULLIF(email, ''), %s),
                                 username = COALESCE(NULLIF(username, ''), %s),
                                 name = COALESCE(NULLIF(name, ''), %s),
                                 oauth = (COALESCE(oauth, '{}'::json)::jsonb || %s::jsonb)::json,
                                 last_active_at = %s,
                                 updated_at = %s
                               WHERE id = %s''',
                            (email, preferred_username, name, json.dumps(oauth), now, now, user_id),
                        )
                    return user_id
        finally:
            conn.close()

    def reconcile_model_access(user_id: str, enabled: bool) -> None:
        if not MODEL_ACCESS_IDS:
            return
        now = int(time.time())
        conn = psycopg2.connect(DATABASE_URL)
        try:
            with conn:
                with conn.cursor() as cur:
                    cur.execute(
                        '''DELETE FROM access_grant
                           WHERE resource_type = 'model'
                             AND principal_type = 'user'
                             AND principal_id = %s
                             AND permission = 'read'
                             AND resource_id = ANY(%s)''',
                        (user_id, list(MODEL_ACCESS_IDS)),
                    )
                    if enabled:
                        for model_id in MODEL_ACCESS_IDS:
                            grant_id = str(uuid.uuid5(
                                uuid.NAMESPACE_URL,
                                f"suncoast:model-access:{model_id}:user:{user_id}:read",
                            ))
                            cur.execute(
                                '''INSERT INTO access_grant
                                     (id, resource_type, resource_id, principal_type, principal_id, permission, created_at)
                                   VALUES (%s, 'model', %s, 'user', %s, 'read', %s)
                                   ON CONFLICT (resource_type, resource_id, principal_type, principal_id, permission)
                                   DO UPDATE SET created_at = EXCLUDED.created_at''',
                                (grant_id, model_id, user_id, now),
                            )
        finally:
            conn.close()

    def revoke_existing_model_access(sub: str, email: str) -> None:
        if not DATABASE_URL or not MODEL_ACCESS_IDS:
            return
        conn = psycopg2.connect(DATABASE_URL)
        try:
            with conn.cursor() as cur:
                cur.execute(
                    '''SELECT id FROM "user"
                       WHERE oauth::jsonb -> 'oidc' ->> 'sub' = %s
                          OR oauth::jsonb -> 'keycloak' ->> 'sub' = %s
                          OR lower(email) = lower(%s)
                       ORDER BY created_at ASC LIMIT 1''',
                    (sub, sub, email),
                )
                existing = cur.fetchone()
            if existing is not None:
                reconcile_model_access(existing[0], False)
        finally:
            conn.close()

    def require_current_model_access(user_id: str) -> None:
        if not MODEL_ACCESS_IDS:
            return
        conn = psycopg2.connect(DATABASE_URL)
        try:
            with conn.cursor() as cur:
                cur.execute(
                    '''SELECT count(DISTINCT resource_id)
                       FROM access_grant
                       WHERE resource_type = 'model'
                         AND principal_type = 'user'
                         AND principal_id = %s
                         AND permission = 'read'
                         AND resource_id = ANY(%s)''',
                    (user_id, list(MODEL_ACCESS_IDS)),
                )
                count = int(cur.fetchone()[0])
                if count != len(MODEL_ACCESS_IDS):
                    raise HTTPException(status_code=403, detail="Configured model access required")
        finally:
            conn.close()

    def mint_webui_token(user_id: str):
        ttl = parse_duration(JWT_EXPIRES_IN)
        exp = int(time.time()) + ttl
        payload = {"id": user_id, "exp": exp, "jti": str(uuid.uuid4())}
        token = jwt.encode(payload, WEBUI_SECRET_KEY, algorithm="HS256")
        return token, ttl

    def resolve_existing_user_id(user_id: str) -> str:
        if not DATABASE_URL:
            raise HTTPException(status_code=500, detail="DATABASE_URL not set")
        conn = psycopg2.connect(DATABASE_URL)
        try:
            with conn.cursor() as cur:
                cur.execute(
                    'SELECT u.id FROM "user" u JOIN auth a ON a.id = u.id WHERE u.id = %s AND a.active = true',
                    (user_id,),
                )
                existing = cur.fetchone()
                if existing is not None:
                    return existing[0]
                # During a rolling upgrade an older research API may still
                # carry the Keycloak subject instead of OpenWebUI's UUID.
                cur.execute(
                    '''SELECT u.id FROM "user" u JOIN auth a ON a.id = u.id
                       WHERE a.active = true
                         AND (u.oauth::jsonb -> 'oidc' ->> 'sub' = %s
                           OR u.oauth::jsonb -> 'keycloak' ->> 'sub' = %s)
                       ORDER BY u.created_at ASC LIMIT 1''',
                    (user_id, user_id),
                )
                existing = cur.fetchone()
                if existing is None:
                    raise HTTPException(status_code=404, detail="OpenWebUI user not found")
                return existing[0]
        finally:
            conn.close()

    @app.post("/token")
    def token_exchange(
        grant_type: str = Form(...),
        subject_token: str = Form(...),
        subject_token_type: str = Form(None),
        audience: str = Form(None),
        client_id: str = Form(None),
        client_secret: str = Form(None),
    ):
        if grant_type != "urn:ietf:params:oauth:grant-type:token-exchange":
            raise HTTPException(status_code=400, detail="Unsupported grant_type")

        decoded = verify_token(subject_token)

        # Enforce audience match if provided
        if audience:
            aud = decoded.get("aud")
            if isinstance(aud, list) and audience not in aud:
                raise HTTPException(status_code=401, detail="Requested audience not available")
            if isinstance(aud, str) and aud != audience:
                raise HTTPException(status_code=401, detail="Requested audience not available")

        sub = decoded.get("sub")
        if not sub:
            raise HTTPException(status_code=401, detail="Missing subject")

        email = decoded.get("email") or decoded.get("preferred_username") or f"{sub}@idp.local"
        authorized = bool(ALLOWED_MEMBERSHIP_ROLES.intersection(membership_roles(decoded)))
        if not authorized:
            revoke_existing_model_access(sub, email)
            raise HTTPException(status_code=403, detail="Approved application membership required")
        raw_username = decoded.get("preferred_username") or email
        preferred_username = normalize_username(raw_username, sub)
        name = decoded.get("name") or raw_username or preferred_username
        oauth = {"keycloak": {"sub": sub, "email": email, "preferred_username": raw_username}}

        user_id = upsert_user(sub, email, name, preferred_username, oauth)
        reconcile_model_access(user_id, True)
        token, ttl = mint_webui_token(user_id)

        return {
            "access_token": token,
            "user_id": user_id,
            "token_type": "Bearer",
            "expires_in": ttl,
            "issued_token_type": "urn:ietf:params:oauth:token-type:access_token",
        }

    @app.post("/internal/token")
    def internal_token(user_id: str = Body(..., embed=True)):
        # Network access to this endpoint is restricted by Linkerd to trusted
        # application service accounts. It never creates or impersonates an
        # unknown user; interactive token exchange must provision the account.
        resolved_user_id = resolve_existing_user_id(user_id)
        require_current_model_access(resolved_user_id)
        token, ttl = mint_webui_token(resolved_user_id)
        return {
            "access_token": token,
            "user_id": resolved_user_id,
            "token_type": "Bearer",
            "expires_in": ttl,
            "issued_token_type": "urn:ietf:params:oauth:token-type:access_token",
        }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui-auth-bridge
  namespace: ollama
  annotations:
    # Needs Vault-synced secrets to exist first.
    argocd.argoproj.io/sync-wave: "2"
    platform.suncoast.systems/vpa-reconcile-at: "2026-11-09"
    reloader.stakater.com/auto: "true"
    reloader.stakater.com/configmap: "openwebui-auth-bridge"
    reloader.stakater.com/secret: "openwebui-db-url,openwebui-oidc-secrets"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openwebui-auth-bridge
  template:
    metadata:
      labels:
        app: openwebui-auth-bridge
      annotations:
        # Force the currently mounted bridge source to be loaded by the Python
        # process. Future ConfigMap and Secret changes are handled by Reloader.
        platform.suncoast.systems/config-revision: "f3c5bfdad3fa0ed88dffe47e401632ac59747050"
    spec:
      containers:
        - name: openwebui-auth-bridge
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          env:
            - name: KEYCLOAK_ISSUER
              value: "https://auth.suncoast.systems/realms/external"
            - name: KEYCLOAK_JWKS_URL
              value: "https://auth.suncoast.systems/realms/external/protocol/openid-connect/certs"
            - name: WEBUI_JWT_EXPIRES_IN
              value: "4w"
            - name: ALLOWED_MEMBERSHIP_ROLES
              # Comma-separated Google group-derived Suncoast roles for every
              # application allowed to use this shared OpenWebUI bridge.
              value: "research_application_users"
            - name: MODEL_ACCESS_IDS
              value: "qwen3:14b"
          envFrom:
            - secretRef:
                name: openwebui-db-url
            - secretRef:
                name: openwebui-oidc-secrets
          ports:
            - containerPort: 8080
          command: ["/bin/sh","-c"]
          args:
            - |
              set -e
              pip install --no-cache-dir -r /app/requirements.txt >/dev/null
              export PYTHONPATH=/app
              python -m uvicorn app:app --app-dir /app --host 0.0.0.0 --port 8080
          volumeMounts:
            - name: app
              mountPath: /app
      volumes:
        - name: app
          configMap:
            name: openwebui-auth-bridge
---
apiVersion: v1
kind: Service
metadata:
  name: openwebui-auth-bridge
  namespace: ollama
spec:
  selector:
    app: openwebui-auth-bridge
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
