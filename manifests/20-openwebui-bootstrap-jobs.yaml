apiVersion: batch/v1
kind: Job
metadata:
  name: copy-ollama-vault-root-token
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-10"
spec:
  backoffLimit: 1
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
    spec:
      serviceAccountName: default
      restartPolicy: Never
      containers:
        - name: copy-secret
          image: alpine/k8s:1.31.4
          command: ["/bin/sh","-c"]
          args:
            - |
              echo "🔁 Copying 'vault-root-token' from vault → ollama..."
              kubectl get secret vault-root-token -n vault -o yaml | \
                sed 's/namespace: vault/namespace: ollama/' | \
                kubectl apply -f -
              echo "✅ Secret copied."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openwebui-runtime-secrets-reconcile
  namespace: ollama
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "3"
    linkerd.io/inject: disabled
spec:
  backoffLimit: 1
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
    spec:
      serviceAccountName: openwebui
      restartPolicy: Never
      initContainers:
        - name: load-kubectl
          image: alpine/k8s:1.31.4
          command: ["sh","-c"]
          args: ["cp /usr/bin/kubectl /kubectl-bin/kubectl && chmod +x /kubectl-bin/kubectl"]
          volumeMounts:
            - name: kubectl-bin
              mountPath: /kubectl-bin
      containers:
        - name: vault-sync-once
          image: ubuntu:22.04
          command: ["/bin/bash","-c"]
          args:
            - |
              RETRY_INTERVAL=5

              echo "🔧 Installing tools..."
              while true; do
                apt-get update && apt-get install -y curl unzip jq openssl postgresql-client && break
                echo "⚠️ apt-get failed. Retrying in ${RETRY_INTERVAL}s..."; sleep "$RETRY_INTERVAL"
              done

              echo "📌 Installing Vault CLI..."
              while true; do
                curl -fsSL -o vault.zip https://releases.hashicorp.com/vault/1.15.4/vault_1.15.4_linux_amd64.zip && break
                echo "⚠️ Vault download failed. Retrying..."; sleep "$RETRY_INTERVAL"
              done
              unzip -o vault.zip >/dev/null && mv vault /usr/local/bin/ && chmod +x /usr/local/bin/vault

              export VAULT_ADDR=http://vault.vault.svc.cluster.local:8200

              if [ -f /vault-token/VAULT_TOKEN ]; then
                VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"
              elif [ -f /vault-token/token ]; then
                VAULT_TOKEN="$(cat /vault-token/token)"
              else
                echo "❌ No Vault token file found in /vault-token"
                ls -la /vault-token || true
                exit 1
              fi
              export VAULT_TOKEN

              DB_URL="${DATABASE_URL:-}"
              if [ -z "$DB_URL" ]; then
                echo "❌ DATABASE_URL is unavailable" >&2
                exit 1
              fi

              echo "⏳ Waiting for Keycloak client secrets in Vault..."
              while true; do
                OIDC_CLIENT_ID=$(vault kv get -field=value secret/keycloak-client-id-openwebui 2>/tmp/vault_err.log || true)
                OIDC_CLIENT_SECRET=$(vault kv get -field=value secret/keycloak-client-secret-openwebui 2>/tmp/vault_err.log || true)
                WEBUI_SECRET_KEY=$(vault kv get -field=value secret/openwebui-webui-secret-key 2>/tmp/vault_err.log || true)
                if [ -n "$OIDC_CLIENT_ID" ] && [ -n "$OIDC_CLIENT_SECRET" ] && [ -n "$WEBUI_SECRET_KEY" ]; then
                  echo "✅ Got Keycloak client credentials"
                  break
                fi
                echo "⚠️ Keycloak client credentials not available yet. Retrying..."
                cat /tmp/vault_err.log || true
                sleep "$RETRY_INTERVAL"
              done

              echo "🔐 Creating/updating Kubernetes secret openwebui-oidc-secrets..."
              cat <<EOF | kubectl apply -f -
              apiVersion: v1
              kind: Secret
              metadata:
                name: openwebui-oidc-secrets
                namespace: ollama
              type: Opaque
              stringData:
                OAUTH_CLIENT_ID: ${OIDC_CLIENT_ID}
                OAUTH_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
                WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
              EOF
              echo "✅ OIDC secrets created/updated."

              echo "🔐 Ensuring CMS translation OpenWebUI token..."
              CMS_TRANSLATION_USER_ID="${CMS_TRANSLATION_USER_ID:-00000000-0000-0000-0000-000000000042}"
              CMS_TRANSLATION_EMAIL="${CMS_TRANSLATION_EMAIL:-cms-translation-service@local}"
              CMS_TRANSLATION_NAME="${CMS_TRANSLATION_NAME:-CMS Translation Service}"
              CMS_TRANSLATION_TOKEN="$(vault kv get -field=value secret/openwebui-cms-translation-token 2>/tmp/vault_err.log || true)"
              case "$CMS_TRANSLATION_TOKEN" in
                *.*.*)
                  echo "✅ Reusing existing CMS translation WebUI token from Vault"
                  ;;
                *)
                  base64url() {
                    openssl base64 -A | tr '+/' '-_' | tr -d '='
                  }
                  CMS_TRANSLATION_JTI="$(openssl rand -hex 16)"
                  CMS_TRANSLATION_IAT="$(date +%s)"
                  JWT_HEADER="$(printf '%s' '{"alg":"HS256","typ":"JWT"}' | base64url)"
                  JWT_PAYLOAD="$(
                    jq -nc \
                      --arg id "$CMS_TRANSLATION_USER_ID" \
                      --arg jti "$CMS_TRANSLATION_JTI" \
                      --argjson iat "$CMS_TRANSLATION_IAT" \
                      '{id:$id,jti:$jti,iat:$iat}' | base64url
                  )"
                  JWT_SIGNATURE="$(printf '%s' "${JWT_HEADER}.${JWT_PAYLOAD}" | openssl dgst -sha256 -hmac "$WEBUI_SECRET_KEY" -binary | base64url)"
                  CMS_TRANSLATION_TOKEN="${JWT_HEADER}.${JWT_PAYLOAD}.${JWT_SIGNATURE}"
                  echo "✅ Generated CMS translation WebUI token"
                  ;;
              esac

              if [ -z "$CMS_TRANSLATION_TOKEN" ]; then
                echo "❌ CMS translation token generation failed"
                exit 1
              fi

              CMS_TRANSLATION_USER_ID_SQL="$(printf "%s" "$CMS_TRANSLATION_USER_ID" | sed "s/'/''/g")"
              CMS_TRANSLATION_EMAIL_SQL="$(printf "%s" "$CMS_TRANSLATION_EMAIL" | sed "s/'/''/g")"
              CMS_TRANSLATION_NAME_SQL="$(printf "%s" "$CMS_TRANSLATION_NAME" | sed "s/'/''/g")"

              psql "$DB_URL" -v ON_ERROR_STOP=1 <<EOSQL
              INSERT INTO openwebui."user" (
                id, email, username, role, name, profile_image_url,
                oauth, last_active_at, created_at, updated_at
              ) VALUES (
                '${CMS_TRANSLATION_USER_ID_SQL}',
                '${CMS_TRANSLATION_EMAIL_SQL}',
                'cms-translation-service',
                'admin',
                '${CMS_TRANSLATION_NAME_SQL}',
                '/user.png',
                '{"service_account": true}',
                EXTRACT(EPOCH FROM NOW())::bigint,
                EXTRACT(EPOCH FROM NOW())::bigint,
                EXTRACT(EPOCH FROM NOW())::bigint
              )
              ON CONFLICT (id) DO UPDATE SET
                email = EXCLUDED.email,
                username = EXCLUDED.username,
                role = EXCLUDED.role,
                name = EXCLUDED.name,
                profile_image_url = EXCLUDED.profile_image_url,
                oauth = EXCLUDED.oauth,
                updated_at = EXTRACT(EPOCH FROM NOW())::bigint;

              INSERT INTO openwebui.auth (id, email, password, active)
              VALUES (
                '${CMS_TRANSLATION_USER_ID_SQL}',
                '${CMS_TRANSLATION_EMAIL_SQL}',
                '',
                true
              )
              ON CONFLICT (id) DO UPDATE SET
                email = EXCLUDED.email,
                active = true;
              EOSQL

              vault kv put secret/openwebui-cms-translation-token value="$CMS_TRANSLATION_TOKEN" >/dev/null
              echo "✅ CMS translation WebUI token reconciled."

              echo "⏳ Waiting for OpenAI API key in Vault..."
              while true; do
                OPENAI_API_KEY=$(vault kv get -field=value secret/open_ai_key 2>/tmp/vault_err.log || true)
                if [ -n "$OPENAI_API_KEY" ]; then
                  echo "✅ Got OpenAI API key"
                  break
                fi
                echo "⚠️ OpenAI API key not available yet. Retrying..."
                cat /tmp/vault_err.log || true
                sleep "$RETRY_INTERVAL"
              done

              echo "🔐 Creating/updating Kubernetes secret openwebui-openai..."
              cat <<EOF | kubectl apply -f -
              apiVersion: v1
              kind: Secret
              metadata:
                name: openwebui-openai
                namespace: ollama
              type: Opaque
              stringData:
                OPENAI_API_KEY: ${OPENAI_API_KEY}
              EOF
              echo "✅ OpenAI secret created/updated."
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: openwebui-db-url
                  key: DATABASE_URL
          volumeMounts:
            - name: kubectl-bin
              mountPath: /usr/local/bin
            - name: root-token
              mountPath: /vault-token
              readOnly: true
      volumes:
        - name: kubectl-bin
          emptyDir: {}
        - name: root-token
          secret:
            secretName: vault-root-token
---
# DB SCHEMA COMPATIBILITY (ensures Open WebUI can start on an existing DB)
apiVersion: batch/v1
kind: Job
metadata:
  name: openwebui-db-schema-compat
  namespace: ollama
  annotations:
    # Must run after Vault has created the DB URL secret but before Open WebUI starts.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded,HookFailed
    argocd.argoproj.io/sync-options: Replace=true,Force=true
    argocd.argoproj.io/sync-wave: "1"
    linkerd.io/inject: disabled
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
    spec:
      serviceAccountName: openwebui
      restartPolicy: Never
      containers:
        - name: db-compat
          image: postgres:16-alpine
          command: ["sh","-c"]
          args:
            - |
              set -eu

              apk add --no-cache curl jq >/dev/null

              wait_for_secret_value() {
                secret_name="$1"
                key_name="$2"
                namespace="${POD_NAMESPACE:-ollama}"
                api="https://kubernetes.default.svc"
                token_path="/var/run/secrets/kubernetes.io/serviceaccount/token"
                ca_path="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"

                while true; do
                  token="$(cat "$token_path")"
                  secret_json="$(curl -fsS --cacert "$ca_path" -H "Authorization: Bearer $token" \
                    "$api/api/v1/namespaces/${namespace}/secrets/${secret_name}" 2>/tmp/secret_err.log || true)"
                  if [ -n "$secret_json" ]; then
                    value_b64="$(echo "$secret_json" | jq -r --arg key "$key_name" '.data[$key] // empty')"
                    if [ -n "$value_b64" ]; then
                      printf '%s' "$value_b64" | base64 -d
                      return 0
                    fi
                  fi
                  echo "Waiting for ${secret_name}/${key_name}..." >&2
                  sleep 5
                done
              }

              if [ -z "${DATABASE_URL:-}" ]; then
                echo "DATABASE_URL missing; waiting for openwebui-db-url..." >&2
                DATABASE_URL="$(wait_for_secret_value openwebui-db-url DATABASE_URL)"
                export DATABASE_URL
              fi

              # Open WebUI v0.7.x expects tool.access_control (JSON). Older DBs may not have it.
              echo "Ensuring openwebui.tool.access_control column exists..."
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
                "ALTER TABLE IF EXISTS openwebui.tool ADD COLUMN IF NOT EXISTS access_control json;"

              # Open WebUI v0.7.x expects model.access_control + model.is_active.
              echo "Ensuring openwebui.model access_control + is_active columns exist..."
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
                "ALTER TABLE IF EXISTS openwebui.model ADD COLUMN IF NOT EXISTS access_control json;"
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
                "ALTER TABLE IF EXISTS openwebui.model ADD COLUMN IF NOT EXISTS is_active boolean DEFAULT true;"
              echo "DB schema compatibility checks complete."
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: openwebui-db-url
                  key: DATABASE_URL
                  optional: true
