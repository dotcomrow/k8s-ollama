apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-models
  namespace: ollama
data:
  models.txt: |
    deepseek-r1:14b
    llama3.1:8b
    qwen3:14b
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openwebui-oidc-config
  namespace: ollama
data:
  ENABLE_OAUTH_SIGNUP: "true"
  OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
  OAUTH_PROVIDER_NAME: "Keycloak"
  # Keep Open WebUI config GitOps-driven; otherwise "persistent config" can cause env changes (like DEFAULT_USER_ROLE)
  # to be ignored after the first launch.
  ENABLE_PERSISTENT_CONFIG: "false"
  ENABLE_OAUTH_PERSISTENT_CONFIG: "false"
  # New OAuth users were getting created with role=pending which blocks access.
  # Use role mapping (when available) and default to "user" so sign-ins work without manual activation.
  DEFAULT_USER_ROLE: "user"
  ENABLE_OAUTH_ROLE_MANAGEMENT: "true"
  # Keycloak role mapper (added by k8s-keycloak configurator) populates a top-level "roles" claim in userinfo.
  OAUTH_ROLES_CLAIM: "roles"
  # Allow all authenticated users in the Keycloak realm by default.
  # Keycloak assigns "default-roles-<realm>" (here: default-roles-external) to every user.
  OAUTH_ALLOWED_ROLES: "default-roles-external"
  # Promote members of these Keycloak roles to Open WebUI admin.
  # - ggl:keycloak-admins-suncoast-systems: existing Google group-backed role.
  # - ggl:openwebui-admins-suncoast-systems: future dedicated group (optional).
  OAUTH_ADMIN_ROLES: "admin,ggl:keycloak-admins-suncoast-systems,ggl:openwebui-admins-suncoast-systems"
  ENABLE_LOGIN_FORM: "false"
  ENABLE_PASSWORD_AUTH: "false"
  ENABLE_SIGNUP: "false"
  OPENID_PROVIDER_URL: "https://auth.suncoast.systems/realms/external/.well-known/openid-configuration"
  OPENID_REDIRECT_URI: "https://open-webui.teleport.app.suncoast.systems/oauth/oidc/login/callback"
  OAUTH_SCOPES: "openid email profile"
  OAUTH_CODE_CHALLENGE_METHOD: "S256"
  OAUTH_USERNAME_CLAIM: "preferred_username"
  OAUTH_PICTURE_CLAIM: "picture"
  OAUTH_UPDATE_PICTURE_ON_LOGIN: "true"
  WEBUI_URL: "https://open-webui.teleport.app.suncoast.systems"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openwebui-config
  namespace: ollama
data:
  openwebui.env: |
    # Optional env-style config (KEY=VALUE). Leave empty to use only envFrom.
    # Example:
    # ENABLE_SIGNUP=false
    # WEBUI_URL=https://open-webui.example.com
    OPENAI_API_BASE_URL=https://api.openai.com/v1
  openwebui.properties: |
    # Optional properties-style config. Supports "key=value" or "key: value".
    # Example:
    # ENABLE_SIGNUP=false
    # WEBUI_URL: https://open-webui.example.com
    DEFAULT_MODELS=deepseek-r1:14b
