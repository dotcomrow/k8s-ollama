# Create the "ollama" namespace
apiVersion: v1
kind: Namespace
metadata:
  name: ollama
  labels:
    app: ollama
  annotations:
    linkerd.io/inject: enabled
    field.cattle.io/projectId: local:applications
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models-pvc
  namespace: ollama
spec:
  accessModes: [ "ReadWriteMany" ]
  resources:
    requests:
      storage: 80Gi
  storageClassName: nfs-client
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: ollama
spec:
  accessModes: [ "ReadWriteMany" ]
  resources:
    requests:
      storage: 20Gi
  storageClassName: nfs-client
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-models
  namespace: ollama
data:
  models.txt: |
    deepseek-r1:14b
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openwebui-oidc-config
  namespace: ollama
data:
  ENABLE_OAUTH_SIGNUP: "true"
  OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
  OAUTH_PROVIDER_NAME: "Keycloak"
  ENABLE_LOGIN_FORM: "false"
  ENABLE_PASSWORD_AUTH: "false"
  ENABLE_SIGNUP: "false"
  OPENID_PROVIDER_URL: "https://auth.suncoast.systems/realms/internal/.well-known/openid-configuration"
  OPENID_REDIRECT_URI: "https://open-webui.teleport.app.suncoast.systems/oauth/oidc/login/callback"
  OAUTH_SCOPES: "openid email profile"
  OAUTH_CODE_CHALLENGE_METHOD: "S256"
  OAUTH_USERNAME_CLAIM: "preferred_username"
  OAUTH_PICTURE_CLAIM: "picture"
  OAUTH_UPDATE_PICTURE_ON_LOGIN: "true"
  WEBUI_URL: "https://open-webui.teleport.app.suncoast.systems"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openwebui-config
  namespace: ollama
data:
  openwebui.env: |
    # Optional env-style config (KEY=VALUE). Leave empty to use only envFrom.
    # Example:
    # ENABLE_SIGNUP=false
    # WEBUI_URL=https://open-webui.example.com
    OPENAI_API_BASE_URL=https://api.openai.com/v1
  openwebui.properties: |
    # Optional properties-style config. Supports "key=value" or "key: value".
    # Example:
    # ENABLE_SIGNUP=false
    # WEBUI_URL: https://open-webui.example.com
    DEFAULT_MODELS=deepseek-r1:14b
---
# ONE-TIME DB + VAULT SETUP (owner + static role)
apiVersion: batch/v1
kind: Job
metadata:
  name: openwebui-yugabyte-config
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  backoffLimit: 1
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes:
        - name: root-token
          secret:
            secretName: vault-root-token
      containers:
        - name: setup-owner-and-static-rotation
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh", "-c"]
          args:
            - |
              #!/bin/sh
              # No 'set -euo pipefail' per preference
              PGHOST=yb-tserver-service.yugabyte.svc.cluster.local
              PGPORT=5433
              DB=openwebui
              OWNER_LOGIN=openwebui_login
              VAULTADMIN_USER=vaultadmin

              echo "🔧 Installing clients..."
              apk add --no-cache bash curl postgresql15-client jq netcat-openbsd >/dev/null

              export VAULT_ADDR=http://vault.vault.svc.cluster.local:8200

              echo "🔑 Waiting for Vault token..."
              while [ ! -f /vault-token/VAULT_TOKEN ] && [ ! -f /vault-token/token ]; do
                sleep 2
              done

              if [ -f /vault-token/VAULT_TOKEN ]; then
                export VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"
              else
                export VAULT_TOKEN="$(cat /vault-token/token)"
              fi

              echo "🔎 Wait for DB endpoint..."
              until getent hosts "$PGHOST" >/dev/null; do sleep 3; done
              until nc -z -w1 "$PGHOST" "$PGPORT"; do sleep 3; done
              echo "✅ Yugabyte reachable"

              echo "🔐 Fetching vaultadmin password..."
              while :; do
                VAULTADMIN_PASS="$(vault kv get -field=value secret/$VAULTADMIN_USER 2>/dev/null || true)"
                [ -n "$VAULTADMIN_PASS" ] && break
                echo "⏳ Waiting for secret/$VAULTADMIN_USER ..."
                sleep 3
              done
              export PGPASSWORD="$VAULTADMIN_PASS"

              # Ensure database exists (owned by vaultadmin for now)
              while :; do
                DB_EXISTS=$(psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d yugabyte -tAc "SELECT 1 FROM pg_database WHERE datname='$DB'" 2>/dev/null || true)
                if [ "$DB_EXISTS" = "1" ]; then
                  echo "✅ Database $DB exists"
                  break
                fi
                echo "📦 Creating database $DB..."
                if createdb -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -O "$VAULTADMIN_USER" "$DB" 2>/dev/null; then
                  echo "✅ Created $DB"
                  break
                fi
                echo "⏳ Retry create DB..."
                sleep 3
              done

              # Create stable owner login if missing; allow vaultadmin to set OWNER to it
              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d yugabyte <<EOSQL
              DO \$\$
              BEGIN
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '$OWNER_LOGIN') THEN
                  CREATE ROLE $OWNER_LOGIN LOGIN;
                END IF;
              END
              \$\$;
              GRANT $OWNER_LOGIN TO $VAULTADMIN_USER;
              EOSQL

              # Ensure schema exists, reassign all objects to OWNER_LOGIN
              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$DB" <<EOSQL
              -- ensure schema
              CREATE SCHEMA IF NOT EXISTS openwebui;
              ALTER SCHEMA openwebui OWNER TO $OWNER_LOGIN;
              GRANT USAGE, CREATE ON SCHEMA openwebui TO $OWNER_LOGIN;
              ALTER ROLE $OWNER_LOGIN SET search_path = openwebui, public;

              -- reassign all existing tables
              DO \$\$
              DECLARE r RECORD;
              BEGIN
                FOR r IN
                  SELECT format('%I.%I', schemaname, tablename) AS obj
                  FROM pg_tables WHERE schemaname='openwebui'
                LOOP
                  EXECUTE format('ALTER TABLE %s OWNER TO openwebui_login', r.obj);
                END LOOP;

                -- sequences
                FOR r IN
                  SELECT format('%I.%I', sequence_schema, sequence_name) AS obj
                  FROM information_schema.sequences WHERE sequence_schema='openwebui'
                LOOP
                  EXECUTE format('ALTER SEQUENCE %s OWNER TO openwebui_login', r.obj);
                END LOOP;

                -- views
                FOR r IN
                  SELECT format('%I.%I', table_schema, table_name) AS obj
                  FROM information_schema.views WHERE table_schema='openwebui'
                LOOP
                  EXECUTE format('ALTER VIEW %s OWNER TO openwebui_login', r.obj);
                END LOOP;
              END\$\$;
              EOSQL

              echo "✅ Schema & object ownership set to $OWNER_LOGIN"

              # Create Vault static role for password rotation of fixed login
              echo "🔐 Configuring Vault static role for $OWNER_LOGIN ..."
              cat <<'JSON' | vault write yugabyte-db/static-roles/openwebui-login - 
              {
                "db_name": "yugabyte",
                "username": "openwebui_login",
                "rotation_statements": [
                  "ALTER ROLE \"{{username}}\" WITH PASSWORD '{{password}}'"
                ],
                "rotation_period": "720h"
              }
              JSON

              echo "📜 Writing policy to read static creds..."
              vault policy write openwebui-login - <<EOF
              path "yugabyte-db/static-creds/openwebui-login" {
                capabilities = ["read"]
              }
              EOF

              echo "🔗 Binding K8s SA 'openwebui' in ns 'ollama' ..."
              vault write auth/kubernetes/role/openwebui-login \
                bound_service_account_names="openwebui" \
                bound_service_account_namespaces="ollama" \
                policies="openwebui-login" \
                ttl="48h"

              echo "🧪 Verifying static creds issuance..."
              if CREDS_JSON="$(vault read -format=json yugabyte-db/static-creds/openwebui-login 2>/tmp/vault_err.log)"; then
                echo "$CREDS_JSON" | jq -e '.data.username and .data.password' >/dev/null \
                  && echo "✅ Static creds OK" \
                  || { echo "❌ Missing fields"; echo "$CREDS_JSON"; exit 1; }
              else
                echo "❌ Failed to read static creds"; cat /tmp/vault_err.log; exit 1
              fi
          volumeMounts:
            - name: root-token
              mountPath: /vault-token
              readOnly: true
---
apiVersion: batch/v1
kind: Job
metadata:
  name: copy-ollama-vault-root-token
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-10"
spec:
  backoffLimit: 1
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
    spec:
      serviceAccountName: default
      restartPolicy: Never
      containers:
        - name: copy-secret
          image: alpine/k8s:1.31.4
          command: ["/bin/sh","-c"]
          args:
            - |
              echo "🔁 Copying 'vault-root-token' from vault → ollama..."
              kubectl get secret vault-root-token -n vault -o yaml | \
                sed 's/namespace: vault/namespace: ollama/' | \
                kubectl apply -f -
              echo "✅ Secret copied."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openwebui-initial-secrets-sync
  namespace: ollama
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
    linkerd.io/inject: disabled
spec:
  backoffLimit: 1
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
    spec:
      serviceAccountName: openwebui
      restartPolicy: Never
      initContainers:
        - name: load-kubectl
          image: alpine/k8s:1.31.4
          command: ["sh","-c"]
          args: ["cp /usr/bin/kubectl /kubectl-bin/kubectl && chmod +x /kubectl-bin/kubectl"]
          volumeMounts:
            - name: kubectl-bin
              mountPath: /kubectl-bin
      containers:
        - name: vault-sync-once
          image: ubuntu:22.04
          command: ["/bin/bash","-c"]
          args:
            - |
              RETRY_INTERVAL=5

              echo "🔧 Installing tools..."
              while true; do
                apt-get update && apt-get install -y curl unzip jq postgresql-client && break
                echo "⚠️ apt-get failed. Retrying in ${RETRY_INTERVAL}s..."; sleep "$RETRY_INTERVAL"
              done

              echo "📌 Installing Vault CLI..."
              while true; do
                curl -fsSL -o vault.zip https://releases.hashicorp.com/vault/1.15.4/vault_1.15.4_linux_amd64.zip && break
                echo "⚠️ Vault download failed. Retrying..."; sleep "$RETRY_INTERVAL"
              done
              unzip -o vault.zip >/dev/null && mv vault /usr/local/bin/ && chmod +x /usr/local/bin/vault

              export VAULT_ADDR=http://vault.vault.svc.cluster.local:8200

              if [ -f /vault-token/VAULT_TOKEN ]; then
                VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"
              elif [ -f /vault-token/token ]; then
                VAULT_TOKEN="$(cat /vault-token/token)"
              else
                echo "❌ No Vault token file found in /vault-token"
                ls -la /vault-token || true
                exit 1
              fi
              export VAULT_TOKEN

              echo "⏳ Waiting for Vault static creds yugabyte-db/static-creds/openwebui-login ..."
              while true; do
                CREDS_JSON=$(vault read -format=json yugabyte-db/static-creds/openwebui-login 2>/tmp/vault_err.log || true)
                if [ -n "$CREDS_JSON" ] && echo "$CREDS_JSON" | jq -e '.data.username and .data.password' >/dev/null; then
                  USERNAME=$(echo "$CREDS_JSON" | jq -r '.data.username')
                  PASSWORD=$(echo "$CREDS_JSON" | jq -r '.data.password')
                  echo "✅ Got static creds for user: $USERNAME"
                  break
                fi
                echo "⚠️ Static creds not available yet. Retrying..."
                cat /tmp/vault_err.log || true
                sleep "$RETRY_INTERVAL"
              done

              USERNAME_ENC=$(printf '%s' "$USERNAME" | jq -sRr @uri)
              PASSWORD_ENC=$(printf '%s' "$PASSWORD" | jq -sRr @uri)
              DB_URL="postgresql://${USERNAME_ENC}:${PASSWORD_ENC}@yb-tserver-service.yugabyte.svc.cluster.local:5433/openwebui?options=-csearch_path%3Dopenwebui"

              echo "🔐 Creating/updating Kubernetes secret openwebui-db-url..."
              cat <<EOF | kubectl apply -f -
              apiVersion: v1
              kind: Secret
              metadata:
                name: openwebui-db-url
                namespace: ollama
              type: Opaque
              stringData:
                DATABASE_URL: ${DB_URL}
              EOF
              echo "✅ DATABASE_URL created/updated."

              echo "⏳ Waiting for Keycloak client secrets in Vault..."
              while true; do
                OIDC_CLIENT_ID=$(vault kv get -field=value secret/keycloak-client-id-openwebui 2>/tmp/vault_err.log || true)
                OIDC_CLIENT_SECRET=$(vault kv get -field=value secret/keycloak-client-secret-openwebui 2>/tmp/vault_err.log || true)
                if [ -n "$OIDC_CLIENT_ID" ] && [ -n "$OIDC_CLIENT_SECRET" ]; then
                  echo "✅ Got Keycloak client credentials"
                  break
                fi
                echo "⚠️ Keycloak client credentials not available yet. Retrying..."
                cat /tmp/vault_err.log || true
                sleep "$RETRY_INTERVAL"
              done

              echo "🔐 Creating/updating Kubernetes secret openwebui-oidc-secrets..."
              cat <<EOF | kubectl apply -f -
              apiVersion: v1
              kind: Secret
              metadata:
                name: openwebui-oidc-secrets
                namespace: ollama
              type: Opaque
              stringData:
                OAUTH_CLIENT_ID: ${OIDC_CLIENT_ID}
                OAUTH_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
              EOF
              echo "✅ OIDC secrets created/updated."

              echo "⏳ Waiting for OpenAI API key in Vault..."
              while true; do
                OPENAI_API_KEY=$(vault kv get -field=value secret/open_ai_key 2>/tmp/vault_err.log || true)
                if [ -n "$OPENAI_API_KEY" ]; then
                  echo "✅ Got OpenAI API key"
                  break
                fi
                echo "⚠️ OpenAI API key not available yet. Retrying..."
                cat /tmp/vault_err.log || true
                sleep "$RETRY_INTERVAL"
              done

              echo "🔐 Creating/updating Kubernetes secret openwebui-openai..."
              cat <<EOF | kubectl apply -f -
              apiVersion: v1
              kind: Secret
              metadata:
                name: openwebui-openai
                namespace: ollama
              type: Opaque
              stringData:
                OPENAI_API_KEY: ${OPENAI_API_KEY}
              EOF
              echo "✅ OpenAI secret created/updated."
          volumeMounts:
            - name: kubectl-bin
              mountPath: /usr/local/bin
            - name: root-token
              mountPath: /vault-token
              readOnly: true
      volumes:
        - name: kubectl-bin
          emptyDir: {}
        - name: root-token
          secret:
            secretName: vault-root-token
---
# OLLAMA (unchanged functionally)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
  labels:
    app: ollama
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      nodeSelector:
        dedicated: work-node-gpu
      runtimeClassName: nvidia
      initContainers:
        - name: download-models
          image: ollama/ollama:latest
          command: ["/bin/sh","-c"]
          args:
            - |
              echo "🚀 Starting Ollama server..."
              ollama serve > /tmp/ollama.log 2>&1 &
              SERVER_PID=$!
              apt update && apt install wget -y
              echo "⏳ Waiting for Ollama server..."
              i=1; while true; do
                if wget --spider -q http://localhost:11434/api/tags; then
                  echo "✅ Ready"; break; fi
                echo "⏳ Still waiting... ($i)"; i=$((i+1)); sleep 1
              done
              MODEL_FILE="/opt/ollama-models/models.txt"
              echo "📄 Downloading models listed in $MODEL_FILE..."
              while IFS= read -r model; do
                [ -n "$model" ] && [ "$(echo "$model" | cut -c1)" != "#" ] && \
                  echo "📦 Pulling model: $model" && ollama pull "$model"
              done < "$MODEL_FILE"
              echo "🛑 Stopping Ollama server (PID=$SERVER_PID)..."
              kill $SERVER_PID; wait $SERVER_PID
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama/models
            - name: model-list
              mountPath: /opt/ollama-models
              readOnly: true
      containers:
        - name: ollama
          image: ollama/ollama:latest
          securityContext:
            capabilities: { add: ["SYS_ADMIN"] }
          env:
            - { name: OLLAMA_KEEP_ALIVE,      value: "-1" }
            - { name: OLLAMA_WARMUP_MODEL,    value: "" }
            - { name: OLLAMA_MAX_LOADED_MODELS, value: "1" }
            - { name: OLLAMA_NUM_PARALLEL,    value: "2" }
            - { name: OLLAMA_THREADS,         value: "4" }
            - { name: OLLAMA_TIMEOUT,         value: "1200" }
            - { name: OLLAMA_GPU_MEMORY,      value: "15500" }
            - { name: OLLAMA_FLASH_ATTENTION, value: "true" }
            - { name: OLLAMA_CONTEXT_LENGTH,  value: "8192" }
            - { name: OLLAMA_BATCH_SIZE,      value: "512" }
          command: ["/bin/sh","-c"]
          args:
            - |
              echo "Resetting GPU..."
              apt install wget -y
              nvidia-smi --gpu-reset -i 0 || echo "GPU reset failed or not allowed"
              apt update && apt install wget curl -y
              export OLLAMA_NO_CPU_OFFLOAD=1
              echo "🚀 Starting Ollama server..."
              ollama serve > /tmp/ollama.log 2>&1 &
              SERVER_PID=$!

              trap 'kill "$SERVER_PID"; wait "$SERVER_PID"' TERM INT

              echo "⏳ Waiting for Ollama to be ready..."
              i=0
              until wget --spider -q http://localhost:11434/api/tags; do
                i=$((i + 1))
                if [ "$i" -gt 120 ]; then
                  echo "⚠️ Ollama readiness timeout; continuing without warm-up."
                  break
                fi
                sleep 1
              done

              trim() {
                value="$1"
                value="${value#"${value%%[![:space:]]*}"}"
                value="${value%"${value##*[![:space:]]}"}"
                printf '%s' "$value"
              }

              get_prop_value() {
                file="$1"
                key="$2"
                [ -f "$file" ] || return 1
                while IFS= read -r line || [ -n "$line" ]; do
                  case "$line" in
                    ""|\#*|\;*) continue ;;
                  esac
                  case "$line" in
                    *=*)
                      k="${line%%=*}"
                      v="${line#*=}"
                      ;;
                    *:*)
                      k="${line%%:*}"
                      v="${line#*:}"
                      ;;
                    *)
                      continue
                      ;;
                  esac
                  k="$(trim "$k")"
                  if [ "$k" = "$key" ]; then
                    v="$(trim "$v")"
                    v="${v%\"}"
                    v="${v#\"}"
                    v="${v%\'}"
                    v="${v#\'}"
                    printf '%s' "$v"
                    return 0
                  fi
                done < "$file"
                return 1
              }

              DEFAULT_MODEL=""
              DEFAULT_MODEL="$(get_prop_value /config/openwebui.env DEFAULT_MODELS || true)"
              if [ -z "$DEFAULT_MODEL" ]; then
                DEFAULT_MODEL="$(get_prop_value /config/openwebui.properties DEFAULT_MODELS || true)"
              fi
              if [ -z "$DEFAULT_MODEL" ]; then
                DEFAULT_MODEL="${OLLAMA_WARMUP_MODEL:-}"
              fi
              DEFAULT_MODEL="$(trim "$DEFAULT_MODEL")"
              DEFAULT_MODEL="${DEFAULT_MODEL%%,*}"
              if [ -n "$DEFAULT_MODEL" ]; then
                if echo "${OLLAMA_KEEP_ALIVE:-5m}" | grep -Eq '^-?[0-9]+$'; then
                  KEEP_ALIVE_JSON="${OLLAMA_KEEP_ALIVE}"
                else
                  KEEP_ALIVE_JSON="\"${OLLAMA_KEEP_ALIVE:-5m}\""
                fi
                echo "🔥 Warming up default model: ${DEFAULT_MODEL}"
                curl -fsS -X POST http://localhost:11434/api/generate \
                  -H "Content-Type: application/json" \
                  -d "{\"model\": \"${DEFAULT_MODEL}\", \"prompt\": \" \", \"stream\": false, \"keep_alive\": ${KEEP_ALIVE_JSON}}" >/dev/null || \
                  echo "⚠️ Warm-up request failed"
              fi

              wait "$SERVER_PID"
          ports:
            - containerPort: 11434
          resources:
            requests:
              cpu: "4"
              memory: "12Gi"
              nvidia.com/gpu: 1
            limits:
              cpu: "4"
              memory: "12Gi"
              nvidia.com/gpu: 1
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama/models
            - name: model-list
              mountPath: /opt/ollama-models
              readOnly: true
            - name: openwebui-config
              mountPath: /config
              readOnly: true
      restartPolicy: Always
      volumes:
        - name: ollama-data
          persistentVolumeClaim: { claimName: ollama-models-pvc }
        - name: model-list
          configMap: { name: ollama-models }
        - name: openwebui-config
          configMap:
            name: openwebui-config
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ollama
  annotations:
    # Gravitee discovery
    gravitee.io/expose: "true"
    gravitee.io/context-path: "/ollama"
    gravitee.io/auth-required: "ollama-token"
    gravitee.io/approval-required: "admin"

    # Definition metadata (string)
    gravitee.io/description: "Ollama HTTP API"
    gravitee.io/version: "latest"
    gravitee.io/tags: "ollama,ai,llm"
    gravitee.io/definition-name: "ollama-api"
    gravitee.io/definition-summary: "Ollama HTTP API"
    gravitee.io/definition-description: "Ollama model serving API"
    gravitee.io/definition-version: "latest"
    gravitee.io/definition-type: "HTTP"
    gravitee.io/definition-context-path: "/ollama"
    gravitee.io/definition-visibility: "PUBLIC"
    gravitee.io/definition-state: "STARTED"
    gravitee.io/definition-lifecycle-state: "PUBLISHED"

    # Listener hints
    gravitee.io/definition-listener-host: "ollama.ollama.svc.cluster.local"
    gravitee.io/definition-listener-port: "11434"

    # Definition list fields (comma-separated)
    gravitee.io/definition-groups: "ai,ml"
    gravitee.io/definition-tags: "ollama,llm,ai"
    gravitee.io/definition-labels: "internal,ai"
    gravitee.io/definition-categories: "ai,ml"
    gravitee.io/definition-path-mappings: "/ollama/*"

    # Definition JSON fields (raw JSON strings)
    gravitee.io/definition-metadata: '{"owner":"ai","slack":"#ai"}'
    gravitee.io/definition-properties: '{"tier":"prod","region":"us-central1"}'
    gravitee.io/definition-resources: '[]'
