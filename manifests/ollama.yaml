# Create the "ollama" namespace
apiVersion: v1
kind: Namespace
metadata:
  name: ollama
  labels:
    app: ollama
  annotations:
    linkerd.io/inject: enabled
    field.cattle.io/projectId: local:applications
    scheduler.alpha.kubernetes.io/node-selector: "dedicated=work-node"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models-pvc
  namespace: ollama
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 80Gi
  storageClassName: nfs-client
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: ollama
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
  storageClassName: nfs-client
---
apiVersion: v1
kind: Secret
metadata:
  name: open-webui-db-secret
  namespace: ollama
type: Opaque
stringData:
  PGUSER: "<path:secret/data/ollama-yugabyte-username#value>"
  PGPASSWORD: "<path:secret/data/ollama-yugabyte-password#value>"
  PGHOST: yb-tserver-service.yugabyte.svc.cluster.local
  PGPORT: "5433"
  PGDATABASE: openwebui
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-models
  namespace: ollama
data:
  models.txt: |
    # default: deepseek-r1:14b
    deepseek-r1:14b
    codellama:13b-instruct
    llama3:8b-instruct
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-openwebui-vault-role
  namespace: vault
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes:
        - name: root-token
          secret:
            secretName: vault-root-token
      containers:
        - name: setup-role
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "📌 Creating Vault role for openwebui..."
              export VAULT_ADDR=http://vault.vault.svc.cluster.local:8200

              # Read Vault root token from mounted secret
              VAULT_TOKEN=$(cat /vault-token/VAULT_TOKEN)
              export VAULT_TOKEN

              echo "🔐 Using root token from Secret..."

              vault policy write openwebui-db-policy - <<EOF
              path "secret/data/openwebui-yugabyte-username" {
                capabilities = ["read"]
              }
              path "secret/data/openwebui-yugabyte-password" {
                capabilities = ["read"]
              }
              EOF

              vault write auth/kubernetes/role/openwebui \
                bound_service_account_names=openwebui \
                bound_service_account_namespaces=ollama \
                policies=openwebui-db-policy \
                ttl=1h
          volumeMounts:
            - name: root-token
              mountPath: /vault-token
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: copy-vault-root-token
  namespace: vault
spec:
  backoffLimit: 1
  template:
    spec:
      serviceAccountName: default
      restartPolicy: Never
      containers:
        - name: copy-secret
          image: bitnami/kubectl:latest
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          command:
            - /bin/sh
            - -c
            - |
              echo "🔁 Copying 'vault-root-token' from vault → ollama..."
              kubectl get secret vault-root-token -n vault -o yaml | \
                sed 's/namespace: vault/namespace: ollama/' | \
                kubectl apply -f -
              echo "✅ Secret copied successfully."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      runtimeClassName: nvidia

      initContainers:
        - name: wait-for-vault-role
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "🔄 Waiting for Vault role 'openwebui' to exist..."
              export VAULT_ADDR=http://vault.vault.svc.cluster.local:8200
              export VAULT_TOKEN=$(cat /vault-token/VAULT_TOKEN)

              while true; do
                if vault read auth/kubernetes/role/openwebui > /dev/null 2>&1; then
                  echo "✅ Vault role is ready."
                  exit 0
                fi
                echo "⏳ Still waiting..."
                sleep 60
              done
          volumeMounts:
            - name: vault-token
              mountPath: /vault-token
              readOnly: true

      containers:
        - name: ollama
          image: ollama/ollama:latest
          securityContext:
            capabilities:
              add: ["SYS_ADMIN"]
          env:
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            - name: OLLAMA_NUM_PARALLEL
              value: "2"
            - name: OLLAMA_THREADS
              value: "12"
            - name: OLLAMA_TIMEOUT
              value: "1200"
            - name: OLLAMA_GPU_MEMORY
              value: "15500"
            - name: OLLAMA_FLASH_ATTENTION
              value: "true"
            - name: OLLAMA_CONTEXT_LENGTH
              value: "8192"
            - name: OLLAMA_BATCH_SIZE
              value: "512"
          command: ["/bin/sh"]
          args:
            - -c
            - |
              echo "Resetting GPU..."
              nvidia-smi --gpu-reset -i 0 || echo "GPU reset failed or not allowed"

              MODEL_FILE="/opt/ollama-models/models.txt"
              DEFAULT_MODEL=$(grep '^# default:' "$MODEL_FILE" | awk -F': ' '{print $2}')
              echo "Default model: $DEFAULT_MODEL"
              export OLLAMA_NO_CPU_OFFLOAD=1
              (
                echo "Waiting for Ollama to be ready..."
                until ollama list >/dev/null 2>&1; do
                  echo "Waiting..."; sleep 1;
                done

                echo "Loading models listed in $MODEL_FILE..."
                while IFS= read -r model; do
                  # Skip comments and blank lines
                  if [ -n "$model" ] && [ "$(echo "$model" | cut -c1)" != "#" ]; then
                    echo "Warming up model: $model"
                    ollama run "$model"
                  fi
                done < "$MODEL_FILE"

                echo "All models warmed. Starting Ollama server."
                ollama run $DEFAULT_MODEL
                echo "Models are ready."
                echo "Default model is: $DEFAULT_MODEL"
              ) &
              exec ollama serve
          ports:
            - containerPort: 11434
          resources:
            requests:
              cpu: "6000m"        # Idle baseline - allows the pod to run with minimal footprint
              memory: "8Gi"      # Enough for Ollama to start but not excessive
              nvidia.com/gpu: 1
            limits:
              cpu: "12000m"      # Full access to 8 cores when needed
              memory: "12Gi"     # Same as before - memory usage often spikes for LLM inference
              nvidia.com/gpu: 1
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
            - name: model-list
              mountPath: /opt/ollama-models
              readOnly: true

        - name: keep-warm
          image: alpine:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              apk add --no-cache wget >/dev/null 2>&1
              MODEL_FILE="/opt/ollama-models/models.txt"
              DEFAULT_MODEL=$(grep '^# default:' "$MODEL_FILE" | awk -F': ' '{print $2}')

              echo "Keep-warm default model: $DEFAULT_MODEL"

              while true; do
                echo "Keeping model $DEFAULT_MODEL warm..."
                wget -qO- --header="Content-Type: application/json" \
                  --post-data="{\"model\": \"$DEFAULT_MODEL\", \"prompt\": \" \", \"stream\": false}" \
                  http://localhost:11434/api/generate >/dev/null
                sleep 120
              done
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          volumeMounts:
            - name: model-list
              mountPath: /opt/ollama-models
              readOnly: true
      restartPolicy: Always

      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: ollama-models-pvc
        - name: model-list
          configMap:
            name: ollama-models
        - name: vault-token
          secret:
            secretName: vault-root-token
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ollama
spec:
  selector:
    app: ollama
  ports:
    - name: http
      protocol: TCP
      port: 11434
      targetPort: 11434
  clusterIP: None
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: ollama
  labels:
    app: open-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      initContainers:
        - name: wait-for-vault-role
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "🔄 Waiting for Vault role 'openwebui' to exist..."
              export VAULT_ADDR=http://vault.vault.svc.cluster.local:8200
              export VAULT_TOKEN=$(cat /vault-token/VAULT_TOKEN)

              while true; do
                if vault read auth/kubernetes/role/openwebui > /dev/null 2>&1; then
                  echo "✅ Vault role is ready."
                  exit 0
                fi
                echo "⏳ Still waiting..."
                sleep 60
              done
          volumeMounts:
            - name: vault-token
              mountPath: /vault-token
              readOnly: true

      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:latest
          ports:
            - containerPort: 8080
          env:
            - name: OLLAMA_BASE_URL
              value: "http://ollama.ollama.svc.cluster.local:11434"
            - name: OLLAMA_API_TIMEOUT
              value: "300"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: open-webui-db-secret
                  key: PGUSER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: open-webui-db-secret
                  key: PGPASSWORD
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: open-webui-db-secret
                  key: PGHOST
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: open-webui-db-secret
                  key: PGPORT
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: open-webui-db-secret
                  key: PGDATABASE
          command: ["/bin/sh"]
          args:
          - -c
          - |
            echo "⏳ Waiting for YugabyteDB to be ready at ${PGHOST}:${PGPORT}..."
            while true; do
              nc -z -w 1 "${PGHOST}" "${PGPORT}" >/dev/null 2>&1 && break
              echo "🔄 Still waiting for Yugabyte..."
              sleep 5
            done

            echo "✅ YugabyteDB is available."

            export DATABASE_URL="postgresql://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}"
            echo "Starting with DATABASE_URL=$DATABASE_URL"
            exec /app/backend/start.sh
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "3Gi"
          volumeMounts:
            - name: webui-data
              mountPath: /app/backend/data
      volumes:
        - name: webui-data
          persistentVolumeClaim:
            claimName: open-webui-data
        - name: vault-token
          secret:
            secretName: vault-root-token
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: ollama
spec:
  selector:
    app: open-webui
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: open-webui-route
  namespace: ollama
  annotations:
    apisix.apache.org/timeout: "900"
    apisix.apache.org/websocket: "true"
spec:
  ingressClassName: apisix
  http:
    - name: webui
      websocket: true
      match:
        hosts:
          - ai.app.suncoast.systems
        paths:
          - /*
      backends:
        - serviceName: open-webui
          servicePort: 80
