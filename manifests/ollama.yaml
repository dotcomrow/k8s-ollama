# Create the "ollama" namespace
apiVersion: v1
kind: Namespace
metadata:
  name: ollama
  labels:
    app: ollama
  annotations:
    linkerd.io/inject: enabled
    field.cattle.io/projectId: local:applications
    scheduler.alpha.kubernetes.io/node-selector: "dedicated=work-node"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models-pvc
  namespace: ollama
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 80Gi
  storageClassName: nfs-client
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: ollama
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
  storageClassName: nfs-client
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-models
  namespace: ollama
data:
  models.txt: |
    # default: deepseek-r1:14b
    deepseek-r1:14b
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-openwebui-vault-role
  namespace: vault
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes:
        - name: root-token
          secret:
            secretName: vault-root-token
      containers:
        - name: setup-role
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh", "-c"]
          args:
            - |
              #!/bin/bash
              set -euo pipefail

              echo "📌 Creating Vault policy and role for openwebui..."

              # --- Setup environment ---
              export VAULT_ADDR=http://vault.vault.svc.cluster.local:8200

              # Wait for Vault token file
              while true; do
                if [[ -f /vault-token/VAULT_TOKEN ]]; then
                  export VAULT_TOKEN=$(cat /vault-token/VAULT_TOKEN)
                  break
                fi
                echo "🔄 Waiting for Vault token file..."
                sleep 2
              done

              # Wait for DNS to resolve PGHOST
              export PGHOST=yb-tserver-service.yugabyte.svc.cluster.local
              export PGPORT=5433
              while true; do
                if getent hosts "$PGHOST" > /dev/null; then
                  echo "✅ DNS resolved for $PGHOST"
                  break
                fi
                echo "🔄 Waiting for DNS to resolve $PGHOST..."
                sleep 3
              done

              # Wait for TCP port to be reachable
              echo "⏳ Waiting for YugabyteDB to become available at $PGHOST:$PGPORT..."
              while ! nc -z -w 1 "$PGHOST" "$PGPORT"; do
                echo "🔄 Still waiting for Yugabyte..."
                sleep 3
              done
              echo "✅ YugabyteDB is available."

              # --- Get Vault admin password ---
              echo "🔐 Fetching Vault admin password from secret/vaultadmin..."
              while true; do
                VAULTADMIN_PASSWORD=$(vault kv get -field=value secret/vaultadmin 2>/dev/null || true)
                if [[ -n "$VAULTADMIN_PASSWORD" ]]; then
                  echo "✅ Vault admin password retrieved."
                  break
                fi
                echo "🔄 Waiting for secret/vaultadmin to be available in Vault..."
                sleep 3
              done

              # --- Reconfigure Vault DB secrets engine connection ---
              echo "⚙️ Reconfiguring Vault DB connection (path: yugabyte-db/config/yugabyte)..."
              vault delete yugabyte-db/config/yugabyte || echo "ℹ️ No previous config to delete."

              while true; do
                vault write yugabyte-db/config/yugabyte \
                  plugin_name=postgresql-database-plugin \
                  allowed_roles="openwebui" \
                  connection_url="postgresql://{{username}}:{{password}}@$PGHOST:$PGPORT/openwebui?sslmode=disable" \
                  username="vaultadmin" \
                  password="$VAULTADMIN_PASSWORD" && break
                echo "🔄 Retrying DB config write to Vault..."
                sleep 3
              done
              echo "✅ Vault DB config written."

              # --- Create Vault DB role with fixed database name ---
              echo "👤 Creating Vault DB role: openwebui"
              while true; do
                vault write yugabyte-db/roles/openwebui \
                  db_name=yugabyte \
                  creation_statements="
                    CREATE ROLE \"{{name}}\" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}';
                    GRANT CONNECT ON DATABASE openwebui TO \"{{name}}\"; 
                    GRANT USAGE, CREATE ON SCHEMA public TO \"{{name}}\";" \
                  default_ttl=24h \
                  max_ttl=24h && break
                echo "🔄 Retrying Vault DB role creation..."
                sleep 3
              done
              echo "✅ Vault DB role 'openwebui' created."

              # --- Write Vault policy ---
              echo "📝 Writing Vault policy for 'openwebui'..."
              cat <<EOF > /tmp/openwebui-policy.hcl
              path "yugabyte-db/creds/openwebui" {
                capabilities = ["read"]
              }
              EOF

              while true; do
                vault policy write openwebui /tmp/openwebui-policy.hcl && break
                echo "🔄 Retrying Vault policy write..."
                sleep 3
              done
              echo "✅ Vault policy 'openwebui' created."

              # --- Bind Kubernetes SA to Vault policy ---
              echo "🔗 Binding Kubernetes service account to Vault policy..."
              while true; do
                vault write auth/kubernetes/role/openwebui \
                  bound_service_account_names=openwebui \
                  bound_service_account_namespaces=ollama \
                  policies=openwebui \
                  ttl=24h && break
                echo "🔄 Retrying Kubernetes role binding..."
                sleep 3
              done
              echo "✅ Vault K8s role binding complete."

              # --- Verify: Try to generate credentials via Vault (dry run) ---
              echo "🔎 Verifying Vault DB role access by requesting test credentials..."
              while true; do
                if vault read yugabyte-db/creds/openwebui >/dev/null 2>&1; then
                  echo "✅ Verified: Vault can generate credentials for openwebui."
                  break
                fi
                echo "🔄 Retrying test credential generation from Vault..."
                sleep 3
              done

          volumeMounts:
            - name: root-token
              mountPath: /vault-token
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-openwebui-db
  namespace: ollama
spec:
  backoffLimit: 1
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
    spec:
      restartPolicy: Never

      initContainers:
        - name: inject-vault
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh", "-c"]
          args:
            - cp /bin/vault /vault-bin/vault && chmod +x /vault-bin/vault
          volumeMounts:
            - name: vault-bin
              mountPath: /vault-bin

      containers:
        - name: create-db
          image: bitnami/postgresql:15
          command: ["/bin/bash", "-c"]
          args:
            - |
              #!/bin/bash
              set -euo pipefail

              export PATH=$PATH:/vault-bin
              export VAULT_ADDR=http://vault.vault.svc.cluster.local:8200

              echo "🔄 Waiting for YugabyteDB to be ready..."

              # Wait for DNS to resolve PGHOST
              export PGHOST="yb-tserver-service.yugabyte.svc.cluster.local"
              export PGPORT="5433"
              while true; do
                if getent hosts "$PGHOST" > /dev/null; then
                  echo "✅ DNS resolved: $PGHOST"
                  break
                fi
                echo "🔄 Waiting for DNS resolution of $PGHOST..."
                sleep 3
              done

              # Wait for vault token file to exist and read it
              while true; do
                if [[ -f /vault-token/VAULT_TOKEN ]]; then
                  export VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"
                  break
                fi
                echo "🔄 Waiting for Vault token file to appear..."
                sleep 2
              done

              # Wait for secret to become available
              while true; do
                PGPASSWORD="$(vault kv get -field=value secret/vaultadmin 2>/dev/null || true)"
                if [[ -n "$PGPASSWORD" ]]; then
                  export PGPASSWORD
                  echo "✅ Retrieved vaultadmin password from Vault"
                  break
                fi
                echo "🔄 Waiting for Vault secret secret/vaultadmin..."
                sleep 3
              done

              export PGUSER="vaultadmin"

              # Wait for database to accept connections
              i=1
              while true; do
                echo "⏳ Checking connection... ($i)"
                if psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d yugabyte -c "SELECT 1;" >/dev/null 2>&1; then
                  echo "✅ Connected to YugabyteDB."
                  break
                fi
                sleep 3
                i=$((i + 1))
              done

              # Ensure target database exists
              while true; do
                echo "🔍 Checking for 'openwebui' DB..."
                EXISTS=$(psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d yugabyte -tAc "SELECT 1 FROM pg_database WHERE datname='openwebui'" || true)
                if [[ "$EXISTS" == "1" ]]; then
                  echo "✅ Database 'openwebui' already exists."
                  break
                fi

                echo "📦 Creating database 'openwebui'..."
                if createdb -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" openwebui 2>/dev/null; then
                  echo "✅ Database 'openwebui' created."
                  break
                else
                  echo "🔁 Failed to create database. Will retry..."
                  sleep 3
                fi
              done

              echo "✅ Job complete, exiting cleanly."
              exit 0

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: vault-token
              mountPath: /vault-token
              readOnly: true
            - name: vault-bin
              mountPath: /vault-bin
      volumes:
        - name: vault-token
          secret:
            secretName: vault-root-token
        - name: vault-bin
          emptyDir: {}
      serviceAccountName: default
---
apiVersion: batch/v1
kind: Job
metadata:
  name: copy-vault-root-token
  namespace: vault
spec:
  backoffLimit: 1
  template:
    spec:
      serviceAccountName: default
      restartPolicy: Never
      containers:
        - name: copy-secret
          image: bitnami/kubectl:latest
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          command:
            - /bin/sh
            - -c
            - |
              echo "🔁 Copying 'vault-root-token' from vault → ollama..."
              kubectl get secret vault-root-token -n vault -o yaml | \
                sed 's/namespace: vault/namespace: ollama/' | \
                kubectl apply -f -
              echo "✅ Secret copied successfully."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      runtimeClassName: nvidia

      initContainers:
        - name: wait-for-vault-role
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "🔄 Waiting for Vault role 'openwebui' to exist..."
              export VAULT_ADDR=http://vault.vault.svc.cluster.local:8200
              export VAULT_TOKEN=$(cat /vault-token/VAULT_TOKEN)

              while true; do
                if vault read auth/kubernetes/role/openwebui > /dev/null 2>&1; then
                  echo "✅ Vault role is ready."
                  exit 0
                fi
                echo "⏳ Still waiting..."
                sleep 60
              done
          volumeMounts:
            - name: vault-token
              mountPath: /vault-token
              readOnly: true

        - name: download-models
          image: ollama/ollama:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "🚀 Starting Ollama server..."
              ollama serve > /tmp/ollama.log 2>&1 &
              SERVER_PID=$!
              apt update && apt install wget -y
              # Wait for the server to start responding
              echo "⏳ Waiting for Ollama server to be ready..."
              i=1
              while true; do
                if wget --spider -q http://localhost:11434/api/tags; then
                  echo "✅ Ollama server is ready!"
                  break
                fi
                echo "⏳ Still waiting... ($i)"
                i=$((i + 1))
                sleep 1
              done

              MODEL_FILE="/opt/ollama-models/models.txt"
              echo "📄 Downloading models listed in $MODEL_FILE..."

              while IFS= read -r model; do
                if [ -n "$model" ] && [ "$(echo "$model" | cut -c1)" != "#" ]; then
                  echo "📦 Pulling model: $model"
                  ollama pull "$model"
                fi
              done < "$MODEL_FILE"

              echo "🛑 Stopping Ollama server (PID=$SERVER_PID)..."
              kill $SERVER_PID
              wait $SERVER_PID
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama/models
            - name: model-list
              mountPath: /opt/ollama-models
              readOnly: true

      containers:
        - name: ollama
          image: ollama/ollama:latest
          securityContext:
            capabilities:
              add: ["SYS_ADMIN"]
          env:
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            - name: OLLAMA_NUM_PARALLEL
              value: "2"
            - name: OLLAMA_THREADS
              value: "12"
            - name: OLLAMA_TIMEOUT
              value: "1200"
            - name: OLLAMA_GPU_MEMORY
              value: "15500"
            - name: OLLAMA_FLASH_ATTENTION
              value: "true"
            - name: OLLAMA_CONTEXT_LENGTH
              value: "8192"
            - name: OLLAMA_BATCH_SIZE
              value: "512"
          command: ["/bin/sh"]
          args:
            - -c
            - |
              echo "Resetting GPU..."
              nvidia-smi --gpu-reset -i 0 || echo "GPU reset failed or not allowed"
              apt update && apt install wget curl -y
              MODEL_FILE="/opt/ollama-models/models.txt"
              DEFAULT_MODEL=$(grep '^# default:' "$MODEL_FILE" | awk -F': ' '{print $2}' | xargs)
              echo "Default model: $DEFAULT_MODEL"
              export OLLAMA_NO_CPU_OFFLOAD=1

              (
                echo "⏳ Waiting for Ollama to be ready..."
                until wget --spider -q http://localhost:11434/api/tags; do
                  echo "Waiting..."
                  sleep 1
                done

                echo "🔥 Warming up default model: $DEFAULT_MODEL"
                # Trigger loading of default model into memory
                curl -s -X POST http://localhost:11434/api/generate \
                  -H "Content-Type: application/json" \
                  -d "{\"model\": \"$DEFAULT_MODEL\", \"prompt\": \" \", \"stream\": false}" >/dev/null

                echo "✅ Default model warmed and ready."
              ) &

              # Start Ollama server in foreground
              exec ollama serve
          ports:
            - containerPort: 11434
          resources:
            requests:
              cpu: "6000m"        # Idle baseline - allows the pod to run with minimal footprint
              memory: "8Gi"      # Enough for Ollama to start but not excessive
              nvidia.com/gpu: 1
            limits:
              cpu: "12000m"      # Full access to 8 cores when needed
              memory: "12Gi"     # Same as before - memory usage often spikes for LLM inference
              nvidia.com/gpu: 1
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama/models
            - name: model-list
              mountPath: /opt/ollama-models
              readOnly: true

        - name: keep-warm
          image: alpine:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              apk add --no-cache wget jq >/dev/null 2>&1

              while true; do
                ACTIVE_MODEL=$(wget -qO- http://localhost:11434/api/tags | jq -r '.models[0].name')
                
                if [ -n "$ACTIVE_MODEL" ] && [ "$ACTIVE_MODEL" != "null" ]; then
                  echo "🔄 Keeping model $ACTIVE_MODEL warm..."
                  wget -qO- --header="Content-Type: application/json" \
                    --post-data="{\"model\": \"$ACTIVE_MODEL\", \"prompt\": \" \", \"stream\": false}" \
                    http://localhost:11434/api/generate >/dev/null
                else
                  echo "⚠️ No active model loaded."
                fi

                sleep 120
              done
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          volumeMounts:
            - name: model-list
              mountPath: /opt/ollama-models
              readOnly: true
      restartPolicy: Always

      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: ollama-models-pvc
        - name: model-list
          configMap:
            name: ollama-models
        - name: vault-token
          secret:
            secretName: vault-root-token
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ollama
spec:
  selector:
    app: ollama
  ports:
    - name: http
      protocol: TCP
      port: 11434
      targetPort: 11434
  clusterIP: None
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openwebui
  namespace: ollama
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-writer
  namespace: ollama
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-writer-binding
  namespace: ollama
subjects:
  - kind: ServiceAccount
    name: default
    namespace: ollama
roleRef:
  kind: Role
  name: secret-writer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sync-openwebui-db-secret
  namespace: ollama
spec:
  schedule: "0 */6 * * *"  # Every 6 hours
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          annotations:
            linkerd.io/inject: disabled
        spec:
          serviceAccountName: default
          restartPolicy: Never
          initContainers:
            - name: load-kubectl
              image: bitnami/kubectl:latest
              command: ["sh", "-c"]
              args:
                - cp /opt/bitnami/kubectl/bin/kubectl /kubectl-bin/kubectl && chmod +x /kubectl-bin/kubectl
              volumeMounts:
                - name: kubectl-bin
                  mountPath: /kubectl-bin
          containers:
            - name: vault-sync
              image: ubuntu:22.04
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  RETRY_INTERVAL=5

                  echo "🔧 Installing tools..."
                  while true; do
                    apt-get update && apt-get install -y curl unzip jq && break
                    echo "⚠️ apt-get failed. Retrying in ${RETRY_INTERVAL}s..."
                    sleep "$RETRY_INTERVAL"
                  done

                  echo "📌 Installing Vault CLI..."
                  while true; do
                    curl -fsSL -o vault.zip https://releases.hashicorp.com/vault/1.15.4/vault_1.15.4_linux_amd64.zip && break
                    echo "⚠️ Failed to download Vault CLI. Retrying in ${RETRY_INTERVAL}s..."
                    sleep "$RETRY_INTERVAL"
                  done

                  unzip -o vault.zip >/dev/null
                  mv vault /usr/local/bin/
                  chmod +x /usr/local/bin/vault

                  echo "📌 Fetching dynamic Vault credentials for openwebui..."
                  export VAULT_ADDR=http://vault.vault.svc.cluster.local:8200
                  export VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"

                  while true; do
                    CREDS_JSON=$(vault read -format=json yugabyte-db/creds/openwebui 2>/tmp/vault_err.log || true)
                    if [ -n "$CREDS_JSON" ] && echo "$CREDS_JSON" | jq -e '.data.username and .data.password' >/dev/null; then
                      USERNAME=$(echo "$CREDS_JSON" | jq -r '.data.username')
                      PASSWORD=$(echo "$CREDS_JSON" | jq -r '.data.password')
                      echo "✅ Got credentials for user: $USERNAME"
                      break
                    fi
                    echo "⚠️ Vault credential fetch failed. Retrying in ${RETRY_INTERVAL}s..."
                    cat /tmp/vault_err.log
                    sleep "$RETRY_INTERVAL"
                  done

                  DB_URL="postgresql://${USERNAME}:${PASSWORD}@yb-tserver-service.yugabyte.svc.cluster.local:5433/openwebui"

                  echo "🔐 Creating/updating Kubernetes secret..."
                  while true; do
                    cat <<EOF | kubectl apply -f - && break
                    apiVersion: v1
                    kind: Secret
                    metadata:
                      name: openwebui-db-url
                      namespace: ollama
                    type: Opaque
                    stringData:
                      DATABASE_URL: ${DB_URL}
                    EOF
                    echo "⚠️ Failed to create secret. Retrying in ${RETRY_INTERVAL}s..."
                    sleep "$RETRY_INTERVAL"
                  done
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "256Mi"
              volumeMounts:
                - name: vault-token
                  mountPath: /vault-token
                  readOnly: true
                - name: kubectl-bin
                  mountPath: /usr/local/bin
          volumes:
            - name: vault-token
              secret:
                secretName: vault-root-token
            - name: kubectl-bin
              emptyDir: {}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: ollama
  labels:
    app: open-webui
  annotations:
    reloader.stakater.com/auto: "true"
    reloader.stakater.com/secret: "openwebui-db-url"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      serviceAccountName: openwebui
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:latest
          ports:
            - containerPort: 8080
          env:
            - name: OLLAMA_BASE_URL
              value: "http://ollama.ollama.svc.cluster.local:11434"
            - name: OLLAMA_API_TIMEOUT
              value: "300"
          envFrom:
            - secretRef:
                name: openwebui-db-url
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "3Gi"
          volumeMounts:
            - name: webui-data
              mountPath: /app/backend/data

      volumes:
        - name: webui-data
          persistentVolumeClaim:
            claimName: open-webui-data
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: ollama
spec:
  selector:
    app: open-webui
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: open-webui-route
  namespace: ollama
  annotations:
    apisix.apache.org/timeout: "900"
    apisix.apache.org/websocket: "true"
spec:
  ingressClassName: apisix
  http:
    - name: webui
      websocket: true
      match:
        hosts:
          - ai.app.suncoast.systems
        paths:
          - /*
      backends:
        - serviceName: open-webui
          servicePort: 80
