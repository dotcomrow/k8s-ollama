# PASSWORD ROTATION CRONJOB (reads Vault static-creds, writes DATABASE_URL secret)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sync-openwebui-db-secret
  namespace: ollama
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    linkerd.io/inject: disabled
spec:
  schedule: "0 0 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          annotations:
            linkerd.io/inject: disabled
        spec:
          serviceAccountName: openwebui
          restartPolicy: Never
          initContainers:
            - name: load-kubectl
              image: alpine/k8s:1.31.4
              command: ["sh","-c"]
              args: ["cp /usr/bin/kubectl /kubectl-bin/kubectl && chmod +x /kubectl-bin/kubectl"]
              volumeMounts:
                - name: kubectl-bin
                  mountPath: /kubectl-bin
          containers:
            - name: vault-sync
              image: ubuntu:22.04
              command: ["/bin/bash","-c"]
              args:
                - |
                  RETRY_INTERVAL=5
                  echo "🔧 Installing tools..."
                  while true; do
                    apt-get update && apt-get install -y curl unzip jq postgresql-client && break
                    echo "⚠️ apt-get failed. Retrying in ${RETRY_INTERVAL}s..."; sleep "$RETRY_INTERVAL"
                  done
                  echo "📌 Installing Vault CLI..."
                  while true; do
                    curl -fsSL -o vault.zip https://releases.hashicorp.com/vault/1.15.4/vault_1.15.4_linux_amd64.zip && break
                    echo "⚠️ Vault download failed. Retrying..."; sleep "$RETRY_INTERVAL"
                  done
                  unzip -o vault.zip >/dev/null && mv vault /usr/local/bin/ && chmod +x /usr/local/bin/vault

                  export VAULT_ADDR=http://vault.vault.svc.cluster.local:8200

                  if [ -f /vault-token/VAULT_TOKEN ]; then
                    VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"
                  elif [ -f /vault-token/token ]; then
                    VAULT_TOKEN="$(cat /vault-token/token)"
                  else
                    echo "❌ No Vault token file found in /vault-token"
                    ls -la /vault-token || true
                    exit 1
                  fi
                  export VAULT_TOKEN

                  while true; do
                    CREDS_JSON=$(vault read -format=json yugabyte-db/static-creds/openwebui-login 2>/tmp/vault_err.log || true)
                    if [ -n "$CREDS_JSON" ] && echo "$CREDS_JSON" | jq -e '.data.username and .data.password' >/dev/null; then
                      USERNAME=$(echo "$CREDS_JSON" | jq -r '.data.username')
                      PASSWORD=$(echo "$CREDS_JSON" | jq -r '.data.password')
                      echo "✅ Got static creds for user: $USERNAME"
                      break
                    fi
                    echo "⚠️ Static creds not available yet. Retrying..."
                    cat /tmp/vault_err.log || true
                    sleep "$RETRY_INTERVAL"
                  done

                  USERNAME_ENC=$(printf '%s' "$USERNAME" | jq -sRr @uri)
                  PASSWORD_ENC=$(printf '%s' "$PASSWORD" | jq -sRr @uri)
                  DB_URL="postgresql://${USERNAME_ENC}:${PASSWORD_ENC}@yb-tserver-service.yugabyte.svc.cluster.local:5433/openwebui?options=-csearch_path%3Dopenwebui"

                  echo "🔐 Creating/updating Kubernetes secret openwebui-db-url..."
                  cat <<EOF | kubectl apply -f -
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: openwebui-db-url
                    namespace: ollama
                  type: Opaque
                  stringData:
                    DATABASE_URL: ${DB_URL}
                  EOF

                  echo "✅ DATABASE_URL updated."

                  while true; do
                    OIDC_CLIENT_ID=$(vault kv get -field=value secret/keycloak-client-id-openwebui 2>/tmp/vault_err.log || true)
                    OIDC_CLIENT_SECRET=$(vault kv get -field=value secret/keycloak-client-secret-openwebui 2>/tmp/vault_err.log || true)
                    if [ -n "$OIDC_CLIENT_ID" ] && [ -n "$OIDC_CLIENT_SECRET" ]; then
                      echo "✅ Got Keycloak client credentials"
                      break
                    fi
                    echo "⚠️ Keycloak client credentials not available yet. Retrying..."
                    cat /tmp/vault_err.log || true
                    sleep "$RETRY_INTERVAL"
                  done

                  echo "🔐 Creating/updating Kubernetes secret openwebui-oidc-secrets..."
                  cat <<EOF | kubectl apply -f -
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: openwebui-oidc-secrets
                    namespace: ollama
                  type: Opaque
                  stringData:
                    OAUTH_CLIENT_ID: ${OIDC_CLIENT_ID}
                    OAUTH_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
                  EOF

                  echo "✅ OIDC secrets updated."

                  while true; do
                    OPENAI_API_KEY=$(vault kv get -field=value secret/open_ai_key 2>/tmp/vault_err.log || true)
                    if [ -n "$OPENAI_API_KEY" ]; then
                      echo "✅ Got OpenAI API key"
                      break
                    fi
                    echo "⚠️ OpenAI API key not available yet. Retrying..."
                    cat /tmp/vault_err.log || true
                    sleep "$RETRY_INTERVAL"
                  done

                  echo "🔐 Creating/updating Kubernetes secret openwebui-openai..."
                  cat <<EOF | kubectl apply -f -
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: openwebui-openai
                    namespace: ollama
                  type: Opaque
                  stringData:
                    OPENAI_API_KEY: ${OPENAI_API_KEY}
                  EOF

                  echo "✅ OpenAI secret updated."

              volumeMounts:
                - name: kubectl-bin
                  mountPath: /usr/local/bin
                - name: root-token
                  mountPath: /vault-token
                  readOnly: true
          volumes:
            - name: kubectl-bin
              emptyDir: {}
            - name: root-token
              secret:
                secretName: vault-root-token
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sync-openwebui-model-params
  namespace: ollama
  annotations:
    linkerd.io/inject: disabled
spec:
  schedule: "0 * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          annotations:
            linkerd.io/inject: disabled
        spec:
          serviceAccountName: openwebui
          restartPolicy: OnFailure
          containers:
            - name: sync-model-params
              image: postgres:16-alpine
              resources:
                requests:
                  cpu: "50m"
                  memory: "128Mi"
                limits:
                  cpu: "200m"
                  memory: "256Mi"
              command: ["sh","-c"]
              args:
                - |
                  set -eu

                  KEEP_ALIVE_DEFAULT="-1"
                  DEFAULT_MODEL_ID=""

                  trim() {
                    value="$1"
                    value="${value#"${value%%[![:space:]]*}"}"
                    value="${value%"${value##*[![:space:]]}"}"
                    printf '%s' "$value"
                  }

                  get_prop_value() {
                    file="$1"
                    key="$2"
                    [ -f "$file" ] || return 1
                    while IFS= read -r line || [ -n "$line" ]; do
                      case "$line" in
                        ""|\#*|\;*) continue ;;
                      esac
                      case "$line" in
                        *=*)
                          k="${line%%=*}"
                          v="${line#*=}"
                          ;;
                        *:*)
                          k="${line%%:*}"
                          v="${line#*:}"
                          ;;
                        *)
                          continue
                          ;;
                      esac
                      k="$(trim "$k")"
                      if [ "$k" = "$key" ]; then
                        v="$(trim "$v")"
                        v="${v%\"}"
                        v="${v#\"}"
                        v="${v%\'}"
                        v="${v#\'}"
                        printf '%s' "$v"
                        return 0
                      fi
                    done < "$file"
                    return 1
                  }

                  wait_for_secret_value() {
                    secret_name="$1"
                    key_name="$2"
                    namespace="${POD_NAMESPACE:-ollama}"
                    api="https://kubernetes.default.svc"
                    token_path="/var/run/secrets/kubernetes.io/serviceaccount/token"
                    ca_path="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"

                    while true; do
                      token="$(cat "$token_path")"
                      secret_json="$(curl -fsS --cacert "$ca_path" -H "Authorization: Bearer $token" \
                        "$api/api/v1/namespaces/${namespace}/secrets/${secret_name}" 2>/tmp/secret_err.log || true)"
                      if [ -n "$secret_json" ]; then
                        value_b64="$(echo "$secret_json" | jq -r --arg key "$key_name" '.data[$key] // empty')"
                        if [ -n "$value_b64" ]; then
                          printf '%s' "$value_b64" | base64 -d
                          return 0
                        fi
                      fi
                      echo "⏳ Waiting for ${secret_name}/${key_name}..." >&2
                      sleep 5
                    done
                  }

                  DEFAULT_MODEL_ID="$(get_prop_value /config/openwebui.env DEFAULT_MODELS || true)"
                  if [ -z "$DEFAULT_MODEL_ID" ]; then
                    DEFAULT_MODEL_ID="$(get_prop_value /config/openwebui.properties DEFAULT_MODELS || true)"
                  fi
                  DEFAULT_MODEL_ID="$(trim "$DEFAULT_MODEL_ID")"
                  DEFAULT_MODEL_ID="${DEFAULT_MODEL_ID%%,*}"

                  apk add --no-cache curl jq >/dev/null

                  if [ -z "${DATABASE_URL:-}" ]; then
                    echo "DATABASE_URL missing; waiting for openwebui-db-url..." >&2
                    DATABASE_URL="$(wait_for_secret_value openwebui-db-url DATABASE_URL)"
                    export DATABASE_URL
                  fi

                  ADMIN_ID="$(psql "$DATABASE_URL" -tA -c "select id from openwebui.user where email='administrator@suncoast.systems' limit 1" | tr -d '[:space:]')"
                  if [ -z "$ADMIN_ID" ]; then
                    echo "Admin user not found for administrator@suncoast.systems"
                    exit 1
                  fi

                  MODELS_JSON=""
                  for _ in 1 2 3 4 5; do
                    if MODELS_JSON="$(curl -fsS "$OLLAMA_TAGS_URL")"; then
                      break
                    fi
                    sleep 3
                  done

                  if [ -z "$MODELS_JSON" ]; then
                    echo "Failed to fetch Ollama model list"
                    exit 1
                  fi

                  echo "$MODELS_JSON" | jq -r '.models[].model' | sort -u | while read -r model_id; do
                    if [ -z "$model_id" ]; then
                      continue
                    fi
                    MODEL_ID_SQL="$(printf "%s" "$model_id" | sed "s/'/''/g")"
                    ADMIN_ID_SQL="$(printf "%s" "$ADMIN_ID" | sed "s/'/''/g")"
                    psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO openwebui.model (id, user_id, base_model_id, name, meta, params, created_at, updated_at, access_control, is_active) VALUES ('${MODEL_ID_SQL}', '${ADMIN_ID_SQL}', NULL, '${MODEL_ID_SQL}', '{}', '{\"think\": false}', EXTRACT(EPOCH FROM NOW())::bigint, EXTRACT(EPOCH FROM NOW())::bigint, NULL, true) ON CONFLICT (id) DO UPDATE SET params = CASE WHEN openwebui.model.params IS NULL OR openwebui.model.params = '' THEN '{\"think\": false}' WHEN (openwebui.model.params::jsonb ? 'think') THEN openwebui.model.params ELSE (openwebui.model.params::jsonb || '{\"think\": false}'::jsonb)::text END, updated_at = EXCLUDED.updated_at;"

                    if [ -n "$DEFAULT_MODEL_ID" ] && [ "$model_id" = "$DEFAULT_MODEL_ID" ]; then
                      KEEP_ALIVE_SQL="$(printf "%s" "$KEEP_ALIVE_DEFAULT" | sed "s/'/''/g")"
                      psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "UPDATE openwebui.model SET params = CASE WHEN openwebui.model.params IS NULL OR openwebui.model.params = '' THEN '{\"keep_alive\": \"${KEEP_ALIVE_SQL}\"}' WHEN (openwebui.model.params::jsonb ? 'keep_alive') THEN openwebui.model.params ELSE (openwebui.model.params::jsonb || '{\"keep_alive\": \"${KEEP_ALIVE_SQL}\"}'::jsonb)::text END WHERE id='${MODEL_ID_SQL}';"
                    fi
                  done
              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: openwebui-db-url
                      key: DATABASE_URL
                      optional: true
                - name: OLLAMA_TAGS_URL
                  value: "http://gravitee-gateway.k8s-api-gateway.svc.cluster.local:8082/ollama/api/tags"
              volumeMounts:
                - name: openwebui-config
                  mountPath: /config
                  readOnly: true
          volumes:
            - name: openwebui-config
              configMap:
                name: openwebui-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: ollama
  labels:
    app: open-webui
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    reloader.stakater.com/auto: "true"
    reloader.stakater.com/configmap: "openwebui-oidc-config,openwebui-config"
    reloader.stakater.com/secret: "openwebui-db-url,openwebui-oidc-secrets,openwebui-openai"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      serviceAccountName: openwebui
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:latest
          workingDir: /app/backend
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e

              trim() {
                value="$1"
                value="${value#"${value%%[![:space:]]*}"}"
                value="${value%"${value##*[![:space:]]}"}"
                printf '%s' "$value"
              }

              has_env_assignments() {
                file="$1"
                while IFS= read -r line || [ -n "$line" ]; do
                  case "$line" in
                    ""|\#*|\;*) continue ;;
                    *"="*) return 0 ;;
                  esac
                done < "$file"
                return 1
              }

              has_props_assignments() {
                file="$1"
                while IFS= read -r line || [ -n "$line" ]; do
                  case "$line" in
                    ""|\#*|\;*) continue ;;
                    *"="*|*":"*) return 0 ;;
                  esac
                done < "$file"
                return 1
              }

              CONFIG_ENV="/config/openwebui.env"
              CONFIG_PROPS="/config/openwebui.properties"

              loaded_any=0

              if [ -f "$CONFIG_ENV" ] && has_env_assignments "$CONFIG_ENV"; then
                echo "Loading OpenWebUI env config from $CONFIG_ENV"
                set -a
                . "$CONFIG_ENV"
                set +a
                loaded_any=1
              fi

              if [ -f "$CONFIG_PROPS" ] && has_props_assignments "$CONFIG_PROPS"; then
                echo "Loading OpenWebUI properties config from $CONFIG_PROPS"
                while IFS= read -r line || [ -n "$line" ]; do
                  case "$line" in
                    ""|\#*|\;*) continue ;;
                  esac
                  case "$line" in
                    *"="*)
                      key="${line%%=*}"
                      value="${line#*=}"
                      ;;
                    *":"*)
                      key="${line%%:*}"
                      value="${line#*:}"
                      ;;
                    *)
                      continue
                      ;;
                  esac
                  key="$(trim "$key")"
                  value="$(trim "$value")"
                  if [ -n "$key" ]; then
                    export "$key=$value"
                  fi
                done < "$CONFIG_PROPS"
                loaded_any=1
              fi

              if [ "$loaded_any" -eq 0 ]; then
                echo "No OpenWebUI config file found in /config; continuing with env vars"
              fi

              exec bash start.sh
          ports:
            - containerPort: 8080
          env:
            - name: ENV
              value: "dev"
            - name: OLLAMA_BASE_URL
              value: "http://gravitee-gateway.k8s-api-gateway.svc.cluster.local:8082/ollama"
            - name: OLLAMA_API_TIMEOUT
              value: "300"
            # Enable the MCP client UI in recent builds
            - name: ENABLE_MCP_CLIENT
              value: "true"
            - name: MCP_CLIENT_ENABLED
              value: "true"
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: "0"
          envFrom:
            - configMapRef:
                name: openwebui-oidc-config
            - secretRef:
                name: openwebui-db-url
            - secretRef:
                name: openwebui-oidc-secrets
            - secretRef:
                name: openwebui-openai
          volumeMounts:
            - name: openwebui-config
              mountPath: /config
              readOnly: true
            - name: webui-data
              mountPath: /app/backend/data
      volumes:
        - name: openwebui-config
          configMap:
            name: openwebui-config
        - name: webui-data
          persistentVolumeClaim:
            claimName: open-webui-data
---
apiVersion: v1
