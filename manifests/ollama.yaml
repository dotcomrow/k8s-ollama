# Create the "ollama" namespace
apiVersion: v1
kind: Namespace
metadata:
  name: ollama
  labels:
    app: ollama
  annotations:
    linkerd.io/inject: enabled
    field.cattle.io/projectId: local:applications
    scheduler.alpha.kubernetes.io/node-selector: "dedicated=work-node"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models-pvc
  namespace: ollama
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 80Gi
  storageClassName: nfs-client
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: ollama
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
  storageClassName: nfs-client
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-models
  namespace: ollama
data:
  models.txt: |
    # default: deepseek-r1:14b
    deepseek-r1:14b
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openwebui-yugabyte-config
  namespace: vault
spec:
  backoffLimit: 1
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes:
        - name: root-token
          secret:
            secretName: vault-root-token

      containers:
        - name: setup-role
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh", "-c"]
          args:
            - |
              #!/bin/sh
              set -euo pipefail

              PGHOST=yb-tserver-service.yugabyte.svc.cluster.local
              PGPORT=5433
              DB=openwebui
              ROLE=openwebui
              VAULTADMIN_USER=vaultadmin

              # Install PostgreSQL client tools
              apk add --no-cache bash curl postgresql15-client jq

              export PATH=$PATH:/vault-bin
              export VAULT_ADDR=http://vault.vault.svc.cluster.local:8200

              # --- Wait for Vault token ---
              while [ ! -f /vault-token/VAULT_TOKEN ]; do
                echo "🔁 Waiting for Vault token file..."
                sleep 2
              done
              export VAULT_TOKEN=$(cat /vault-token/VAULT_TOKEN)

              # --- Wait for DB availability ---
              until getent hosts "$PGHOST" >/dev/null; do
                echo "🔄 Waiting for DNS for $PGHOST..."
                sleep 3
              done
              until nc -z -w1 "$PGHOST" "$PGPORT"; do
                echo "⏳ Waiting for DB port $PGPORT..."
                sleep 3
              done
              echo "✅ YugabyteDB is reachable"

              # --- Fetch vaultadmin password from Vault ---
              echo "🔐 Fetching vaultadmin password from Vault..."
              while true; do
                VAULTADMIN_PASS="$(vault kv get -field=value secret/$VAULTADMIN_USER 2>/dev/null || true)"
                if [ -n "$VAULTADMIN_PASS" ]; then
                  export PGPASSWORD="$VAULTADMIN_PASS"
                  break
                fi
                echo "🔁 Waiting for secret/$VAULTADMIN_USER to become available..."
                sleep 3
              done

              # --- Ensure $DB database exists ---
              while true; do
                echo "📦 Checking if $DB exists..."
                DB_EXISTS=$(psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d yugabyte -tAc "SELECT 1 FROM pg_database WHERE datname='$DB'" 2>/dev/null || true)

                if [[ "$DB_EXISTS" == "1" ]]; then
                  echo "✅ Database $DB already exists"
                  break
                fi

                echo "📦 Creating database $DB..."
                if createdb -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -O "$VAULTADMIN_USER" "$DB" 2>/dev/null; then
                  echo "✅ Database $DB created successfully"
                  break
                else
                  echo "🔁 Waiting for Yugabyte to accept DB operations..."
                  sleep 3
                fi
              done

              # --- Ensure ROLE exists ---
              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d yugabyte <<EOSQL
              DO \$\$
              BEGIN
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '$ROLE') THEN
                  CREATE ROLE $ROLE;
                END IF;
              END
              \$\$;
              EOSQL

              # --- Create schema and grant privileges ---
              echo "📦 Creating openwebui schema owned by vaultadmin and granting access to $ROLE and vaultadmin..."
              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$DB" <<EOSQL
              CREATE SCHEMA IF NOT EXISTS openwebui AUTHORIZATION $VAULTADMIN_USER;
              ALTER SCHEMA openwebui OWNER TO $VAULTADMIN_USER;
              -- Grants for app role
              GRANT USAGE, CREATE ON SCHEMA openwebui TO $ROLE;
              GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA openwebui TO $ROLE;
              GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA openwebui TO $ROLE;
              ALTER DEFAULT PRIVILEGES IN SCHEMA openwebui GRANT ALL ON TABLES TO $ROLE;
              ALTER DEFAULT PRIVILEGES IN SCHEMA openwebui GRANT USAGE, SELECT ON SEQUENCES TO $ROLE;

              -- Grants for vaultadmin (both existing and future)
              GRANT USAGE, CREATE ON SCHEMA openwebui TO $VAULTADMIN_USER;
              GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA openwebui TO $VAULTADMIN_USER;
              GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA openwebui TO $VAULTADMIN_USER;
              ALTER DEFAULT PRIVILEGES IN SCHEMA openwebui GRANT ALL ON TABLES TO $VAULTADMIN_USER;
              ALTER DEFAULT PRIVILEGES IN SCHEMA openwebui GRANT ALL ON SEQUENCES TO $VAULTADMIN_USER;
              EOSQL

              # --- Create dynamic Vault role ---
              echo "🔐 Creating dynamic Vault role..."
              vault write yugabyte-db/roles/$ROLE \
                db_name=yugabyte \
                creation_statements="CREATE ROLE \"{{name}}\" WITH LOGIN PASSWORD '{{password}}' INHERIT IN ROLE $ROLE VALID UNTIL '{{expiration}}';" \
                default_ttl="48h" \
                max_ttl="48h"

              echo "✅ Vault role '$ROLE' created"

              # --- Create Vault policy ---
              echo "📜 Writing Vault policy '$ROLE'..."
              vault policy write "$ROLE" - <<EOF
              path "yugabyte-db/creds/$ROLE" {
                capabilities = ["read"]
              }
              EOF

              # --- Bind K8s SA to Vault role ---
              echo "🔗 Binding Kubernetes SA to Vault role..."
              vault write auth/kubernetes/role/$ROLE \
                bound_service_account_names="$ROLE" \
                bound_service_account_namespaces="ollama" \
                policies="$ROLE" \
                ttl=48h

              # --- Verify Vault credential issuance ---
              echo "🔍 Testing Vault credential issuance..."
              CREDS_JSON=$(vault read -format=json yugabyte-db/creds/$ROLE 2>/dev/null || true)
              if [ -z "$CREDS_JSON" ]; then
                echo "❌ Failed to issue dynamic credentials from Vault"
                exit 1
              fi

              DB_USER=$(echo "$CREDS_JSON" | jq -r .data.username)
              DB_PASS=$(echo "$CREDS_JSON" | jq -r .data.password)
              export PGPASSWORD="$DB_PASS"

              # --- Function to run and log SQL ---
              run_psql() {
                local SQL="$1"
                echo "🔎 Running SQL:"
                echo "$SQL"
                echo "--------------------------"
                set +e
                echo "$SQL" | psql -h "$PGHOST" -p "$PGPORT" -U "$DB_USER" -d "$DB" -v ON_ERROR_STOP=1 2>&1 | tee /tmp/psql_output.log
                STATUS=$?
                set -e
                echo "🔎 Exit status: $STATUS"
                if [ "$STATUS" -ne 0 ]; then
                  echo "❌ psql failed:"
                  cat /tmp/psql_output.log
                  exit $STATUS
                fi
              }

              # --- Validate permissions ---
              echo "🔍 Validating dynamic user permissions..."
              run_psql "SELECT current_user;"
              run_psql "SELECT has_schema_privilege(current_user, 'openwebui', 'USAGE') AS schema_usage;"
              run_psql "SET ROLE $ROLE; CREATE TABLE IF NOT EXISTS openwebui.test_perm_check (id SERIAL PRIMARY KEY); RESET ROLE;"
              run_psql "SELECT has_table_privilege(current_user, 'openwebui.test_perm_check', 'SELECT,INSERT,UPDATE,DELETE') AS table_access;"
              run_psql "SELECT has_sequence_privilege(current_user, 'openwebui.test_perm_check_id_seq', 'USAGE') AS sequence_usage;"
              run_psql "SELECT r.rolname FROM pg_roles r JOIN pg_auth_members m ON r.oid = m.roleid JOIN pg_roles u ON u.oid = m.member WHERE u.rolname = current_user;"

              echo "🎉 openwebui Vault + Yugabyte initialization complete!"

          volumeMounts:
            - name: root-token
              mountPath: /vault-token
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: copy-vault-root-token
  namespace: vault
spec:
  backoffLimit: 1
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
    spec:
      serviceAccountName: default
      restartPolicy: Never
      containers:
        - name: copy-secret
          image: alpine/k8s:1.31.4
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          command:
            - /bin/sh
            - -c
            - |
              echo "🔁 Copying 'vault-root-token' from vault → ollama..."
              kubectl get secret vault-root-token -n vault -o yaml | \
                sed 's/namespace: vault/namespace: ollama/' | \
                kubectl apply -f -
              echo "✅ Secret copied successfully."
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-creator
  namespace: ollama
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-creator-binding
  namespace: ollama
subjects:
  - kind: ServiceAccount
    name: default
    namespace: ollama
roleRef:
  kind: Role
  name: job-creator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: start-database-url-rotation-job
  namespace: ollama
spec:
  backoffLimit: 1
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
    spec:
      serviceAccountName: default
      restartPolicy: Never

      volumes:
        - name: kubectl-bin
          emptyDir: {}

      initContainers:
        - name: load-kubectl
          image: alpine/k8s:1.31.4
          command: ["sh", "-c"]
          args:
            - cp  /usr/bin/kubectl /kubectl-bin/kubectl && chmod +x /kubectl-bin/kubectl
          volumeMounts:
            - name: kubectl-bin
              mountPath: /kubectl-bin

      containers:
        - name: start-job
          image: alpine/k8s:1.31.4
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: kubectl-bin
              mountPath: /usr/local/bin

          command:
            - /bin/sh
            - -c
            - |
              echo "🔁 Triggering sync-openwebui-db-secret-now from CronJob..."
              until kubectl create job --from=cronjob/sync-openwebui-db-secret sync-openwebui-db-secret-now -n ollama; do
                echo "⏳ Waiting for CronJob to be available..."
                sleep 3
              done
              echo "✅ Job successfully created"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      runtimeClassName: nvidia

      initContainers:
        - name: wait-for-vault-role
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "🔄 Waiting for Vault role 'openwebui' to exist..."
              export VAULT_ADDR=http://vault.vault.svc.cluster.local:8200
              export VAULT_TOKEN=$(cat /vault-token/VAULT_TOKEN)

              while true; do
                if vault read auth/kubernetes/role/openwebui > /dev/null 2>&1; then
                  echo "✅ Vault role is ready."
                  exit 0
                fi
                echo "⏳ Still waiting..."
                sleep 60
              done
          volumeMounts:
            - name: vault-token
              mountPath: /vault-token
              readOnly: true

        - name: download-models
          image: ollama/ollama:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "🚀 Starting Ollama server..."
              ollama serve > /tmp/ollama.log 2>&1 &
              SERVER_PID=$!
              apt update && apt install wget -y
              # Wait for the server to start responding
              echo "⏳ Waiting for Ollama server to be ready..."
              i=1
              while true; do
                if wget --spider -q http://localhost:11434/api/tags; then
                  echo "✅ Ollama server is ready!"
                  break
                fi
                echo "⏳ Still waiting... ($i)"
                i=$((i + 1))
                sleep 1
              done

              MODEL_FILE="/opt/ollama-models/models.txt"
              echo "📄 Downloading models listed in $MODEL_FILE..."

              while IFS= read -r model; do
                if [ -n "$model" ] && [ "$(echo "$model" | cut -c1)" != "#" ]; then
                  echo "📦 Pulling model: $model"
                  ollama pull "$model"
                fi
              done < "$MODEL_FILE"

              echo "🛑 Stopping Ollama server (PID=$SERVER_PID)..."
              kill $SERVER_PID
              wait $SERVER_PID
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama/models
            - name: model-list
              mountPath: /opt/ollama-models
              readOnly: true

      containers:
        - name: ollama
          image: ollama/ollama:latest
          securityContext:
            capabilities:
              add: ["SYS_ADMIN"]
          env:
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            - name: OLLAMA_NUM_PARALLEL
              value: "2"
            - name: OLLAMA_THREADS
              value: "12"
            - name: OLLAMA_TIMEOUT
              value: "1200"
            - name: OLLAMA_GPU_MEMORY
              value: "15500"
            - name: OLLAMA_FLASH_ATTENTION
              value: "true"
            - name: OLLAMA_CONTEXT_LENGTH
              value: "8192"
            - name: OLLAMA_BATCH_SIZE
              value: "512"
          command: ["/bin/sh"]
          args:
            - -c
            - |
              echo "Resetting GPU..."
              nvidia-smi --gpu-reset -i 0 || echo "GPU reset failed or not allowed"
              apt update && apt install wget curl -y
              MODEL_FILE="/opt/ollama-models/models.txt"
              DEFAULT_MODEL=$(grep '^# default:' "$MODEL_FILE" | awk -F': ' '{print $2}' | xargs)
              echo "Default model: $DEFAULT_MODEL"
              export OLLAMA_NO_CPU_OFFLOAD=1

              (
                echo "⏳ Waiting for Ollama to be ready..."
                until wget --spider -q http://localhost:11434/api/tags; do
                  echo "Waiting..."
                  sleep 1
                done

                echo "🔥 Warming up default model: $DEFAULT_MODEL"
                # Trigger loading of default model into memory
                curl -s -X POST http://localhost:11434/api/generate \
                  -H "Content-Type: application/json" \
                  -d "{\"model\": \"$DEFAULT_MODEL\", \"prompt\": \" \", \"stream\": false}" >/dev/null

                echo "✅ Default model warmed and ready."
              ) &

              # Start Ollama server in foreground
              exec ollama serve
          ports:
            - containerPort: 11434
          resources:
            requests:
              cpu: "6000m"        # Idle baseline - allows the pod to run with minimal footprint
              memory: "8Gi"      # Enough for Ollama to start but not excessive
              nvidia.com/gpu: 1
            limits:
              cpu: "12000m"      # Full access to 8 cores when needed
              memory: "12Gi"     # Same as before - memory usage often spikes for LLM inference
              nvidia.com/gpu: 1
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama/models
            - name: model-list
              mountPath: /opt/ollama-models
              readOnly: true

        - name: keep-warm
          image: alpine:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              apk add --no-cache wget jq >/dev/null 2>&1

              while true; do
                ACTIVE_MODEL=$(wget -qO- http://localhost:11434/api/tags | jq -r '.models[0].name')
                
                if [ -n "$ACTIVE_MODEL" ] && [ "$ACTIVE_MODEL" != "null" ]; then
                  echo "🔄 Keeping model $ACTIVE_MODEL warm..."
                  wget -qO- --header="Content-Type: application/json" \
                    --post-data="{\"model\": \"$ACTIVE_MODEL\", \"prompt\": \" \", \"stream\": false}" \
                    http://localhost:11434/api/generate >/dev/null
                else
                  echo "⚠️ No active model loaded."
                fi

                sleep 120
              done
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          volumeMounts:
            - name: model-list
              mountPath: /opt/ollama-models
              readOnly: true
      restartPolicy: Always

      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: ollama-models-pvc
        - name: model-list
          configMap:
            name: ollama-models
        - name: vault-token
          secret:
            secretName: vault-root-token
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ollama
spec:
  selector:
    app: ollama
  ports:
    - name: http
      protocol: TCP
      port: 11434
      targetPort: 11434
  clusterIP: None
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openwebui
  namespace: ollama
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-writer
  namespace: ollama
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-writer-binding
  namespace: ollama
subjects:
  - kind: ServiceAccount
    name: default
    namespace: ollama
roleRef:
  kind: Role
  name: secret-writer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sync-openwebui-db-secret
  namespace: ollama
spec:
  schedule: "0 0 * * *"  # Every day
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          annotations:
            linkerd.io/inject: disabled
        spec:
          serviceAccountName: default
          restartPolicy: Never
          initContainers:
            - name: load-kubectl
              image: alpine/k8s:1.31.4
              command: ["sh", "-c"]
              args:
                - cp /usr/bin/kubectl /kubectl-bin/kubectl && chmod +x /kubectl-bin/kubectl
              volumeMounts:
                - name: kubectl-bin
                  mountPath: /kubectl-bin
          containers:
            - name: vault-sync
              image: ubuntu:22.04
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  RETRY_INTERVAL=5

                  echo "🔧 Installing tools..."
                  while true; do
                    apt-get update && apt-get install -y curl unzip jq && break
                    echo "⚠️ apt-get failed. Retrying in ${RETRY_INTERVAL}s..."
                    sleep "$RETRY_INTERVAL"
                  done

                  echo "📌 Installing Vault CLI..."
                  while true; do
                    curl -fsSL -o vault.zip https://releases.hashicorp.com/vault/1.15.4/vault_1.15.4_linux_amd64.zip && break
                    echo "⚠️ Failed to download Vault CLI. Retrying in ${RETRY_INTERVAL}s..."
                    sleep "$RETRY_INTERVAL"
                  done

                  unzip -o vault.zip >/dev/null
                  mv vault /usr/local/bin/
                  chmod +x /usr/local/bin/vault

                  echo "📌 Fetching dynamic Vault credentials for openwebui..."
                  export VAULT_ADDR=http://vault.vault.svc.cluster.local:8200
                  export VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"

                  while true; do
                    CREDS_JSON=$(vault read -format=json yugabyte-db/creds/openwebui 2>/tmp/vault_err.log || true)
                    if [ -n "$CREDS_JSON" ] && echo "$CREDS_JSON" | jq -e '.data.username and .data.password' >/dev/null; then
                      USERNAME=$(echo "$CREDS_JSON" | jq -r '.data.username')
                      PASSWORD=$(echo "$CREDS_JSON" | jq -r '.data.password')
                      echo "✅ Got credentials for user: $USERNAME"
                      break
                    fi
                    echo "⚠️ Vault credential fetch failed. Retrying in ${RETRY_INTERVAL}s..."
                    cat /tmp/vault_err.log
                    sleep "$RETRY_INTERVAL"
                  done

                  DB_URL="postgresql://${USERNAME}:${PASSWORD}@yb-tserver-service.yugabyte.svc.cluster.local:5433/openwebui?options=-csearch_path%3Dopenwebui"

                  echo "🔐 Creating/updating Kubernetes secret..."
                  cat <<EOF | kubectl apply -f - 
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: openwebui-db-url
                    namespace: ollama
                  type: Opaque
                  stringData:
                    DATABASE_URL: ${DB_URL}
                  EOF

              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "256Mi"
              volumeMounts:
                - name: vault-token
                  mountPath: /vault-token
                  readOnly: true
                - name: kubectl-bin
                  mountPath: /usr/local/bin
          volumes:
            - name: vault-token
              secret:
                secretName: vault-root-token
            - name: kubectl-bin
              emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: ollama
  labels:
    app: open-webui
  annotations:
    reloader.stakater.com/auto: "true"
    reloader.stakater.com/secret: "openwebui-db-url"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      serviceAccountName: openwebui
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:latest
          ports:
            - containerPort: 8080
          env:
            - name: OLLAMA_BASE_URL
              value: "http://ollama.ollama.svc.cluster.local:11434"
            - name: OLLAMA_API_TIMEOUT
              value: "300"
          envFrom:
            - secretRef:
                name: openwebui-db-url
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "3Gi"
          volumeMounts:
            - name: webui-data
              mountPath: /app/backend/data

      volumes:
        - name: webui-data
          persistentVolumeClaim:
            claimName: open-webui-data
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: ollama
spec:
  selector:
    app: open-webui
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: open-webui-route
  namespace: ollama
  annotations:
    apisix.apache.org/timeout: "900"
    apisix.apache.org/websocket: "true"
spec:
  ingressClassName: apisix
  http:
    - name: webui
      websocket: true
      match:
        hosts:
          - ai.app.suncoast.systems
        paths:
          - /*
      backends:
        - serviceName: open-webui
          servicePort: 80
