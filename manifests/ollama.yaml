# Create the "ollama" namespace
apiVersion: v1
kind: Namespace
metadata:
  name: ollama
  labels:
    app: ollama
  annotations:
    linkerd.io/inject: enabled
    field.cattle.io/projectId: local:applications
    scheduler.alpha.kubernetes.io/node-selector: "dedicated=work-node"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models-pvc
  namespace: ollama
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 80Gi
  storageClassName: nfs-client
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: ollama
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
  storageClassName: nfs-client
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-models
  namespace: ollama
data:
  models.txt: |
    # default: deepseek-r1:14b
    deepseek-r1:14b
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-openwebui-vault-role
  namespace: vault
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes:
        - name: root-token
          secret:
            secretName: vault-root-token
      containers:
        - name: setup-role
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh", "-c"]
          args:
            - |
              #!/bin/bash
              set -e

              echo "📌 Creating Vault policy and role for openwebui..."

              # --- Setup environment ---
              export VAULT_ADDR=http://vault.vault.svc.cluster.local:8200
              export VAULT_TOKEN=$(cat /vault-token/VAULT_TOKEN)
              PGHOST=yb-tserver-service.yugabyte.svc.cluster.local
              PGPORT=5433

              # --- Wait for YugabyteDB to be available ---
              echo "⏳ Waiting for YugabyteDB to become available at $PGHOST:$PGPORT..."
              while ! nc -z -w 1 "$PGHOST" "$PGPORT"; do
                echo "🔄 Still waiting for Yugabyte..."
                sleep 5
              done
              echo "✅ YugabyteDB is available."

              # --- Get Vault admin password ---
              echo "🔐 Fetching Vault admin password from secret/vaultadmin..."
              if ! VAULTADMIN_PASSWORD=$(vault kv get -field=value secret/vaultadmin); then
                echo "❌ Failed to retrieve Vault admin password!"
                exit 1
              fi
              echo "🔐 Vault admin password retrieved."

              # --- Reconfigure Vault DB secrets engine connection ---
              echo "⚙️ Reconfiguring Vault DB connection (path: yugabyte-db/config/yugabyte)..."
              vault delete yugabyte-db/config/yugabyte || echo "ℹ️ No previous config to delete."

              vault write yugabyte-db/config/yugabyte \
                plugin_name=postgresql-database-plugin \
                allowed_roles="openwebui" \
                connection_url="postgresql://{{username}}:{{password}}@$PGHOST:$PGPORT/yugabyte?sslmode=disable" \
                username="vaultadmin" \
                password="$VAULTADMIN_PASSWORD" || {
                  echo "❌ Failed to write DB config!"
                  exit 1
              }
              echo "✅ Vault DB config written."

              # --- Create Vault DB role ---
              echo "👤 Creating Vault DB role: openwebui"
              vault write yugabyte-db/roles/openwebui \
                db_name=yugabyte \
                creation_statements="
                  CREATE ROLE \"{{name}}\" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}';
                  GRANT ALL PRIVILEGES ON DATABASE openwebui TO \"{{name}}\";
                " \
                default_ttl=24h \
                max_ttl=24h || {
                  echo "❌ Failed to create role openwebui!"
                  exit 1
              }
              echo "✅ Vault DB role 'openwebui' created."

              # --- Write Vault policy ---
              echo "📝 Writing Vault policy for 'openwebui'..."
              cat <<EOF > /tmp/openwebui-policy.hcl
              path "yugabyte-db/creds/openwebui" {
                capabilities = ["read"]
              }
              EOF

              vault policy write openwebui /tmp/openwebui-policy.hcl || {
                echo "❌ Failed to write Vault policy!"
                exit 1
              }
              echo "✅ Vault policy 'openwebui' created."

              # --- Bind Kubernetes SA to Vault policy ---
              echo "🔗 Binding Kubernetes service account to Vault policy..."
              vault write auth/kubernetes/role/openwebui \
                bound_service_account_names=openwebui \
                bound_service_account_namespaces=ollama \
                policies=openwebui \
                ttl=24h || {
                  echo "❌ Failed to create Vault K8s role binding!"
                  exit 1
              }
              echo "✅ Vault K8s role binding complete."

              # --- Verify: Try to generate credentials via Vault (dry run) ---
              echo "🔎 Verifying Vault DB role access by requesting test credentials..."
              vault read yugabyte-db/creds/openwebui || {
                echo "❌ Failed to read creds for 'openwebui'. Check Vault logs."
                exit 1
              }
              echo "✅ Verified: Vault can generate credentials for openwebui."

          volumeMounts:
            - name: root-token
              mountPath: /vault-token
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-openwebui-db
  namespace: ollama
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      ttlSecondsAfterFinished: 300

      initContainers:
        - name: inject-vault
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh", "-c"]
          args:
            - cp /bin/vault /vault-bin/vault && chmod +x /vault-bin/vault
          volumeMounts:
            - name: vault-bin
              mountPath: /vault-bin

      containers:
        - name: create-db
          image: bitnami/postgresql:15
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              echo "🔄 Waiting for YugabyteDB to be ready..."
              export PATH=$PATH:/vault-bin
              export VAULT_ADDR=http://vault.vault.svc.cluster.local:8200
              export VAULT_TOKEN=$(cat /vault-token/VAULT_TOKEN)
              export PGPASSWORD=$(vault kv get -field=value secret/vaultadmin)
              export PGHOST=yb-tserver-service.yugabyte.svc.cluster.local
              export PGPORT=5433
              export PGUSER=vaultadmin

              i=1
              while true; do
                echo "⏳ Checking connection... ($i)"
                if psql -h $PGHOST -p $PGPORT -U $PGUSER -d yugabyte -c "SELECT 1"; then
                  break
                fi
                i=$((i + 1))
                sleep 3
              done

              echo "✅ Connected. Checking for 'openwebui' DB..."
              EXISTS=$(psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -tAc "SELECT 1 FROM pg_database WHERE datname='openwebui'")
              if [ "$EXISTS" != "1" ]; then
                echo "📦 Creating database 'openwebui'..."
                createdb -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" openwebui
                echo "✅ Created."
              else
                echo "✅ Already exists."
              fi

              echo "✅ Job complete, exiting cleanly."
              exit 0

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: vault-token
              mountPath: /vault-token
              readOnly: true
            - name: vault-bin
              mountPath: /vault-bin
      volumes:
        - name: vault-token
          secret:
            secretName: vault-root-token
        - name: vault-bin
          emptyDir: {}
      serviceAccountName: default
---
apiVersion: batch/v1
kind: Job
metadata:
  name: copy-vault-root-token
  namespace: vault
spec:
  backoffLimit: 1
  template:
    spec:
      serviceAccountName: default
      restartPolicy: Never
      containers:
        - name: copy-secret
          image: bitnami/kubectl:latest
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          command:
            - /bin/sh
            - -c
            - |
              echo "🔁 Copying 'vault-root-token' from vault → ollama..."
              kubectl get secret vault-root-token -n vault -o yaml | \
                sed 's/namespace: vault/namespace: ollama/' | \
                kubectl apply -f -
              echo "✅ Secret copied successfully."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      runtimeClassName: nvidia

      initContainers:
        - name: wait-for-vault-role
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "🔄 Waiting for Vault role 'openwebui' to exist..."
              export VAULT_ADDR=http://vault.vault.svc.cluster.local:8200
              export VAULT_TOKEN=$(cat /vault-token/VAULT_TOKEN)

              while true; do
                if vault read auth/kubernetes/role/openwebui > /dev/null 2>&1; then
                  echo "✅ Vault role is ready."
                  exit 0
                fi
                echo "⏳ Still waiting..."
                sleep 60
              done
          volumeMounts:
            - name: vault-token
              mountPath: /vault-token
              readOnly: true

        - name: download-models
          image: ollama/ollama:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "🚀 Starting Ollama server..."
              ollama serve > /tmp/ollama.log 2>&1 &
              SERVER_PID=$!
              apt update && apt install wget -y
              # Wait for the server to start responding
              echo "⏳ Waiting for Ollama server to be ready..."
              i=1
              while true; do
                if wget --spider -q http://localhost:11434/api/tags; then
                  echo "✅ Ollama server is ready!"
                  break
                fi
                echo "⏳ Still waiting... ($i)"
                i=$((i + 1))
                sleep 1
              done

              MODEL_FILE="/opt/ollama-models/models.txt"
              echo "📄 Downloading models listed in $MODEL_FILE..."

              while IFS= read -r model; do
                if [ -n "$model" ] && [ "$(echo "$model" | cut -c1)" != "#" ]; then
                  echo "📦 Pulling model: $model"
                  ollama pull "$model"
                fi
              done < "$MODEL_FILE"

              echo "🛑 Stopping Ollama server (PID=$SERVER_PID)..."
              kill $SERVER_PID
              wait $SERVER_PID
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama/models
            - name: model-list
              mountPath: /opt/ollama-models
              readOnly: true

      containers:
        - name: ollama
          image: ollama/ollama:latest
          securityContext:
            capabilities:
              add: ["SYS_ADMIN"]
          env:
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            - name: OLLAMA_NUM_PARALLEL
              value: "2"
            - name: OLLAMA_THREADS
              value: "12"
            - name: OLLAMA_TIMEOUT
              value: "1200"
            - name: OLLAMA_GPU_MEMORY
              value: "15500"
            - name: OLLAMA_FLASH_ATTENTION
              value: "true"
            - name: OLLAMA_CONTEXT_LENGTH
              value: "8192"
            - name: OLLAMA_BATCH_SIZE
              value: "512"
          command: ["/bin/sh"]
          args:
            - -c
            - |
              echo "Resetting GPU..."
              nvidia-smi --gpu-reset -i 0 || echo "GPU reset failed or not allowed"
              apt update && apt install wget curl -y
              MODEL_FILE="/opt/ollama-models/models.txt"
              DEFAULT_MODEL=$(grep '^# default:' "$MODEL_FILE" | awk -F': ' '{print $2}' | xargs)
              echo "Default model: $DEFAULT_MODEL"
              export OLLAMA_NO_CPU_OFFLOAD=1

              (
                echo "⏳ Waiting for Ollama to be ready..."
                until wget --spider -q http://localhost:11434/api/tags; do
                  echo "Waiting..."
                  sleep 1
                done

                echo "🔥 Warming up default model: $DEFAULT_MODEL"
                # Trigger loading of default model into memory
                curl -s -X POST http://localhost:11434/api/generate \
                  -H "Content-Type: application/json" \
                  -d "{\"model\": \"$DEFAULT_MODEL\", \"prompt\": \" \", \"stream\": false}" >/dev/null

                echo "✅ Default model warmed and ready."
              ) &

              # Start Ollama server in foreground
              exec ollama serve
          ports:
            - containerPort: 11434
          resources:
            requests:
              cpu: "6000m"        # Idle baseline - allows the pod to run with minimal footprint
              memory: "8Gi"      # Enough for Ollama to start but not excessive
              nvidia.com/gpu: 1
            limits:
              cpu: "12000m"      # Full access to 8 cores when needed
              memory: "12Gi"     # Same as before - memory usage often spikes for LLM inference
              nvidia.com/gpu: 1
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama/models
            - name: model-list
              mountPath: /opt/ollama-models
              readOnly: true

        - name: keep-warm
          image: alpine:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              apk add --no-cache wget jq >/dev/null 2>&1

              while true; do
                ACTIVE_MODEL=$(wget -qO- http://localhost:11434/api/tags | jq -r '.models[0].name')
                
                if [ -n "$ACTIVE_MODEL" ] && [ "$ACTIVE_MODEL" != "null" ]; then
                  echo "🔄 Keeping model $ACTIVE_MODEL warm..."
                  wget -qO- --header="Content-Type: application/json" \
                    --post-data="{\"model\": \"$ACTIVE_MODEL\", \"prompt\": \" \", \"stream\": false}" \
                    http://localhost:11434/api/generate >/dev/null
                else
                  echo "⚠️ No active model loaded."
                fi

                sleep 120
              done
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          volumeMounts:
            - name: model-list
              mountPath: /opt/ollama-models
              readOnly: true
      restartPolicy: Always

      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: ollama-models-pvc
        - name: model-list
          configMap:
            name: ollama-models
        - name: vault-token
          secret:
            secretName: vault-root-token
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ollama
spec:
  selector:
    app: ollama
  ports:
    - name: http
      protocol: TCP
      port: 11434
      targetPort: 11434
  clusterIP: None
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openwebui
  namespace: ollama
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: ollama
  labels:
    app: open-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      serviceAccountName: openwebui
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:latest
          ports:
            - containerPort: 8080
          env:
            - name: OLLAMA_BASE_URL
              value: "http://ollama.ollama.svc.cluster.local:11434"
            - name: OLLAMA_API_TIMEOUT
              value: "300"
          command: ["/bin/sh"]
          args:
            - -c
            - |
              echo "📌 Sourcing injected Vault secrets..."
              . /vault/secrets/db-env
              echo "Using DATABASE_URL=$DATABASE_URL"
              exec /app/backend/start.sh
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    echo "⏳ Waiting for Vault Agent to render secrets..."
                    i=1
                    while true; do
                      if grep -q DATABASE_URL /vault/secrets/db-env; then
                        echo "✅ Secrets ready!"
                        break
                      fi
                      echo "⏳ Still waiting... ($i)"
                      i=$((i + 1))
                      sleep 2
                    done
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "3Gi"
          volumeMounts:
            - name: webui-data
              mountPath: /app/backend/data
            - name: vault-secrets
              mountPath: /vault/secrets

        - name: vault-agent
          image: hashicorp/vault:1.14.3
          args:
            - "agent"
            - "-log-level=debug"
            - "-config=/vault/config/agent.hcl"
          env:
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: vault-config
              mountPath: /vault/config
              readOnly: true
            - name: vault-config
              mountPath: /vault/templates
              readOnly: true
            - name: vault-secrets
              mountPath: /vault/secrets

        - name: vault-reloader
          image: ghcr.io/bank-vaults/vault-secrets-webhook:v1.22.0
          args:
            - "vault-secrets-webhook"
            - "--on-secret-change=touch /vault/secrets/db-env"
            - "--log-level=debug"
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          volumeMounts:
            - name: vault-secrets
              mountPath: /vault/secrets

      volumes:
        - name: webui-data
          persistentVolumeClaim:
            claimName: open-webui-data
        - name: vault-config
          configMap:
            name: openwebui-vault-template
        - name: vault-templates
          emptyDir: {}
        - name: vault-secrets
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openwebui-vault-template
  namespace: ollama
data:
  agent.hcl: |
    vault {
      address = "http://vault.vault.svc.cluster.local:8200"
    }

    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config = {
          role = "openwebui"
        }
      }

      sink "file" {
        config = {
          path = "/vault/secrets/db-env"
        }
      }
    }

    template {
      source      = "/vault/templates/db-env.tpl"
      destination = "/vault/secrets/db-env"
    }
  db-env.tpl: |
    {{- with secret "yugabyte-db/creds/openwebui" -}}
    DATABASE_URL=postgresql://{{ .Data.username }}:{{ .Data.password }}@yb-tserver-service.yugabyte.svc.cluster.local:5433/{{ .Data.username }}
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: ollama
spec:
  selector:
    app: open-webui
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: open-webui-route
  namespace: ollama
  annotations:
    apisix.apache.org/timeout: "900"
    apisix.apache.org/websocket: "true"
spec:
  ingressClassName: apisix
  http:
    - name: webui
      websocket: true
      match:
        hosts:
          - ai.app.suncoast.systems
        paths:
          - /*
      backends:
        - serviceName: open-webui
          servicePort: 80
