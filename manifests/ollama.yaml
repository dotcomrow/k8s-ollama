# Create the "ollama" namespace
apiVersion: v1
kind: Namespace
metadata:
  name: ollama
  labels:
    app: ollama
  annotations:
    linkerd.io/inject: enabled
    field.cattle.io/projectId: local:applications
    scheduler.alpha.kubernetes.io/node-selector: "dedicated=work-node"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models-pvc
  namespace: ollama
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 80Gi
  storageClassName: nfs-client
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: ollama
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
  storageClassName: nfs-client
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-models
  namespace: ollama
data:
  models.txt: |
    # default: deepseek-r1:14b
    deepseek-r1:14b
    codellama:13b-instruct
    llama3:8b-instruct
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-openwebui-vault-role
  namespace: vault
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes:
        - name: root-token
          secret:
            secretName: vault-root-token
      containers:
        - name: setup-role
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "📌 Creating Vault policy and role for openwebui..."
              export VAULT_ADDR=http://vault.vault.svc.cluster.local:8200
              export VAULT_TOKEN=$(cat /vault-token/VAULT_TOKEN)

              PGHOST=yb-tserver-service.yugabyte.svc.cluster.local
              PGPORT=5433
              while true; do
                nc -z -w 1 "${PGHOST}" "${PGPORT}" >/dev/null 2>&1 && break
                echo "🔄 Still waiting for Yugabyte..."
                sleep 5
              done
              echo "✅ YugabyteDB is available."

              VAULTADMIN_PASSWORD=$(vault kv get -field=value secret/vaultadmin)
              echo "Using Vault admin password: $VAULTADMIN_PASSWORD"

              # ✅ Configure the DB connection with allowed_roles
              vault delete yugabyte-db/config/yugabyte
              vault write yugabyte-db/config/yugabyte \
                plugin_name=postgresql-database-plugin \
                allowed_roles="openwebui" \
                connection_url="postgresql://{{username}}:{{password}}@${PGHOST}:${PGPORT}/yugabyte?sslmode=disable" \
                username="vaultadmin" \
                password="$VAULTADMIN_PASSWORD"

              # ✅ Create the Vault DB role
              vault write yugabyte-db/roles/openwebui \
                db_name=yugabyte \
                creation_statements="CREATE ROLE \"{{name}}\" WITH LOGIN PASSWORD '{{password}}'; GRANT ALL PRIVILEGES ON DATABASE yugabyte TO \"{{name}}\";" \
                default_ttl="1h" \
                max_ttl="24h"

              # ✅ Upload Vault policy
              cat <<EOF > openwebui-policy.hcl
              path "yugabyte-db/creds/openwebui" {
                capabilities = ["read"]
              }
              EOF

              vault policy write openwebui openwebui-policy.hcl

              # ✅ Bind Kubernetes SA to the policy
              vault write auth/kubernetes/role/openwebui \
                bound_service_account_names=openwebui \
                bound_service_account_namespaces=ollama \
                policies=openwebui \
                ttl=1h

          volumeMounts:
            - name: root-token
              mountPath: /vault-token
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: copy-vault-root-token
  namespace: vault
spec:
  backoffLimit: 1
  template:
    spec:
      serviceAccountName: default
      restartPolicy: Never
      containers:
        - name: copy-secret
          image: bitnami/kubectl:latest
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          command:
            - /bin/sh
            - -c
            - |
              echo "🔁 Copying 'vault-root-token' from vault → ollama..."
              kubectl get secret vault-root-token -n vault -o yaml | \
                sed 's/namespace: vault/namespace: ollama/' | \
                kubectl apply -f -
              echo "✅ Secret copied successfully."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      runtimeClassName: nvidia

      initContainers:
        - name: wait-for-vault-role
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "🔄 Waiting for Vault role 'openwebui' to exist..."
              export VAULT_ADDR=http://vault.vault.svc.cluster.local:8200
              export VAULT_TOKEN=$(cat /vault-token/VAULT_TOKEN)

              while true; do
                if vault read auth/kubernetes/role/openwebui > /dev/null 2>&1; then
                  echo "✅ Vault role is ready."
                  exit 0
                fi
                echo "⏳ Still waiting..."
                sleep 60
              done
          volumeMounts:
            - name: vault-token
              mountPath: /vault-token
              readOnly: true

        - name: download-models
          image: ollama/ollama:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "🚀 Starting Ollama server..."
              ollama serve > /tmp/ollama.log 2>&1 &
              SERVER_PID=$!
              apt update && apt install wget -y
              # Wait for the server to start responding
              echo "⏳ Waiting for Ollama server..."
              for i in $(seq 1 30); do
                if wget --spider -q http://localhost:11434/api/tags; then
                  echo "✅ Ollama server is ready!"
                  break
                fi
                sleep 1
              done

              MODEL_FILE="/opt/ollama-models/models.txt"
              echo "📄 Downloading models listed in $MODEL_FILE..."

              while IFS= read -r model; do
                if [ -n "$model" ] && [ "$(echo "$model" | cut -c1)" != "#" ]; then
                  echo "📦 Pulling model: $model"
                  ollama pull "$model"
                fi
              done < "$MODEL_FILE"

              echo "🛑 Stopping Ollama server (PID=$SERVER_PID)..."
              kill $SERVER_PID
              wait $SERVER_PID
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama/models
            - name: model-list
              mountPath: /opt/ollama-models
              readOnly: true

      containers:
        - name: ollama
          image: ollama/ollama:latest
          securityContext:
            capabilities:
              add: ["SYS_ADMIN"]
          env:
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            - name: OLLAMA_NUM_PARALLEL
              value: "2"
            - name: OLLAMA_THREADS
              value: "12"
            - name: OLLAMA_TIMEOUT
              value: "1200"
            - name: OLLAMA_GPU_MEMORY
              value: "15500"
            - name: OLLAMA_FLASH_ATTENTION
              value: "true"
            - name: OLLAMA_CONTEXT_LENGTH
              value: "8192"
            - name: OLLAMA_BATCH_SIZE
              value: "512"
          command: ["/bin/sh"]
          args:
            - -c
            - |
              echo "Resetting GPU..."
              nvidia-smi --gpu-reset -i 0 || echo "GPU reset failed or not allowed"

              MODEL_FILE="/opt/ollama-models/models.txt"
              DEFAULT_MODEL=$(grep '^# default:' "$MODEL_FILE" | awk -F': ' '{print $2}' | xargs)
              echo "Default model: $DEFAULT_MODEL"
              export OLLAMA_NO_CPU_OFFLOAD=1

              (
                echo "⏳ Waiting for Ollama to be ready..."
                until wget --spider -q http://localhost:11434/api/tags; do
                  echo "Waiting..."
                  sleep 1
                done

                echo "🔥 Warming up default model: $DEFAULT_MODEL"
                # Trigger loading of default model into memory
                curl -s -X POST http://localhost:11434/api/generate \
                  -H "Content-Type: application/json" \
                  -d "{\"model\": \"$DEFAULT_MODEL\", \"prompt\": \" \", \"stream\": false}" >/dev/null

                echo "✅ Default model warmed and ready."
              ) &

              # Start Ollama server in foreground
              exec ollama serve
          ports:
            - containerPort: 11434
          resources:
            requests:
              cpu: "6000m"        # Idle baseline - allows the pod to run with minimal footprint
              memory: "8Gi"      # Enough for Ollama to start but not excessive
              nvidia.com/gpu: 1
            limits:
              cpu: "12000m"      # Full access to 8 cores when needed
              memory: "12Gi"     # Same as before - memory usage often spikes for LLM inference
              nvidia.com/gpu: 1
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama/models
            - name: model-list
              mountPath: /opt/ollama-models
              readOnly: true

        - name: keep-warm
          image: alpine:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              apk add --no-cache wget jq >/dev/null 2>&1

              while true; do
                ACTIVE_MODEL=$(wget -qO- http://localhost:11434/api/tags | jq -r '.models[0].name')
                
                if [ -n "$ACTIVE_MODEL" ] && [ "$ACTIVE_MODEL" != "null" ]; then
                  echo "🔄 Keeping model $ACTIVE_MODEL warm..."
                  wget -qO- --header="Content-Type: application/json" \
                    --post-data="{\"model\": \"$ACTIVE_MODEL\", \"prompt\": \" \", \"stream\": false}" \
                    http://localhost:11434/api/generate >/dev/null
                else
                  echo "⚠️ No active model loaded."
                fi

                sleep 120
              done
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          volumeMounts:
            - name: model-list
              mountPath: /opt/ollama-models
              readOnly: true
      restartPolicy: Always

      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: ollama-models-pvc
        - name: model-list
          configMap:
            name: ollama-models
        - name: vault-token
          secret:
            secretName: vault-root-token
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ollama
spec:
  selector:
    app: ollama
  ports:
    - name: http
      protocol: TCP
      port: 11434
      targetPort: 11434
  clusterIP: None
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openwebui
  namespace: ollama
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: ollama
  labels:
    app: open-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      serviceAccountName: openwebui
      initContainers:
        - name: wait-for-vault-role
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "🔄 Waiting for Vault role 'openwebui' to exist..."
              export VAULT_ADDR=http://vault.vault.svc.cluster.local:8200
              export VAULT_TOKEN=$(cat /vault-token/VAULT_TOKEN)
              while true; do
                if vault read auth/kubernetes/role/openwebui > /dev/null 2>&1; then
                  echo "✅ Vault role is ready."
                  break
                fi
                echo "⏳ Still waiting..."
                sleep 10
              done

              echo "⏳ Creating YugabyteDB credentials from Vault..."
              apk add --no-cache curl jq > /dev/null

              # ✅ Use the Kubernetes ServiceAccount JWT (not the Vault root token)
              KUBE_JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)

              # 🔐 Login using the Kubernetes Auth Method
              curl -s --request POST \
                --data '{"jwt": "'"$KUBE_JWT"'", "role": "openwebui"}' \
                $VAULT_ADDR/v1/auth/kubernetes/login > /tmp/vault-login.json

              LOGIN_TOKEN=$(jq -r .auth.client_token /tmp/vault-login.json)

              # 🔑 Retrieve database credentials
              echo "📌 Fetching YugabyteDB credentials from Vault..."
              curl -s --header "X-Vault-Token: $LOGIN_TOKEN" \
                $VAULT_ADDR/v1/yugabyte-db/creds/openwebui \
                | tee /tmp/vault-creds.json \
                | jq -r '.data | "DATABASE_URL=postgresql://\(.username):\(.password)@yb-tserver-service.yugabyte.svc.cluster.local:5433/\(.username)"' > /shared/db.env
              echo "📌 YugabyteDB credentials saved to /shared/db.env"
              cat /shared/db.env
              echo "Vault response:"
              cat /tmp/vault-creds.json
              echo "✅ YugabyteDB credentials saved to /shared/db.env"
          volumeMounts:
            - name: vault-token
              mountPath: /vault-token
              readOnly: true
            - name: shared
              mountPath: /shared

      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:latest
          ports:
            - containerPort: 8080
          env:
            - name: OLLAMA_BASE_URL
              value: "http://ollama.ollama.svc.cluster.local:11434"
            - name: OLLAMA_API_TIMEOUT
              value: "300"
          command: ["/bin/sh"]
          args:
          - -c
          - |
            echo "📌 Loading database credentials from Vault..."
            . /shared/db.env
            echo "Using DATABASE_URL=$DATABASE_URL"
            exec /app/backend/start.sh
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "3Gi"
          volumeMounts:
            - name: webui-data
              mountPath: /app/backend/data
            - name: shared
              mountPath: /shared
      volumes:
        - name: webui-data
          persistentVolumeClaim:
            claimName: open-webui-data
        - name: vault-token
          secret:
            secretName: vault-root-token
        - name: shared
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: ollama
spec:
  selector:
    app: open-webui
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: open-webui-route
  namespace: ollama
  annotations:
    apisix.apache.org/timeout: "900"
    apisix.apache.org/websocket: "true"
spec:
  ingressClassName: apisix
  http:
    - name: webui
      websocket: true
      match:
        hosts:
          - ai.app.suncoast.systems
        paths:
          - /*
      backends:
        - serviceName: open-webui
          servicePort: 80
