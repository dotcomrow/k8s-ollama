# Create the "ollama" namespace
apiVersion: v1
kind: Namespace
metadata:
  name: ollama
  labels:
    app: ollama
  annotations:
    linkerd.io/inject: enabled
    field.cattle.io/projectId: local:applications
    scheduler.alpha.kubernetes.io/node-selector: "dedicated=work-node-gpu"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models-pvc
  namespace: ollama
spec:
  accessModes: [ "ReadWriteMany" ]
  resources:
    requests:
      storage: 80Gi
  storageClassName: nfs-client
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: ollama
spec:
  accessModes: [ "ReadWriteMany" ]
  resources:
    requests:
      storage: 20Gi
  storageClassName: nfs-client
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-models
  namespace: ollama
data:
  models.txt: |
    # default: deepseek-r1:14b
    deepseek-r1:14b
---
# ONE-TIME DB + VAULT SETUP (owner + static role)
apiVersion: batch/v1
kind: Job
metadata:
  name: openwebui-yugabyte-config
  namespace: vault
spec:
  backoffLimit: 1
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes:
        - name: root-token
          secret:
            secretName: vault-root-token
      containers:
        - name: setup-owner-and-static-rotation
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh", "-c"]
          args:
            - |
              #!/bin/sh
              # No 'set -euo pipefail' per preference
              PGHOST=yb-tserver-service.yugabyte.svc.cluster.local
              PGPORT=5433
              DB=openwebui
              OWNER_LOGIN=openwebui_login
              VAULTADMIN_USER=vaultadmin

              echo "🔧 Installing clients..."
              apk add --no-cache bash curl postgresql15-client jq >/dev/null

              export VAULT_ADDR=http://vault.vault.svc.cluster.local:8200

              echo "🔑 Waiting for Vault token..."
              while [ ! -f /vault-token/VAULT_TOKEN ]; do
                sleep 2
              done
              export VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"

              echo "🔎 Wait for DB endpoint..."
              until getent hosts "$PGHOST" >/dev/null; do sleep 3; done
              until nc -z -w1 "$PGHOST" "$PGPORT"; do sleep 3; done
              echo "✅ Yugabyte reachable"

              echo "🔐 Fetching vaultadmin password..."
              while :; do
                VAULTADMIN_PASS="$(vault kv get -field=value secret/$VAULTADMIN_USER 2>/dev/null || true)"
                [ -n "$VAULTADMIN_PASS" ] && break
                echo "⏳ Waiting for secret/$VAULTADMIN_USER ..."
                sleep 3
              done
              export PGPASSWORD="$VAULTADMIN_PASS"

              # Ensure database exists (owned by vaultadmin for now)
              while :; do
                DB_EXISTS=$(psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d yugabyte -tAc "SELECT 1 FROM pg_database WHERE datname='$DB'" 2>/dev/null || true)
                if [ "$DB_EXISTS" = "1" ]; then
                  echo "✅ Database $DB exists"
                  break
                fi
                echo "📦 Creating database $DB..."
                if createdb -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -O "$VAULTADMIN_USER" "$DB" 2>/dev/null; then
                  echo "✅ Created $DB"
                  break
                fi
                echo "⏳ Retry create DB..."
                sleep 3
              done

              # Create stable owner login if missing
              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d yugabyte <<EOSQL
              DO \$\$
              BEGIN
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '$OWNER_LOGIN') THEN
                  CREATE ROLE $OWNER_LOGIN LOGIN;
                END IF;
              END
              \$\$;
              EOSQL

              # Create stable owner login if missing
              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d yugabyte <<EOSQL
              DO \$\$
              BEGIN
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '$OWNER_LOGIN') THEN
                  CREATE ROLE $OWNER_LOGIN LOGIN;
                END IF;
              END
              \$\$;
              -- allow vaultadmin to set OWNER to $OWNER_LOGIN
              GRANT $OWNER_LOGIN TO $VAULTADMIN_USER;
              EOSQL

              # Ensure schema exists, reassign all objects to OWNER_LOGIN
              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$DB" <<EOSQL
              -- ensure schema
              CREATE SCHEMA IF NOT EXISTS openwebui;
              ALTER SCHEMA openwebui OWNER TO openwebui_login;

              -- reassign all existing tables
              DO \$\$
              DECLARE r RECORD;
              BEGIN
                FOR r IN
                  SELECT format('%I.%I', schemaname, tablename) AS obj
                  FROM pg_tables WHERE schemaname='openwebui'
                LOOP
                  EXECUTE format('ALTER TABLE %s OWNER TO openwebui_login', r.obj);
                END LOOP;

                -- sequences
                FOR r IN
                  SELECT format('%I.%I', sequence_schema, sequence_name) AS obj
                  FROM information_schema.sequences WHERE sequence_schema='openwebui'
                LOOP
                  EXECUTE format('ALTER SEQUENCE %s OWNER TO openwebui_login', r.obj);
                END LOOP;

                -- views
                FOR r IN
                  SELECT format('%I.%I', table_schema, table_name) AS obj
                  FROM information_schema.views WHERE table_schema='openwebui'
                LOOP
                  EXECUTE format('ALTER VIEW %s OWNER TO openwebui_login', r.obj);
                END LOOP;
              END\$\$;
              EOSQL

              echo "✅ Schema & object ownership set to $OWNER_LOGIN"

              # Create Vault static role for password rotation of fixed login
              echo "🔐 Configuring Vault static role for $OWNER_LOGIN ..."
              cat <<'JSON' | vault write yugabyte-db/static-roles/openwebui-login - 
              {
                "db_name": "yugabyte",
                "username": "openwebui_login",
                "rotation_statements": [
                  "ALTER ROLE \"{{username}}\" WITH PASSWORD '{{password}}'"
                ],
                "rotation_period": "720h"
              }
              JSON

              echo "📜 Writing policy to read static creds..."
              vault policy write openwebui-login - <<EOF
              path "yugabyte-db/static-creds/openwebui-login" {
                capabilities = ["read"]
              }
              EOF

              echo "🔗 Binding K8s SA 'openwebui' in ns 'ollama' ..."
              vault write auth/kubernetes/role/openwebui-login \
                bound_service_account_names="openwebui" \
                bound_service_account_namespaces="ollama" \
                policies="openwebui-login" \
                ttl="48h"

              echo "🧪 Verifying static creds issuance..."
              if CREDS_JSON="$(vault read -format=json yugabyte-db/static-creds/openwebui-login 2>/tmp/vault_err.log)"; then
                echo "$CREDS_JSON" | jq -e '.data.username and .data.password' >/dev/null \
                  && echo "✅ Static creds OK" \
                  || { echo "❌ Missing fields"; echo "$CREDS_JSON"; exit 1; }
              else
                echo "❌ Failed to read static creds"; cat /tmp/vault_err.log; exit 1
              fi
          volumeMounts:
            - name: root-token
              mountPath: /vault-token
              readOnly: true
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: copy-ollama-vault-root-token
  namespace: vault
spec:
  backoffLimit: 1
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
    spec:
      serviceAccountName: default
      restartPolicy: Never
      containers:
        - name: copy-secret
          image: alpine/k8s:1.31.4
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
          command: ["/bin/sh","-c"]
          args:
            - |
              echo "🔁 Copying 'vault-root-token' from vault → ollama..."
              kubectl get secret vault-root-token -n vault -o yaml | \
                sed 's/namespace: vault/namespace: ollama/' | \
                kubectl apply -f -
              echo "✅ Secret copied."
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-creator
  namespace: ollama
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-creator-binding
  namespace: ollama
subjects:
  - kind: ServiceAccount
    name: default
    namespace: ollama
roleRef:
  kind: Role
  name: job-creator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: start-database-url-rotation-job
  namespace: ollama
spec:
  backoffLimit: 1
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
    spec:
      serviceAccountName: default
      restartPolicy: Never
      volumes:
        - name: kubectl-bin
          emptyDir: {}
      initContainers:
        - name: load-kubectl
          image: alpine/k8s:1.31.4
          command: ["sh","-c"]
          args: ["cp /usr/bin/kubectl /kubectl-bin/kubectl && chmod +x /kubectl-bin/kubectl"]
          volumeMounts:
            - name: kubectl-bin
              mountPath: /kubectl-bin
      containers:
        - name: start-job
          image: alpine/k8s:1.31.4
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
          volumeMounts:
            - name: kubectl-bin
              mountPath: /usr/local/bin
          command: ["/bin/sh","-c"]
          args:
            - |
              echo "🔁 Triggering sync-openwebui-db-secret-now from CronJob..."
              until kubectl create job --from=cronjob/sync-openwebui-db-secret sync-openwebui-db-secret-now -n ollama; do
                echo "⏳ Waiting for CronJob..."
                sleep 3
              done
              echo "✅ Job created"
---
# OLLAMA (unchanged functionally)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
      annotations:
        config.linkerd.io/proxy-cpu-request: "1"
        config.linkerd.io/proxy-cpu-limit: "1"
        config.linkerd.io/proxy-memory-request: "128Mi"
        config.linkerd.io/proxy-memory-limit: "128Mi"
    spec:
      runtimeClassName: nvidia
      initContainers:
        - name: download-models
          image: ollama/ollama:latest
          command: ["/bin/sh","-c"]
          args:
            - |
              echo "🚀 Starting Ollama server..."
              ollama serve > /tmp/ollama.log 2>&1 &
              SERVER_PID=$!
              apt update && apt install wget -y
              echo "⏳ Waiting for Ollama server..."
              i=1; while true; do
                if wget --spider -q http://localhost:11434/api/tags; then
                  echo "✅ Ready"; break; fi
                echo "⏳ Still waiting... ($i)"; i=$((i+1)); sleep 1
              done
              MODEL_FILE="/opt/ollama-models/models.txt"
              echo "📄 Downloading models listed in $MODEL_FILE..."
              while IFS= read -r model; do
                [ -n "$model" ] && [ "$(echo "$model" | cut -c1)" != "#" ] && \
                  echo "📦 Pulling model: $model" && ollama pull "$model"
              done < "$MODEL_FILE"
              echo "🛑 Stopping Ollama server (PID=$SERVER_PID)..."
              kill $SERVER_PID; wait $SERVER_PID
          resources:
            requests:
              cpu: "1"
              memory: "4Gi"
            limits:
              cpu: "1"
              memory: "4Gi"
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama/models
            - name: model-list
              mountPath: /opt/ollama-models
              readOnly: true
      containers:
        - name: ollama
          image: ollama/ollama:latest
          securityContext:
            capabilities: { add: ["SYS_ADMIN"] }
          env:
            - { name: OLLAMA_MAX_LOADED_MODELS, value: "1" }
            - { name: OLLAMA_NUM_PARALLEL,    value: "2" }
            - { name: OLLAMA_THREADS,         value: "8" }
            - { name: OLLAMA_TIMEOUT,         value: "1200" }
            - { name: OLLAMA_GPU_MEMORY,      value: "15500" }
            - { name: OLLAMA_FLASH_ATTENTION, value: "true" }
            - { name: OLLAMA_CONTEXT_LENGTH,  value: "8192" }
            - { name: OLLAMA_BATCH_SIZE,      value: "512" }
          command: ["/bin/sh","-c"]
          args:
            - |
              echo "Resetting GPU..."
              apt install wget -y
              nvidia-smi --gpu-reset -i 0 || echo "GPU reset failed or not allowed"
              apt update && apt install wget curl -y
              MODEL_FILE="/opt/ollama-models/models.txt"
              DEFAULT_MODEL=$(grep '^# default:' "$MODEL_FILE" | awk -F': ' '{print $2}' | xargs)
              echo "Default model: $DEFAULT_MODEL"
              export OLLAMA_NO_CPU_OFFLOAD=1
              (
                echo "⏳ Waiting for Ollama to be ready..."
                until wget --spider -q http://localhost:11434/api/tags; do echo "Waiting..."; sleep 1; done
                echo "🔥 Warming up default model: $DEFAULT_MODEL"
                curl -s -X POST http://localhost:11434/api/generate \
                  -H "Content-Type: application/json" \
                  -d "{\"model\": \"$DEFAULT_MODEL\", \"prompt\": \" \", \"stream\": false}" >/dev/null
                echo "✅ Default model warmed."
              ) &
              exec ollama serve
          ports:
            - containerPort: 11434
          resources:
            requests:
              cpu: "8"
              memory: "12Gi"
              nvidia.com/gpu: 1
            limits:
              cpu: "8"
              memory: "12Gi"
              nvidia.com/gpu: 1
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama/models
            - name: model-list
              mountPath: /opt/ollama-models
              readOnly: true
        - name: keep-warm
          image: alpine:latest
          command: ["/bin/sh","-c"]
          args:
            - |
              apk add --no-cache wget jq >/dev/null 2>&1
              while true; do
                ACTIVE_MODEL=$(wget -qO- http://localhost:11434/api/tags | jq -r '.models[0].name')
                if [ -n "$ACTIVE_MODEL" ] && [ "$ACTIVE_MODEL" != "null" ]; then
                  echo "🔄 Keeping model $ACTIVE_MODEL warm..."
                  wget -qO- --header="Content-Type: application/json" \
                    --post-data="{\"model\": \"$ACTIVE_MODEL\", \"prompt\": \" \", \"stream\": false}" \
                    http://localhost:11434/api/generate >/dev/null
                else
                  echo "⚠️ No active model loaded."
                fi
                sleep 120
              done
          resources:
            requests: { cpu: "1", memory: "64Mi" }
            limits:   { cpu: "1", memory: "64Mi" }
          volumeMounts:
            - name: model-list
              mountPath: /opt/ollama-models
              readOnly: true
      restartPolicy: Always
      volumes:
        - name: ollama-data
          persistentVolumeClaim: { claimName: ollama-models-pvc }
        - name: model-list
          configMap: { name: ollama-models }
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ollama
  annotations:
    # Gravitee discovery
    gravitee.io/expose: "true"
    gravitee.io/context-path: "/ollama"
    gravitee.io/auth-required: "ollama-token"
    gravitee.io/approval-required: "admin"

    # Definition metadata (string)
    gravitee.io/description: "Ollama HTTP API"
    gravitee.io/version: "latest"
    gravitee.io/tags: "ollama,ai,llm"
    gravitee.io/definition-name: "ollama-api"
    gravitee.io/definition-summary: "Ollama HTTP API"
    gravitee.io/definition-description: "Ollama model serving API"
    gravitee.io/definition-version: "latest"
    gravitee.io/definition-type: "HTTP"
    gravitee.io/definition-context-path: "/ollama"
    gravitee.io/definition-visibility: "PUBLIC"
    gravitee.io/definition-state: "STARTED"
    gravitee.io/definition-lifecycle-state: "PUBLISHED"

    # Listener hints
    gravitee.io/definition-listener-host: "ollama.ollama.svc.cluster.local"
    gravitee.io/definition-listener-port: "11434"

    # Definition list fields (comma-separated)
    gravitee.io/definition-groups: "ai,ml"
    gravitee.io/definition-tags: "ollama,llm,ai"
    gravitee.io/definition-labels: "internal,ai"
    gravitee.io/definition-categories: "ai,ml"
    gravitee.io/definition-path-mappings: "/ollama/*"

    # Definition JSON fields (raw JSON strings)
    gravitee.io/definition-metadata: '{"owner":"ai","slack":"#ai"}'
    gravitee.io/definition-properties: '{"tier":"prod","region":"us-central1"}'
    gravitee.io/definition-services: '{"healthCheck":{"enabled":true,"schedule":"*/30 * * * * *"}}'
    gravitee.io/definition-resources: '[]'
    gravitee.io/definition-endpoint-groups: '[{"name":"default","type":"http-proxy","http":{"connectTimeout":30000,"readTimeout":300000,"idleTimeout":300000,"keepAlive":true},"endpoints":[{"name":"ollama-http","type":"http-proxy","inheritConfiguration":false,"weight":1,"configuration":{"target":"http://ollama.ollama.svc.cluster.local:11434"},"secondary":false}]}]'
    gravitee.io/definition-plans: '{"open-access":{"name":"Open access","description":"No auth","security":{"type":"KEY_LESS"},"status":"PUBLISHED","validation":"AUTO","type":"API"}}'
    gravitee.io/definition-flows: '[]'
    gravitee.io/definition-response-templates: '{}'
    gravitee.io/definition-analytics: '{"enabled":true,"sampling":{"type":"PERCENT","value":"100"},"logging":{"condition":"#response.status >= 400","content":{"headers":true,"payload":true,"messageHeaders":false,"messageMetadata":false,"messagePayload":false},"mode":{"entrypoint":true,"endpoint":true},"phase":{"request":true,"response":true}}}'

    # Optional overrides (leave empty to let sync controller generate)
    gravitee.io/definition-entrypoints: '[]'
spec:
  selector:
    app: ollama
  ports:
    - name: http
      protocol: TCP
      port: 11434
      targetPort: 11434
  clusterIP: None
---
# OpenWebUI RBAC for pulling static creds into a K8s Secret
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openwebui
  namespace: ollama
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-writer
  namespace: ollama
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-writer-binding
  namespace: ollama
subjects:
  - kind: ServiceAccount
    name: openwebui
    namespace: ollama
roleRef:
  kind: Role
  name: secret-writer
  apiGroup: rbac.authorization.k8s.io
---
# PASSWORD ROTATION CRONJOB (reads Vault static-creds, writes DATABASE_URL secret)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sync-openwebui-db-secret
  namespace: ollama
spec:
  schedule: "0 0 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          annotations:
            linkerd.io/inject: disabled
        spec:
          serviceAccountName: openwebui
          restartPolicy: Never
          initContainers:
            - name: load-kubectl
              image: alpine/k8s:1.31.4
              command: ["sh","-c"]
              args: ["cp /usr/bin/kubectl /kubectl-bin/kubectl && chmod +x /kubectl-bin/kubectl"]
              volumeMounts:
                - name: kubectl-bin
                  mountPath: /kubectl-bin
          containers:
            - name: vault-sync
              image: ubuntu:22.04
              command: ["/bin/bash","-c"]
              args:
                - |
                  RETRY_INTERVAL=5
                  echo "🔧 Installing tools..."
                  while true; do
                    apt-get update && apt-get install -y curl unzip jq postgresql-client && break
                    echo "⚠️ apt-get failed. Retrying in ${RETRY_INTERVAL}s..."; sleep "$RETRY_INTERVAL"
                  done
                  echo "📌 Installing Vault CLI..."
                  while true; do
                    curl -fsSL -o vault.zip https://releases.hashicorp.com/vault/1.15.4/vault_1.15.4_linux_amd64.zip && break
                    echo "⚠️ Vault download failed. Retrying..."; sleep "$RETRY_INTERVAL"
                  done
                  unzip -o vault.zip >/dev/null && mv vault /usr/local/bin/ && chmod +x /usr/local/bin/vault

                  export VAULT_ADDR=http://vault.vault.svc.cluster.local:8200
                  VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"
                  export VAULT_TOKEN

                  while true; do
                    CREDS_JSON=$(vault read -format=json yugabyte-db/static-creds/openwebui-login 2>/tmp/vault_err.log || true)
                    if [ -n "$CREDS_JSON" ] && echo "$CREDS_JSON" | jq -e '.data.username and .data.password' >/dev/null; then
                      USERNAME=$(echo "$CREDS_JSON" | jq -r '.data.username')
                      PASSWORD=$(echo "$CREDS_JSON" | jq -r '.data.password')
                      echo "✅ Got static creds for user: $USERNAME"
                      break
                    fi
                    echo "⚠️ Static creds not available yet. Retrying..."
                    cat /tmp/vault_err.log
                    sleep "$RETRY_INTERVAL"
                  done

                  DB_URL="postgresql://${USERNAME}:${PASSWORD}@yb-tserver-service.yugabyte.svc.cluster.local:5433/openwebui?options=-csearch_path%3Dopenwebui"

                  echo "🔐 Creating/updating Kubernetes secret..."
                  cat <<EOF | kubectl apply -f -
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: openwebui-db-url
                    namespace: ollama
                  type: Opaque
                  stringData:
                    DATABASE_URL: ${DB_URL}
                  EOF

                  echo "✅ DATABASE_URL updated."
              resources:
                requests: { cpu: "50m", memory: "64Mi" }
                limits:   { cpu: "200m", memory: "256Mi" }
              volumeMounts:
                - name: kubectl-bin
                  mountPath: /usr/local/bin
                - name: root-token
                  mountPath: /vault-token
                  readOnly: true
          volumes:
            - name: kubectl-bin
              emptyDir: {}
            - name: root-token
              secret:
                secretName: vault-root-token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: ollama
  labels:
    app: open-webui
  annotations:
    reloader.stakater.com/auto: "true"
    reloader.stakater.com/secret: "openwebui-db-url"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
      annotations:
        linkerd.io/inject: disabled
    spec:
      serviceAccountName: openwebui
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:latest
          ports:
            - containerPort: 8080
          env:
            - name: OLLAMA_BASE_URL
              value: "http://gravitee-gateway.k8s-api-gateway.svc.cluster.local:8082/ollama"
            - name: OLLAMA_API_TIMEOUT
              value: "300"
            # Enable the MCP client UI in recent builds
            - name: ENABLE_MCP_CLIENT
              value: "true"
            - name: MCP_CLIENT_ENABLED
              value: "true"
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: "0"    
          envFrom:
            - secretRef:
                name: openwebui-db-url
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits:   { cpu: "2000m", memory: "3Gi" }
          volumeMounts:
            - name: webui-data
              mountPath: /app/backend/data
      volumes:
        - name: webui-data
          persistentVolumeClaim:
            claimName: open-webui-data
