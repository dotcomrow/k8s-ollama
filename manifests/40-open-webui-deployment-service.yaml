apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: ollama
  labels:
    app: open-webui
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    reloader.stakater.com/auto: "true"
    reloader.stakater.com/configmap: "openwebui-oidc-config,openwebui-config,openwebui-sitecustomize"
    reloader.stakater.com/secret: "openwebui-db-url,openwebui-oidc-secrets,openwebui-openai"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
      annotations:
        # Bump pod template to force a rollout when needed (and trigger ArgoCD sync hooks).
        platform.suncoast.systems/redeploy-at: "2026-02-07T14:55:00Z"
    spec:
      serviceAccountName: openwebui
      initContainers:
        - name: openwebui-db-autoheal
          image: ghcr.io/open-webui/open-webui:latest
          imagePullPolicy: IfNotPresent
          workingDir: /app/backend
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail

              python - <<'PY'
              import os
              import re
              import secrets
              import sys
              import traceback
              import time
              from pathlib import Path
              from urllib.parse import unquote, urlparse

              def env_bool(name: str, default: bool) -> bool:
                  value = os.environ.get(name)
                  if value is None:
                      return default
                  return value.strip().lower() in {"1", "true", "yes", "y", "on"}

              AUTOHEAL = env_bool("OPENWEBUI_DB_AUTOHEAL", True)
              RESET_ON_FAILURE = env_bool("OPENWEBUI_DB_RESET_ON_MIGRATION_FAILURE", True)
              RESET_SCHEMA = os.environ.get("OPENWEBUI_DB_RESET_SCHEMA", "openwebui")

              # The container image sets WEBUI_SECRET_KEY="" by default. Open WebUI treats that as a missing required
              # env var when WEBUI_AUTH=true. The main container's start.sh generates a key file; this initContainer
              # does not run start.sh, so we synthesize a key when missing to unblock imports/migrations.
              if os.environ.get("WEBUI_SECRET_KEY", "").strip() == "":
                  if os.environ.get("WEBUI_JWT_SECRET_KEY", "").strip() == "":
                      os.environ["WEBUI_SECRET_KEY"] = secrets.token_urlsafe(32)

              # Avoid side effects from Open WebUI imports (it runs migrations on import in some modules).
              # We run migrations explicitly and fail fast on errors.
              os.environ["ENABLE_DB_MIGRATIONS"] = "false"

              def resolve_database_url() -> str:
                  # Let Open WebUI compute its default (sqlite:///.../webui.db) when DATABASE_URL isn't set.
                  from open_webui.env import DATABASE_URL as DEFAULT_DATABASE_URL  # type: ignore

                  return os.environ.get("DATABASE_URL") or DEFAULT_DATABASE_URL

              def run_migrations(database_url: str) -> None:
                  # Primary schema migrations only for current image versions.
                  from alembic import command  # type: ignore
                  from alembic.config import Config  # type: ignore
                  from open_webui.env import OPEN_WEBUI_DIR  # type: ignore

                  alembic_cfg = Config(OPEN_WEBUI_DIR / "alembic.ini")
                  alembic_cfg.set_main_option("script_location", str(OPEN_WEBUI_DIR / "migrations"))
                  command.upgrade(alembic_cfg, "head")

              def is_retryable_db_error(exc: Exception) -> bool:
                  message = str(exc).lower()
                  if "could not serialize access due to concurrent update" in message:
                      return True
                  if "catalog version mismatch" in message:
                      return True

                  orig = getattr(exc, "orig", None)
                  if getattr(orig, "pgcode", None) == "40001":
                      return True
                  return False

              def run_migrations_with_lock(database_url: str) -> None:
                  max_retries = int(os.environ.get("OPENWEBUI_DB_MIGRATION_MAX_RETRIES", "8"))
                  default_backoff_seconds = float(os.environ.get("OPENWEBUI_DB_MIGRATION_BACKOFF_SECONDS", "0.75"))

                  parsed = urlparse(database_url)
                  scheme = (parsed.scheme or "").lower()
                  if not scheme.startswith("postgresql"):
                      run_migrations(database_url)
                      return

                  from sqlalchemy import create_engine, text  # type: ignore

                  engine = create_engine(database_url, pool_pre_ping=True)
                  lock_conn = engine.connect()
                  try:
                      # Hold a process-level advisory lock so only one pod mutates schema at once.
                      lock_conn.execute(text("SELECT pg_advisory_lock(:lock_id)"), {"lock_id": 2026061710})
                      for attempt in range(1, max_retries + 1):
                          try:
                              run_migrations(database_url)
                              return
                          except Exception as exc:
                              if not is_retryable_db_error(exc) or attempt >= max_retries:
                                  raise
                              delay = min(5.0, default_backoff_seconds * (2 ** (attempt - 1)))
                              print(
                                  f"Migration conflict detected, retrying ({attempt}/{max_retries}) after {delay:.1f}s"
                              )
                              print(exc, file=sys.stderr)
                              time.sleep(delay)
                  finally:
                      lock_conn.close()
                      engine.dispose()

              def reset_sqlite(database_url: str) -> None:
                  from open_webui.env import DATA_DIR  # type: ignore

                  parsed = urlparse(database_url)
                  # For sqlite:////abs/path.db => parsed.path == '//abs/path.db'
                  db_path = unquote(parsed.path or "")
                  if db_path.startswith("//"):
                      db_path = db_path[1:]
                  if not db_path:
                      db_path = str(Path(DATA_DIR) / "webui.db")

                  base = Path(db_path)
                  for path in (
                      base,
                      Path(str(base) + "-wal"),
                      Path(str(base) + "-shm"),
                      Path(str(base) + "-journal"),
                  ):
                      try:
                          if path.exists():
                              path.unlink()
                              print(f"Deleted sqlite file: {path}")
                      except Exception as exc:
                          raise RuntimeError(f"Failed deleting sqlite file {path}: {exc}") from exc

              def quote_ident(value: str) -> str:
                  return '"' + value.replace('"', '""') + '"'

              def reset_postgres_schema(database_url: str, schema: str, *, best_effort: bool = False) -> None:
                  if not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*", schema or ""):
                      raise ValueError(f"Refusing to reset schema with unsafe name: {schema!r}")

                  from sqlalchemy import create_engine, text  # type: ignore

                  engine = create_engine(database_url, pool_pre_ping=True)
                  try:
                      with engine.begin() as conn:
                          exists = conn.execute(
                              text(
                                  "SELECT 1 FROM information_schema.schemata WHERE schema_name = :schema"
                              ),
                              {"schema": schema},
                          ).scalar()
                          if exists != 1:
                              print(f"Schema does not exist; skipping: {schema}")
                              return

                          def drop(stmt: str) -> None:
                              try:
                                  conn.execute(text(stmt))
                              except Exception as exc:
                                  if best_effort:
                                      print(f"WARN: failed to execute: {stmt}: {exc!r}")
                                      return
                                  raise

                          # Drop views first to avoid dependency surprises.
                          views = (
                              conn.execute(
                                  text(
                                      "SELECT table_name FROM information_schema.views WHERE table_schema = :schema"
                                  ),
                                  {"schema": schema},
                              )
                              .scalars()
                              .all()
                          )
                          for view in views:
                              drop(
                                  f"DROP VIEW IF EXISTS {quote_ident(schema)}.{quote_ident(view)} CASCADE"
                              )

                          tables = (
                              conn.execute(
                                  text(
                                      "SELECT table_name FROM information_schema.tables "
                                      "WHERE table_schema = :schema AND table_type = 'BASE TABLE'"
                                  ),
                                  {"schema": schema},
                              )
                              .scalars()
                              .all()
                          )
                          for table in tables:
                              drop(
                                  f"DROP TABLE IF EXISTS {quote_ident(schema)}.{quote_ident(table)} CASCADE"
                              )

                          # Some sequences can remain even after dropping tables (non-owned sequences).
                          sequences = (
                              conn.execute(
                                  text(
                                      "SELECT sequence_name FROM information_schema.sequences WHERE sequence_schema = :schema"
                                  ),
                                  {"schema": schema},
                              )
                              .scalars()
                              .all()
                          )
                          for seq in sequences:
                              drop(
                                  f"DROP SEQUENCE IF EXISTS {quote_ident(schema)}.{quote_ident(seq)} CASCADE"
                              )
                      print(
                          f"Reset Postgres schema contents: {schema} (best_effort={best_effort})"
                      )
                  finally:
                      engine.dispose()

              def reset_database(database_url: str) -> None:
                  scheme = (urlparse(database_url).scheme or "").lower()
                  if scheme.startswith("sqlite"):
                      reset_sqlite(database_url)
                      return
                  if scheme in {"postgresql", "postgres"}:
                      schemas = []
                      if RESET_SCHEMA:
                          schemas.append(RESET_SCHEMA)
                      extra = os.environ.get("OPENWEBUI_DB_RESET_EXTRA_SCHEMAS", "public").strip()
                      if extra:
                          for raw in extra.split(","):
                              value = raw.strip()
                              if value:
                                  schemas.append(value)

                      seen = set()
                      primary_schema = RESET_SCHEMA
                      for schema in schemas:
                          if schema in seen:
                              continue
                          seen.add(schema)
                          reset_postgres_schema(
                              database_url,
                              schema,
                              best_effort=(schema != primary_schema),
                          )
                      return
                  raise ValueError(f"Unsupported DATABASE_URL scheme for auto-heal reset: {scheme!r}")

              database_url = resolve_database_url()
              scheme = (urlparse(database_url).scheme or "").lower()
              print(f"Open WebUI DB auto-heal init starting (scheme={scheme}, autoheal={AUTOHEAL})")

              try:
                  run_migrations_with_lock(database_url)
                  print("DB migrations succeeded.")
              except Exception as exc:
                  print(f"DB migrations failed: {exc!r}", file=sys.stderr)
                  traceback.print_exc()

                  if not (AUTOHEAL and RESET_ON_FAILURE):
                      sys.exit(1)

                  print("Attempting DB reset (data loss) and re-migrate...")
                  try:
                      reset_database(database_url)
                      run_migrations_with_lock(database_url)
                      print("DB reset + migrations succeeded.")
                  except Exception as exc2:
                      print(f"DB reset attempt failed: {exc2!r}", file=sys.stderr)
                      traceback.print_exc()
                      sys.exit(1)
              PY
          env:
            - name: OPENWEBUI_DB_AUTOHEAL
              value: "true"
            - name: OPENWEBUI_DB_RESET_ON_MIGRATION_FAILURE
              value: "false"
            - name: OPENWEBUI_DB_RESET_SCHEMA
              value: "openwebui"
            - name: OPENWEBUI_DB_RESET_EXTRA_SCHEMAS
              value: "public"
          envFrom:
            - configMapRef:
                name: openwebui-oidc-config
            - secretRef:
                name: openwebui-db-url
            - secretRef:
                name: openwebui-oidc-secrets
            - secretRef:
                name: openwebui-openai
          volumeMounts:
            - name: webui-data
              mountPath: /app/backend/data
            - name: openwebui-sitecustomize
              mountPath: /usr/local/lib/python3.11/site-packages/sitecustomize.py
              subPath: sitecustomize.py
              readOnly: true
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:latest
          workingDir: /app/backend
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e

              trim() {
                value="$1"
                value="${value#"${value%%[![:space:]]*}"}"
                value="${value%"${value##*[![:space:]]}"}"
                printf '%s' "$value"
              }

              has_env_assignments() {
                file="$1"
                while IFS= read -r line || [ -n "$line" ]; do
                  case "$line" in
                    ""|\#*|\;*) continue ;;
                    *"="*) return 0 ;;
                  esac
                done < "$file"
                return 1
              }

              has_props_assignments() {
                file="$1"
                while IFS= read -r line || [ -n "$line" ]; do
                  case "$line" in
                    ""|\#*|\;*) continue ;;
                    *"="*|*":"*) return 0 ;;
                  esac
                done < "$file"
                return 1
              }

              CONFIG_ENV="/config/openwebui.env"
              CONFIG_PROPS="/config/openwebui.properties"

              loaded_any=0

              if [ -f "$CONFIG_ENV" ] && has_env_assignments "$CONFIG_ENV"; then
                echo "Loading OpenWebUI env config from $CONFIG_ENV"
                set -a
                . "$CONFIG_ENV"
                set +a
                loaded_any=1
              fi

              if [ -f "$CONFIG_PROPS" ] && has_props_assignments "$CONFIG_PROPS"; then
                echo "Loading OpenWebUI properties config from $CONFIG_PROPS"
                while IFS= read -r line || [ -n "$line" ]; do
                  case "$line" in
                    ""|\#*|\;*) continue ;;
                  esac
                  case "$line" in
                    *"="*)
                      key="${line%%=*}"
                      value="${line#*=}"
                      ;;
                    *":"*)
                      key="${line%%:*}"
                      value="${line#*:}"
                      ;;
                    *)
                      continue
                      ;;
                  esac
                  key="$(trim "$key")"
                  value="$(trim "$value")"
                  if [ -n "$key" ]; then
                    export "$key=$value"
                  fi
                done < "$CONFIG_PROPS"
                loaded_any=1
              fi

              if [ "$loaded_any" -eq 0 ]; then
                echo "No OpenWebUI config file found in /config; continuing with env vars"
              fi

              exec bash start.sh
          ports:
            - containerPort: 8080
          # Self-heal when Open WebUI gets into a bad DB state (e.g., Yugabyte schema version mismatch):
          # - Startup probe gates readiness/liveness until /api/config is healthy (avoids killing during cold start).
          # - Readiness removes the pod from Service when backend can’t serve.
          # - Liveness restarts the container if it stays unhealthy.
          startupProbe:
            httpGet:
              path: /api/config
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 60 # 10 minutes
          readinessProbe:
            httpGet:
              path: /api/config
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/config
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          env:
            - name: ENV
              value: "dev"
            - name: OLLAMA_BASE_URL
              value: "http://ollama.ollama.svc.cluster.local:11434"
            - name: OLLAMA_API_TIMEOUT
              value: "300"
            - name: LOG_LEVEL
              value: "debug"
            - name: WEBUI_LOG_LEVEL
              value: "debug"
            # Enable the MCP client UI in recent builds
            - name: ENABLE_MCP_CLIENT
              value: "true"
            - name: MCP_CLIENT_ENABLED
              value: "true"
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: "0"
          envFrom:
            - configMapRef:
                name: openwebui-oidc-config
            - secretRef:
                name: openwebui-db-url
            - secretRef:
                name: openwebui-oidc-secrets
            - secretRef:
                name: openwebui-openai
          volumeMounts:
            - name: openwebui-config
              mountPath: /config
              readOnly: true
            - name: webui-data
              mountPath: /app/backend/data
            - name: openwebui-sitecustomize
              mountPath: /usr/local/lib/python3.11/site-packages/sitecustomize.py
              subPath: sitecustomize.py
              readOnly: true
      volumes:
        - name: openwebui-config
          configMap:
            name: openwebui-config
        - name: webui-data
          persistentVolumeClaim:
            claimName: open-webui-data
        - name: openwebui-sitecustomize
          configMap:
            name: openwebui-sitecustomize
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: ollama
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    platform.suncoast.systems/openwebui-db-schema-compat: "v0.7"
    # Gravitee discovery
    gravitee.io/expose: "true"
    gravitee.io/context-path: "/open-webui"
    gravitee.io/auth-required: "openwebui-token"
    gravitee.io/approval-required: "admin"
    gravitee.io/token-exchange-target: "<path:secret/data/keycloak-client-id-graphql-api#value>"

    # Definition metadata (string)
    gravitee.io/description: "Open WebUI HTTP API"
    gravitee.io/version: "latest"
    gravitee.io/tags: "open-webui,ui,llm"
    gravitee.io/definition-name: "open-webui-api"
    gravitee.io/definition-summary: "Open WebUI HTTP API"
    gravitee.io/definition-description: "Open WebUI backend API"
    gravitee.io/definition-version: "latest"
    gravitee.io/definition-type: "HTTP"
    gravitee.io/definition-openapi-url: "http://open-webui-openapi.ollama.svc.cluster.local:8080/openapi.json"
    gravitee.io/definition-context-path: "/open-webui"
    gravitee.io/definition-visibility: "PUBLIC"
    gravitee.io/definition-state: "STARTED"
    gravitee.io/definition-lifecycle-state: "PUBLISHED"

    # Listener hints
    gravitee.io/definition-listener-host: "open-webui.ollama.svc.cluster.local"
    gravitee.io/definition-listener-port: "80"

    # Definition list fields (comma-separated)
    gravitee.io/definition-groups: "ai,ui"
    gravitee.io/definition-tags: "open-webui,llm,ai"
    gravitee.io/definition-labels: "internal,ui,hasura,hasura.action.roles=ai_user,hasura.async.handler=ai-service,hasura.async.operation.roles.chat.completion=ai_user"
    gravitee.io/definition-categories: "ai,ui"
    gravitee.io/definition-path-mappings: "/open-webui/*"

    # Definition JSON fields (raw JSON strings)
    gravitee.io/definition-metadata: '{"owner":"ai","slack":"#ai"}'
    gravitee.io/definition-properties: '{"tier":"prod","region":"us-central1","token_exchange_url":"http://openwebui-auth-bridge.ollama.svc.cluster.local:8080/token","token_exchange_client_id":"<path:secret/data/keycloak-client-id-graphql-api#value>","token_exchange_client_secret":"<path:secret/data/keycloak-client-secret-graphql-api#value>"}'
    gravitee.io/definition-endpoint-groups: '[{"name":"default","type":"http-proxy","sharedConfiguration":{"http":{"version":"HTTP_1_1","connectTimeout":30000,"readTimeout":300000,"idleTimeout":300000,"keepAlive":true,"keepAliveTimeout":30000,"pipelining":false,"useCompression":false,"propagateClientAcceptEncoding":false,"followRedirects":false,"maxConcurrentConnections":20}},"services":{"healthCheck":{"enabled":true,"overrideConfiguration":true,"type":"http-health-check","configuration":{"schedule":"*/30 * * * * *","target":"/","method":"GET","overrideEndpointPath":true,"headers":[],"assertion":"{#response.status == 200}","successThreshold":2,"failureThreshold":2}}},"endpoints":[{"name":"open-webui-http","type":"http-proxy","inheritConfiguration":true,"weight":1,"configuration":{"target":"http://open-webui.ollama.svc.cluster.local:80"},"secondary":false}]}]'
    gravitee.io/definition-pages: '{"swagger":{"type":"SWAGGER","name":"openapi","published":true,"visibility":"PUBLIC","homepage":false,"source":{"type":"http-fetcher","configuration":{"url":"http://open-webui-openapi.ollama.svc.cluster.local:8080/openapi.json","autoFetch":true,"fetchCron":"0 */5 * * * *","useSystemProxy":false}}}}'
    gravitee.io/definition-resources: '[]'
    gravitee.io/definition-plans: '{"open-access":{"name":"Open access","description":"No auth","security":{"type":"KEY_LESS"},"status":"PUBLISHED","validation":"AUTO","type":"API","selectionRule":"true"},"keycloak-oauth2":{"name":"Keycloak OAuth2","description":"Keycloak OAuth2 (disabled)","security":{"type":"KEY_LESS"},"status":"PUBLISHED","validation":"AUTO","type":"API","selectionRule":"false"}}'
    gravitee.io/definition-flows: '[]'
    gravitee.io/definition-response-templates: '{}'
    gravitee.io/definition-analytics: '{"enabled":true,"logging":{"condition":"true","content":{"headers":true,"payload":false,"messageHeaders":false,"messageMetadata":false,"messagePayload":false},"mode":{"entrypoint":true,"endpoint":true},"phase":{"request":true,"response":true}}}'

    # Optional overrides (leave empty to let sync controller generate)
    gravitee.io/definition-entrypoints: '[]'
  labels:
    app: open-webui
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/component: open-webui
spec:
  selector:
    app: open-webui
  ports:
    - name: http
      port: 80
      targetPort: 8080
