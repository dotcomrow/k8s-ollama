apiVersion: batch/v1
kind: Job
metadata:
  name: wait-gravitee-plans
  namespace: ollama
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "6"
    linkerd.io/inject: "disabled"
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      serviceAccountName: gravitee-plan-waiter
      restartPolicy: Never
      containers:
        - name: wait
          image: alpine/k8s:1.31.4
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              wait_plan() {
                api_name="$1"
                echo "Waiting for plan open-access on ${api_name}..."
                i=0
                while [ "$i" -lt 60 ]; do
                  plan_id="$(kubectl -n ollama get apiv4definition "$api_name" -o jsonpath='{.status.plans.open-access}' 2>/dev/null || true)"
                  if [ -n "$plan_id" ]; then
                    echo "Found plan for ${api_name}: ${plan_id}"
                    return 0
                  fi
                  i=$((i + 1))
                  sleep 5
                done
                echo "Timed out waiting for plan on ${api_name}"
                return 1
              }
              wait_plan ollama
              wait_plan open-webui

