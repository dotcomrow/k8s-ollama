# Create the "ollama" namespace
apiVersion: v1
kind: Namespace
metadata:
  name: ollama
  labels:
    app: ollama
    platform.suncoast.systems/autosize: "enabled"
    goldilocks.fairwinds.com/enabled: "true"
  annotations:
    linkerd.io/inject: enabled
    field.cattle.io/projectId: local:applications
