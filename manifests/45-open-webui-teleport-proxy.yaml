apiVersion: v1
kind: ConfigMap
metadata:
  name: open-webui-teleport-proxy
  namespace: ollama
data:
  nginx.conf: |
    events {}
    http {
      log_format main '$remote_addr - $remote_user [$time_local] "$request" $status '
                      '$body_bytes_sent "$http_referer" "$http_user_agent" '
                      'upstream:$upstream_status host:$host uri:$request_uri';
      access_log /dev/stdout main;
      map $http_upgrade $connection_upgrade {
        default upgrade;
        '' keep-alive;
      }
      server {
        listen 8080;
        server_name _;

        # Profile image endpoint (regex) - proxy directly to OpenWebUI.
        location ~* ^/users/[^/]+/profile/image$ {
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $host;

          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Sec-WebSocket-Extensions "";

          proxy_buffering off;
          proxy_request_buffering off;
          proxy_read_timeout 3600;
          proxy_send_timeout 3600;

          add_header Cache-Control "no-store, max-age=0" always;

          proxy_pass http://open-webui.ollama.svc.cluster.local:80;
        }

        # SSE endpoint - proxy directly to OpenWebUI.
        location ^~ /api/chat/completions {
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $host;

          proxy_set_header Connection "";
          proxy_set_header Accept-Encoding "";
          proxy_set_header Accept "text/event-stream";

          proxy_buffering off;
          proxy_cache off;
          proxy_request_buffering off;
          proxy_read_timeout 3600;
          proxy_send_timeout 3600;

          chunked_transfer_encoding on;
          proxy_hide_header Content-Type;
          add_header Content-Type "text/event-stream; charset=utf-8" always;
          add_header Cache-Control "no-cache";
          add_header X-Accel-Buffering "no";

          proxy_pass http://open-webui.ollama.svc.cluster.local:80;
        }

        # Everything else -> OpenWebUI directly
        location / {
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $host;

          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Sec-WebSocket-Extensions "";

          proxy_buffering off;
          proxy_request_buffering off;
          proxy_read_timeout 3600;
          proxy_send_timeout 3600;

          proxy_pass http://open-webui.ollama.svc.cluster.local:80;
        }
      }
    }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: open-webui-teleport-proxy
  namespace: ollama
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui-teleport-proxy
  namespace: ollama
  labels:
    app: open-webui-teleport-proxy
  annotations:
    # Depends on the open-webui Service existing for nginx upstream DNS resolution.
    argocd.argoproj.io/sync-wave: "4"
    reloader.stakater.com/auto: "true"
    reloader.stakater.com/configmap: "open-webui-teleport-proxy"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui-teleport-proxy
  template:
    metadata:
      labels:
        app: open-webui-teleport-proxy
    spec:
      serviceAccountName: open-webui-teleport-proxy
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: nginx-config
          configMap:
            name: open-webui-teleport-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui-teleport
  namespace: ollama
  annotations:
    teleport.dev/name: "open-webui"
    teleport.dev/protocol: "http"
    teleport.dev/public-addr: "open-webui.teleport.app.suncoast.systems"
    teleport.dev/description: "Open Web UI via Gravitee Gateway"
  labels:
    app: open-webui-teleport
    teleport.dev/enroll: "true"
spec:
  selector:
    app: open-webui-teleport-proxy
  ports:
    - name: http
      port: 80
      targetPort: 8080
