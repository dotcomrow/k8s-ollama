name: Validate Gravitee Health Checks

on:
  pull_request:
  push:
    branches:
      - prod
      - main
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Validate Gravitee health checks
        run: python scripts/validate_gravitee_healthchecks.py manifests
